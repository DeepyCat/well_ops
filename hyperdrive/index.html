<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Race with Kokeš | OPS</title>
  <link rel="icon" type="image/x-icon" href="../img/bird.png">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e5e7eb;
    }

    /* OPS Top bar */
    .top-bar-ops {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      z-index: 9999;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.85) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .back-btn-ops {
      text-decoration: none;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.25) 0%, rgba(185, 28, 28, 0.45) 100%);
      border: 1px solid #ef4444;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      font: 700 12px/1.2 Consolas, monospace;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.25);
      transition: all 0.2s ease;
    }

    .back-btn-ops:hover {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.5) 0%, rgba(220, 38, 38, 0.75) 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
    }

    .title-ops {
      font: 700 15px/1.2 Consolas, monospace;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.35);
    }

    .hint-ops {
      font: 12px/1.2 Consolas, monospace;
      color: #9ca3af;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hint-ops kbd {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f3f4f6;
      font-weight: bold;
    }

    .fs-btn-ops {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f3f4f6;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font: 700 12px/1.2 Consolas, monospace;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .fs-btn-ops:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: #fbbf24;
      color: #fbbf24;
    }

    #unity-container {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100% - 50px);
      background: #000;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    @media (max-width: 800px) {
      .hint-ops { display: none; }
    }
  </style>
</head>
<body>
  <header class="top-bar-ops">
    <div style="display:flex; align-items:center; gap: 14px;">
      <a href="../games.html" class="back-btn-ops">
        <span>⬅</span> Zpět na hry
      </a>
      <div class="title-ops">
        <span>🏎️</span> Race with Kokeš
      </div>
    </div>
    <div style="display:flex; align-items:center; gap: 12px;">
      <div class="hint-ops">
        <kbd>WASD</kbd> / <kbd>Šipky</kbd> Řízení &bull; <kbd>Mezerník</kbd> Brzda &bull; <kbd>C</kbd> Kamera
      </div>
      <button id="fsBtn" class="fs-btn-ops" title="Celá obrazovka">
        <span>⛶</span> Fullscreen
      </button>
    </div>
  </header>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-mobile-warning" style="display:none;"></div>
    <div id="unity-footer" style="display:none;">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Hyperdrive</div>
    </div>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Hyperdrive-Web.loader.js";
    var config = {
      dataUrl: buildUrl + "/Hyperdrive-Web.data",
      frameworkUrl: buildUrl + "/Hyperdrive-Web.framework.js",
      codeUrl: buildUrl + "/Hyperdrive-Web.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Abhijeet",
      productName: "Hyperdrive",
      productVersion: "1.0",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fsBtn = document.querySelector("#fsBtn");

    var activeInstance = null;

    fsBtn.addEventListener("click", () => {
      if (activeInstance) {
        activeInstance.SetFullscreen(1);
      } else {
        if (!document.fullscreenElement) {
          container.requestFullscreen?.() || container.webkitRequestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      }
    });

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        activeInstance = unityInstance;
        loadingBar.style.display = "none";
      }).catch((message) => {
        console.error("Unity load error:", message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
