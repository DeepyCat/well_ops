<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juchelka Surfers (Moddovatelná WebGL verze) - OPS Portál</title>
  <link rel="icon" type="image/x-icon" href="../../img/bird.png">
  <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
  <div class="top-nav">
    <div class="nav-group">
      <a href="../../games.html" class="btn-link">⬅ Zpět na OPS Hry</a>
      <a href="../index.html" class="btn-link origin-btn">⚡ 3D Originál (San Francisco)</a>
    </div>
    <div class="nav-group">
      <div class="skin-select-box">
        <span>👤 Skin:</span>
        <select id="skinSelector" onchange="changeSkin(this.value)">
          <option value="assets/juchelka.png">Juchelka (Default)</option>
          <option value="assets/player.png">Jake (Originál)</option>
        </select>
      </div>
    </div>
  </div>

  <canvas id="glcanvas" width="1024" height="800"></canvas>

  <div id="ModalBox" class="modal">
    <div class="modal-content">
      <h2 class='game_title' id="modal_title">Juchelka Surfers</h2>
      <p class="game_score" id="modal_score" style="display:none;"></p>
      <button class="start-btn" id="start_action_btn">Hrát</button>
      <div class="controls-hint">
        Ovládání: <kbd>A</kbd> / <kbd>D</kbd> nebo <kbd>←</kbd> / <kbd>→</kbd> pro pohyb do stran<br>
        <kbd>Mezerník</kbd> pro skok
      </div>
    </div>
  </div>

  <div id="GameScore" class="score">
    <div class="score_box">
      <h1>Skóre</h1>
      <div class="score_gain">0</div>
    </div>
  </div>

<script type="text/javascript">
  var modal = document.getElementById('ModalBox');
  var score = document.getElementById('GameScore');
  var titleEl = document.getElementById('modal_title');
  var scoreEl = document.getElementById('modal_score');
  var actionBtn = document.getElementById('start_action_btn');
  var skinSelector = document.getElementById('skinSelector');

  var savedSkin = localStorage.getItem('subway_player_skin') || 'assets/juchelka.png';
  if (skinSelector) {
    skinSelector.value = savedSkin;
  }
  window.selectedPlayerSkin = savedSkin;

  function changeSkin(skinPath) {
    localStorage.setItem('subway_player_skin', skinPath);
    window.location.reload();
  }

  var music = new sound("assets/bgmusic.mp3");

  function start() {
    modal.style.display = "flex";
    titleEl.textContent = "Juchelka Surfers";
    scoreEl.style.display = "none";
    actionBtn.textContent = "Spustit hru";
  }

  actionBtn.addEventListener("click", function() {
    if (typeof game_start !== 'undefined' && game_start) {
      document.location.reload();
    } else {
      start_box();
    }
  });

  function start_box() {
    game_start = true;
    try { music.play(); } catch(e) {}
    modal.style.display = "none";
    score.style.display = "block";
  }

  function restart_game() {
    document.location.reload();
  }

  function update_score() {
    var gainEl = document.querySelector(".score_gain");
    if (gainEl && typeof objects !== 'undefined' && objects[0]) {
      gainEl.textContent = objects[0].score;
    }
  }

  function Game_over() {
    modal.style.display = "flex";
    score.style.display = "none";

    if (game_over) {
      titleEl.textContent = "Konec hry!";
    } else if (finish) {
      titleEl.textContent = "Zvítězil jsi!";
    }

    if (typeof objects !== 'undefined' && objects[0]) {
      scoreEl.textContent = "Tvé skóre: " + objects[0].score;
      scoreEl.style.display = "block";
    }

    actionBtn.textContent = "Hrát znovu";
    try { music.stop(); } catch(e) {}
  }

  function sound(src) {
    this.sound = document.createElement("audio");
    this.sound.src = src;
    this.sound.setAttribute("preload", "auto");
    this.sound.setAttribute("controls", "none");
    this.sound.style.display = "none";
    document.body.appendChild(this.sound);
    this.play = function() {
      this.sound.play().catch(function(){});
    }
    this.stop = function() {
      this.sound.pause();
    }
  }

  start();
</script>
<script src="./libs/gl-matrix.js"></script>
<script src="./libs/jquery-3.3.1.min.js"></script>
<script src="./libs/webgl-utils.js"></script>

<script src="./src/utility.js"></script>
<script src="./src/camera.js"></script>
<script src="./src/texture.js"></script>
<script src="./src/finishline.js"></script>
<script src="./src/boost.js"></script>
<script src="./src/obstacle.js"></script>
<script src="./src/barrier.js"></script>
<script src="./src/coin.js"></script>
<script src="./src/ground.js"></script>
<script src="./src/track.js"></script>
<script src="./src/police.js"></script>
<script src="./src/player.js"></script>
<script src="./src/wall.js"></script>
<script src="./src/keyhandler.js"></script>
<script src="./src/draw.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
