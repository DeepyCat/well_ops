<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Geometry Dash | OPS</title>
  <link rel="icon" type="image/x-icon" href="../img/bird.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      background-color: #0d0f14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas { display: block; margin: 0 auto; }

    /* Top Left Navigation */
    .top-bar-ops {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 9998;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .ops-back-btn {
      text-decoration: none;
      background: linear-gradient(135deg, rgba(255, 51, 68, 0.25) 0%, rgba(180, 20, 35, 0.45) 100%);
      border: 1px solid #ff3344;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font: 700 12px/1.2 Consolas, monospace;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(255, 51, 68, 0.25);
      transition: all 0.2s ease;
    }

    .ops-back-btn:hover {
      background: linear-gradient(135deg, rgba(255, 51, 68, 0.5) 0%, rgba(220, 30, 50, 0.75) 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 51, 68, 0.45);
    }

    /* Level Selector on Top Right in OPS dark theme */
    .level-picker {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9998;
      min-width: 280px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 51, 68, 0.35);
      background: linear-gradient(135deg, rgba(22, 25, 34, 0.95), rgba(12, 14, 20, 0.95));
      color: #e5e7eb;
      font: 12px/1.4 Consolas, monospace;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 15px rgba(255, 51, 68, 0.12);
    }
    .level-picker h2 {
      font: 700 12px/1.2 Consolas, monospace;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: #ff5566;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .level-picker .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .level-picker select,
    .level-picker button {
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.5);
      color: #f3f4f6;
      padding: 6px 10px;
      font: 12px/1.2 Consolas, monospace;
      outline: none;
    }
    .level-picker select {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .level-picker select:focus {
      border-color: #ff3344;
    }
    .level-picker button {
      cursor: pointer;
      background: linear-gradient(180deg, #ff3344, #c9182b);
      color: #ffffff;
      font-weight: bold;
      border-color: rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    .level-picker button:hover {
      background: linear-gradient(180deg, #ff4d5e, #dc2626);
      transform: translateY(-1px);
      box-shadow: 0 0 10px rgba(255, 51, 68, 0.4);
    }
    .level-picker .song {
      margin-top: 8px;
      color: #9ca3af;
      font-size: 11px;
    }
    @media (max-width: 700px) {
      .level-picker {
        left: 10px;
        right: 10px;
        top: 60px;
        min-width: 0;
      }
    }
  </style>
  <script defer src="./vendor.js"></script>
  <script defer src="./game.js"></script>
  <script>
    function showBootError(message) {
      var panel = document.createElement('pre');
      panel.textContent = message;
      panel.style.position = 'fixed';
      panel.style.left = '12px';
      panel.style.right = '12px';
      panel.style.top = '12px';
      panel.style.zIndex = '99999';
      panel.style.padding = '10px 12px';
      panel.style.background = 'rgba(0,0,0,0.85)';
      panel.style.color = '#ff7878';
      panel.style.border = '1px solid #ff4d4f';
      panel.style.borderRadius = '8px';
      panel.style.font = '12px/1.4 Consolas, monospace';
      panel.style.whiteSpace = 'pre-wrap';
      document.body.appendChild(panel);
    }

    window.addEventListener('error', function (event) {
      showBootError('Runtime error: ' + (event.message || 'unknown'));
    });

    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason ? String(event.reason) : 'unknown';
      showBootError('Unhandled rejection: ' + reason);
    });

    // Max 10 levelu (1 az 10)
    var LEVELS = [
      { id: 1, name: 'Stereo Madness', song: 'StereoMadness.mp3' },
      { id: 2, name: 'Back on Track', song: 'BackOnTrack.mp3' },
      { id: 3, name: 'Polargeist', song: 'Polargeist.mp3' },
      { id: 4, name: 'Dry Out', song: 'DryOut.mp3' },
      { id: 5, name: 'Base After Base', song: 'BaseAfterBase.mp3' },
      { id: 6, name: "Can't Let Go", song: 'CantLetGo.mp3' },
      { id: 7, name: 'Jumper', song: 'Jumper.mp3' },
      { id: 8, name: 'Time Machine', song: 'TimeMachine.mp3' },
      { id: 9, name: 'Cycles', song: 'Cycles.mp3' },
      { id: 10, name: 'xStep', song: 'xStep.mp3' }
    ];

    function selectedLevelMeta() {
      var params = new URLSearchParams(window.location.search);
      var level = parseInt(params.get('level') || '1', 10);
      if (!Number.isFinite(level) || level > 10) level = 1;
      return LEVELS.find(function (entry) { return entry.id === level; }) || LEVELS[0];
    }

    function updateTitleFromQuery() {
      var meta = selectedLevelMeta();
      document.title = 'Geometry Dash | ' + meta.name;
    }

    function mountLevelSelector() {
      var meta = selectedLevelMeta();
      var wrap = document.createElement('section');
      wrap.className = 'level-picker';
      wrap.innerHTML =
        '<h2><span>🎮</span> Level Selector (1-10)</h2>' +
        '<div class="row">' +
          '<select id="gdLevelSelect"></select>' +
          '<button id="gdLevelLoad" type="button">Hrát</button>' +
        '</div>' +
        '<div class="song" id="gdSongInfo"></div>';
      document.body.appendChild(wrap);

      var select = document.getElementById('gdLevelSelect');
      var songInfo = document.getElementById('gdSongInfo');
      LEVELS.forEach(function (entry) {
        var option = document.createElement('option');
        option.value = String(entry.id);
        option.textContent = entry.id + '. ' + entry.name;
        if (entry.id === meta.id) option.selected = true;
        select.appendChild(option);
      });

      function refreshSongInfo() {
        var id = parseInt(select.value, 10);
        var current = LEVELS.find(function (entry) { return entry.id === id; }) || LEVELS[0];
        songInfo.textContent = '🎵 ' + current.song;
      }
      refreshSongInfo();
      select.addEventListener('change', refreshSongInfo);

      document.getElementById('gdLevelLoad').addEventListener('click', function () {
        var params = new URLSearchParams(window.location.search);
        params.set('level', select.value);
        window.location.search = params.toString();
      });
    }

    updateTitleFromQuery();

    window.addEventListener('load', function () {
      mountLevelSelector();
      setTimeout(function () {
        var hasCanvas = !!document.querySelector('canvas');
        if (!hasCanvas) {
          var hasPhaser = typeof window.Phaser !== 'undefined';
          showBootError('Boot watchdog: no canvas created. Phaser loaded: ' + hasPhaser);
        }
      }, 1200);
    });

    // Keep resize behavior aligned with the original runner.
    new ResizeObserver(() => {
      window.dispatchEvent(new Event('resize'));
    }).observe(document.documentElement);
  </script>
</head>
<body>
  <div class="top-bar-ops">
    <a href="../index.html" class="ops-back-btn">
      <span>⬅</span> Zpět na OPS Portál
    </a>
  </div>
</body>
</html>
