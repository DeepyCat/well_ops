<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rozcestník pro teoretické základy, praktické úlohy a prezentace.">
    <title>OPS</title>
    <style>
        body.custom-layout {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .top-row {
            display: flex;
            flex: 2;
            width: 100%;
            position: relative;
        }
        .bottom-row {
            display: flex;
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* Základní styl pro tlačítka s obrázky na pozadí */
        .choice-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), filter 0.35s ease;
        }

        /* Tmavý filtr přes obrázek, aby byl text skvěle vidět */
        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Ztmavení obrázku */
            transition: background 0.3s ease;
        }

        /* Vzhled textu uvnitř tlačítek */
        .choice-btn::after {
            content: attr(data-text);
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            background: rgba(0, 0, 0, 0.35);
            padding: 15px 30px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, background 0.3s ease;
            text-align: center;
            z-index: 1;
        }

        /* Teorie – obrázek pozadí */
        .choice-btn.teorie {
            background-image: url('img/teorie-bg.jpg');
            width: 53%;
            clip-path: polygon(0 0, 100% 0, 93% 100%, 0% 100%);
            margin-left: 0;
            z-index: 2;
        }

        /* Praxe – obrázek pozadí */
        .choice-btn.praxe {
            background-image: url('img/praxe-bg.jpg');
            width: 53%;
            clip-path: polygon(7% 0, 100% 0, 100% 100%, 0% 100%);
            margin-left: -4%;
            z-index: 1;
        }

        /* Prezentace – obrázek pozadí, rovná přes celou šířku */
        .choice-btn.prezentace {
            background-image: url('img/prezentace-bg.jpg');
            width: 100%;
            clip-path: none;
            margin-left: 0;
        }

        /* Hover efekt: zvětšení, posun nahoru a zjasnění obrázku */
        .choice-btn:hover {
            transform: translateY(-8px) scale(1.02);
            filter: brightness(1.15);
            z-index: 10;
        }

        .choice-btn:hover::before {
            background: rgba(0, 0, 0, 0.2); /* Po najetí myši obrázek mírně projasní */
        }

        .choice-btn:hover::after {
            transform: scale(1.08);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Responzivita pro mobily */
        @media screen and (max-width: 768px) {
            body.custom-layout {
                height: auto;
                overflow-y: auto;
            }
            .top-row {
                flex-direction: column;
            }
            .choice-btn.teorie, .choice-btn.praxe {
                width: 100% !important;
                clip-path: none !important;
                margin-left: 0 !important;
                height: 250px;
            }
            .choice-btn.prezentace {
                height: 250px;
            }
        }
    </style>
</head>
<body class="custom-layout">

    <!-- Horní řada: Teorie a Praxe -->
    <div class="top-row">
        <a href="teorie.html" class="choice-btn teorie" data-text="Teorie"></a>
        <a href="praxe.html" class="choice-btn praxe" data-text="Praxe"></a>
    </div>

    <!-- Dolní řada: Prezentace -->
    <div class="bottom-row">
        <a href="prezentace.html" class="choice-btn prezentace" data-text="Prezentace"></a>
    </div>

</body>
</html>
