<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="idk co tu napsat prostě nemáme rádi FUCKING OPS a tak vznikla tato stránka, kde je vše co budete potřebovat asi idk...">
    <link rel="icon" type="image/x-icon" href="img/bird.png">
    <title>OPS</title>
    <style>
        body.custom-layout {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .top-row {
            display: flex;
            flex: 2;
            width: 100%;
            position: relative;
        }
        .bottom-row {
            display: flex;
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* Základní styl pro tlačítka s obrázky na pozadí */
        .choice-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), filter 0.35s ease;
        }

        /* Tmavý filtr přes obrázek, aby byl text skvěle vidět */
        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            transition: background 0.3s ease;
        }

        /* Vzhled textu uvnitř tlačítek */
        .choice-btn::after {
            content: attr(data-text);
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            background: rgba(0, 0, 0, 0.35);
            padding: 15px 30px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, background 0.3s ease;
            text-align: center;
            z-index: 1;
        }

        /* Teorie – výchozí obrázek (Safe) */
        .choice-btn.teorie {
            background-image: url('img/teorieS-bg.jpg');
            width: 53%;
            clip-path: polygon(0 0, 100% 0, 93% 100%, 0% 100%);
            margin-left: 0;
            z-index: 2;
        }

        /* Praxe – výchozí obrázek (Safe) */
        .choice-btn.praxe {
            background-image: url('img/praxeS-bg.jpg');
            width: 53%;
            clip-path: polygon(7% 0, 100% 0, 100% 100%, 0% 100%);
            margin-left: -4%;
            z-index: 1;
        }

        /* Prezentace – výchozí obrázek (Safe) */
        .choice-btn.prezentace {
            background-image: url('img/prezentaceS-bg.jpg');
            width: 100%;
            clip-path: none;
            margin-left: 0;
        }

        /* Hover efekt: zvětšení, posun nahoru a zjasnění obrázku */
        .choice-btn:hover {
            transform: translateY(-8px) scale(1.02);
            filter: brightness(1.15);
            z-index: 10;
        }

        .choice-btn:hover::before {
            background: rgba(0, 0, 0, 0.2);
        }

        .choice-btn:hover::after {
            transform: scale(1.08);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Čisté tlačítko ♦ v rohu */
        #mode-toggle-btn {
            position: fixed;
            bottom: 5px;
            right: 5px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.2);
            color: rgba(255, 255, 255, 0.4);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            border: none;
        }

        #mode-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
        }

        .games-bar {
            position: fixed;
            bottom: 8px;
            left: 8px;
            z-index: 9999;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .game-btn {
            background: rgba(0, 0, 0, 0.55);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Consolas', monospace;
            text-decoration: none;
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .game-btn.gd {
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.35);
        }

        .game-btn.gd:hover {
            background: rgba(0, 240, 255, 0.25);
            color: #fff;
            border-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        .game-btn.stratagem {
            color: #FFE900;
            border: 1px solid rgba(255, 233, 0, 0.35);
        }

        .game-btn.stratagem:hover {
            background: rgba(255, 233, 0, 0.25);
            color: #fff;
            border-color: #FFE900;
            box-shadow: 0 0 12px rgba(255, 233, 0, 0.5);
            transform: translateY(-2px);
        }

        .game-btn.minecraft {
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .game-btn.minecraft:hover {
            background: rgba(34, 197, 94, 0.25);
            color: #fff;
            border-color: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
            transform: translateY(-2px);
        }

        /* Responzivita pro mobily */
        @media screen and (max-width: 768px) {
            body.custom-layout {
                height: auto;
                overflow-y: auto;
            }
            .top-row {
                flex-direction: column;
            }
            .choice-btn.teorie, .choice-btn.praxe {
                width: 100% !important;
                clip-path: none !important;
                margin-left: 0 !important;
                height: 250px;
            }
            .choice-btn.prezentace {
                height: 250px;
            }
        }
    </style>
</head>
<body class="custom-layout">
    <!-- Panel her v levém dolním rohu -->
    <div class="games-bar">
        <a href="gd/index.html" class="game-btn gd" title="Geometry Dash">🎮 Geometry Dash</a>
        <a href="stratagem/index.html" class="game-btn stratagem" title="Stratagem Hero Online (Helldivers 2)">⚡ Stratagem Hero</a>
        <a href="mc/index.html" class="game-btn minecraft" title="Minecraft 1.12.2 / 1.8.8 (Eaglercraft)">⛏️ Minecraft</a>
    </div>

    <!-- Čisté přepínací tlačítko -->
    <button id="mode-toggle-btn" title="Přepnout režim">♦</button>

    <!-- Horní řada: Teorie a Praxe -->
    <div class="top-row">
        <a href="teorie.html" class="choice-btn teorie" data-text="Teorie"></a>
        <a href="praxe.html" class="choice-btn praxe" data-text="Praxe"></a>
    </div>

    <!-- Dolní řada: Prezentace -->
   <div class="bottom-row">
        <a href="https://frengp.sharepoint.com/:x:/r/sites/OPST3ASKA2026/Vukov%20materily/REFER%C3%81TY-T3A2026.xlsx?d=wfb85ec39e54e4c3f956a90053bbc30f1&csf=1&web=1&e=5OsbBZ" class="choice-btn prezentace" data-text="Prezentace" target="_blank" rel="noopener noreferrer"></a>
    </div>

    <script>
        function applyMode(mode) {
            const teorieBtn = document.querySelector('.choice-btn.teorie');
            const praxeBtn = document.querySelector('.choice-btn.praxe');
            const prezentaceBtn = document.querySelector('.choice-btn.prezentace');

            if (mode === 'funny') {
                if (teorieBtn) teorieBtn.style.backgroundImage = "url('img/teorie-bg.jpg')";
                if (praxeBtn) praxeBtn.style.backgroundImage = "url('img/praxe-bg.jpg')";
                if (prezentaceBtn) prezentaceBtn.style.backgroundImage = "url('img/prezentace-bg.jpg')";
            } else {
                // safe (výchozí)
                if (teorieBtn) teorieBtn.style.backgroundImage = "url('img/teorieS-bg.jpg')";
                if (praxeBtn) praxeBtn.style.backgroundImage = "url('img/praxeS-bg.jpg')";
                if (prezentaceBtn) prezentaceBtn.style.backgroundImage = "url('img/prezentaceS-bg.jpg')";
            }
            
            localStorage.setItem('selectedBgMode', mode);
        }

        // Kliknutím na tlačítko se režim přepne na opačný
        document.getElementById('mode-toggle-btn').addEventListener('click', function() {
            const currentMode = localStorage.getItem('selectedBgMode') || 'safe';
            const newMode = (currentMode === 'safe') ? 'funny' : 'safe';
            applyMode(newMode);
        });

        // Načtení uloženého režimu při spuštění stránky (výchozí je 'safe')
        window.addEventListener('DOMContentLoaded', () => {
            const savedMode = localStorage.getItem('selectedBgMode') || 'safe';
            applyMode(savedMode);
        });
    </script>
</body>
</html>
