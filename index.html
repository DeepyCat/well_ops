    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0b0d;
            --surface: rgba(24, 24, 27, .72);
            --surface-strong: rgba(20, 20, 22, .91);
            --text: #f7f7f8;
            --muted: #b7b7bd;
            --red: #ef4444;
            --red-bright: #ff5b5b;
            --red-soft: rgba(239, 68, 68, .16);
        }

        * { box-sizing: border-box; }

        html, body { width: 100%; min-height: 100%; }

        body.custom-layout {
            margin: 0;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% 0%, rgba(150, 25, 35, .14), transparent 55%),
                var(--bg);
            font-family: Inter, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .top-row {
            display: flex;
            flex: 2;
            width: 100%;
            min-height: 0;
            position: relative;
            isolation: isolate;
        }

        .bottom-row {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
            position: relative;
        }

        .choice-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
            min-height: 0;
            text-decoration: none;
            color: var(--text);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            transition: transform .35s cubic-bezier(.2,.8,.2,1), filter .35s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .choice-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.62)),
                        linear-gradient(135deg, rgba(15,15,18,.15), rgba(150,20,30,.13));
            transition: background .3s ease;
        }

        .choice-btn::after {
            content: attr(data-text);
            display: block;
            max-width: calc(100% - 32px);
            font-size: clamp(1.5rem, 3.3vw, 2.7rem);
            font-weight: 800;
            letter-spacing: .04em;
            color: #fff;
            text-shadow: 0 3px 18px rgba(0,0,0,.7);
            background: rgba(12,12,14,.48);
            padding: .75em 1.45em;
            border-radius: 999px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.10);
            transition: transform .3s ease, background .3s ease;
            text-align: center;
            z-index: 1;
        }

        .choice-btn.teorie {
            background-image: url('img/teorieS-bg.jpg');
            width: 53%;
            clip-path: polygon(0 0, 100% 0, 93% 100%, 0% 100%);
            margin-left: 0;
            z-index: 2;
        }

        .choice-btn.praxe {
            background-image: url('img/praxeS-bg.jpg');
            width: 53%;
            clip-path: polygon(7% 0, 100% 0, 100% 100%, 0% 100%);
            margin-left: -4%;
            z-index: 1;
        }

        .choice-btn.prezentace {
            background-image: url('img/prezentaceS-bg.jpg');
            width: 100%;
            clip-path: none;
            margin-left: 0;
        }

        .choice-btn:hover {
            transform: translateY(-4px) scale(1.008);
            filter: brightness(1.08);
            z-index: 5;
        }

        .choice-btn:hover::before {
            background: linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.48)),
                        linear-gradient(135deg, rgba(15,15,18,.08), rgba(180,25,35,.18));
        }

        .choice-btn:hover::after {
            transform: scale(1.035);
            background: rgba(12,12,14,.62);
        }

        .games-bar {
            position: fixed;
            left: max(16px, env(safe-area-inset-left));
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 20;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .game-btn {
            color: #fff;
            background: rgba(15,15,17,.72);
            padding: 10px 15px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 750;
            font-family: inherit;
            text-decoration: none;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 5px 24px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.08);
            transition: transform .2s ease, background .2s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .game-btn:hover {
            background: rgba(120,20,28,.78);
            transform: translateY(-2px);
        }

        #mode-toggle-btn {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            right: max(16px, env(safe-area-inset-right));
            z-index: 20;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            background: rgba(15,15,17,.62);
            color: rgba(255,255,255,.72);
            border: 0;
            border-radius: 50%;
            font-size: 17px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: color .2s ease, background .2s ease, transform .2s ease;
        }

        #mode-toggle-btn:hover {
            color: white;
            background: rgba(150,25,35,.78);
            transform: rotate(45deg);
        }

        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--red-bright);
            outline-offset: 4px;
        }

        @media (min-width: 1500px) {
            .choice-btn::after { font-size: 2.8rem; }
        }

        @media screen and (max-width: 768px) {
            body.custom-layout {
                min-height: 100svh;
                height: auto;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .top-row {
                flex: none;
                flex-direction: column;
                gap: 12px;
                padding: 12px;
            }

            .choice-btn.teorie, .choice-btn.praxe {
                width: 100% !important;
                clip-path: none !important;
                margin-left: 0 !important;
                height: clamp(190px, 29svh, 260px);
                border-radius: 22px;
            }

            .bottom-row {
                flex: none;
                padding: 0 12px 86px;
            }

            .choice-btn.prezentace {
                height: clamp(190px, 27svh, 240px);
                border-radius: 22px;
            }

            .choice-btn::after {
                font-size: clamp(1.5rem, 7vw, 2rem);
                padding: .7em 1.25em;
            }

            .games-bar {
                left: 12px;
                bottom: max(12px, env(safe-area-inset-bottom));
            }

            .game-btn {
                min-height: 42px;
                padding: 10px 14px;
            }

            #mode-toggle-btn {
                right: 12px;
                bottom: max(12px, env(safe-area-inset-bottom));
                width: 42px;
                height: 42px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

           class="choice-btn prezentace" data-text="Prezentace" target="_blank" rel="noopener noreferrer" aria-label="Otevřít prezentace v SharePointu"></a>
    </div>

   <script>
    (() => {
        const teorieBtn = document.querySelector('.choice-btn.teorie');
        const praxeBtn = document.querySelector('.choice-btn.praxe');
        const prezentaceBtn = document.querySelector('.choice-btn.prezentace');
        const toggleBtn = document.getElementById('mode-toggle-btn');
        const STORAGE_KEY = 'selectedBgMode';

        function applyMode(mode) {
            const safeMode = mode === 'funny' ? 'funny' : 'safe';

            // funny = běžné obrázky s -bg
            // safe = obrázky s S-bg
            const suffix = safeMode === 'funny' ? '-bg' : 'S-bg';

            if (teorieBtn) {
                teorieBtn.style.backgroundImage =
                    `url('img/teorie${suffix}.jpg')`;
            }

            if (praxeBtn) {
                praxeBtn.style.backgroundImage =
                    `url('img/praxe${suffix}.jpg')`;
            }

            if (prezentaceBtn) {
                prezentaceBtn.style.backgroundImage =
                    `url('img/prezentace${suffix}.jpg')`;
            }

            try {
                localStorage.setItem(STORAGE_KEY, safeMode);
            } catch (e) {}

            toggleBtn?.setAttribute(
                'aria-label',
                safeMode === 'safe'
                    ? 'Přepnout na zábavný režim'
                    : 'Přepnout na bezpečný režim'
            );

            toggleBtn?.setAttribute(
                'title',
                safeMode === 'safe'
                    ? 'Přepnout na zábavný režim'
                    : 'Přepnout na bezpečný režim'
            );
        }

        toggleBtn?.addEventListener('click', () => {
            let currentMode = 'safe';

            try {
                currentMode = localStorage.getItem(STORAGE_KEY) || 'safe';
            } catch (e) {}

            applyMode(currentMode === 'safe' ? 'funny' : 'safe');
        });

        let savedMode = 'safe';

        try {
            savedMode = localStorage.getItem(STORAGE_KEY) || 'safe';
        } catch (e) {}

        applyMode(savedMode);
    })();
</script>

  @keyframes jai-einblenden {
    from { opacity: 0; transform: translate(-50%, -48%) scale(0.97); }

  var begruessung = 'Ahoj! Jsem JuchyAI. Zeptej se mě na cokoliv.';
  var sternSvg = '<svg class="jai-symbol" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M12 2c.8 5.2 4.8 9.2 10 10-5.2.8-9.2 4.8-10 10-.8-5.2-4.8-9.2-10-10 5.2-.8 9.2-4.8 10-10z"/></svg>';

  function starten() {
    var wurzel = document.getElementById('jai-wurzel');
    if (!wurzel) return;
    document.body.appendChild(wurzel);      // aby position: fixed nerozbil žádný rodič s transform

    var fenster = document.getElementById('jai-fenster');
    var knopf = document.getElementById('jai-knopf');
    var schliessen = document.getElementById('jai-schliessen');
    var nachrichten = document.getElementById('jai-nachrichten');
    var eingabe = document.getElementById('jai-eingabe');
    var senden = document.getElementById('jai-senden');

    var beschaeftigt = false;
    var begruesst = false;
    var letzteAntwort = -1;

    function nachUnten() { nachrichten.scrollTop = nachrichten.scrollHeight; }

    function zeileErstellen(vonBenutzer, text) {
      var zeile = document.createElement('div');
      zeile.className = 'jai-zeile' + (vonBenutzer ? ' jai-zeile-benutzer' : '');
      if (!vonBenutzer) {
        var avatar = document.createElement('span');
        avatar.className = 'jai-avatar';
        avatar.innerHTML = sternSvg;
        zeile.appendChild(avatar);
      }
      var inhalt = document.createElement('div');
      inhalt.className = 'jai-text';
      inhalt.textContent = text || '';
      zeile.appendChild(inhalt);
      nachrichten.appendChild(zeile);
      nachUnten();
      return { zeile: zeile, inhalt: inhalt };
    }

    function zufallsAntwort() {
      var i;
      do { i = Math.floor(Math.random() * antworten.length); }
      while (i === letzteAntwort && antworten.length > 1);
      letzteAntwort = i;
      return antworten[i];
    }

    function tippen(inhalt, text, index) {
      if (index < text.length) {
        inhalt.textContent += text.charAt(index);
        nachUnten();
        setTimeout(function () { tippen(inhalt, text, index + 1); }, 15 + Math.random() * 30);
      } else {
        beschaeftigt = false;
        senden.disabled = false;
        eingabe.focus();
      }
    }

    function antworten_(frage) {
      var denkt = zeileErstellen(false, '');
      denkt.inhalt.innerHTML = '<span class="jai-punkte"><span class="jai-punkt"></span><span class="jai-punkt"></span><span class="jai-punkt"></span></span>';
      nachUnten();
      setTimeout(function () {
        denkt.inhalt.textContent = '';
        tippen(denkt.inhalt, zufallsAntwort(), 0);
      }, 1200 + Math.random() * 800);
    }

    function abschicken() {
      var frage = eingabe.value.trim();
      if (!frage || beschaeftigt) return;
      beschaeftigt = true;
      senden.disabled = true;
      eingabe.value = '';
      zeileErstellen(true, frage);
      setTimeout(function () { antworten_(frage); }, 350);
    }

    function oeffnen() {
      fenster.hidden = false;
      knopf.setAttribute('aria-expanded', 'true');
      if (!begruesst) {
        begruesst = true;
        zeileErstellen(false, begruessung);
      }
      eingabe.focus();
    }

    function schliessenFenster() {
      fenster.hidden = true;
      knopf.setAttribute('aria-expanded', 'false');
      knopf.focus();
    }

    knopf.addEventListener('click', function () {
      if (fenster.hidden) oeffnen(); else schliessenFenster();
    });
    schliessen.addEventListener('click', schliessenFenster);
    senden.addEventListener('click', abschicken);
    eingabe.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); abschicken(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !fenster.hidden) schliessenFenster();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', starten);
  } else {
    starten();
  }
})();
</script>
</body>
</html>
