
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS - Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/bird.png">

    <style>
/* ===== FINÁLNÍ OPRAVA NAVIGACE ===== */

/* Průhledný kontejner přes celou obrazovku */
html body .scroll-nav {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100vh !important;
    height: 100dvh !important;

    display: block !important;

    padding: 0 !important;
    margin: 0 !important;

    background: transparent !important;
    background-color: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;

    pointer-events: none !important;
    z-index: 10000 !important;
}

/* Společné vlastnosti tlačítek */
html body .scroll-nav button {
    position: fixed !important;
    left: auto !important;
    right: 4px !important;

    width: 48px !important;
    height: 54px !important;
    min-height: 54px !important;
    margin: 0 !important;
    padding: 0 !important;

    display: block !important;

    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    outline-offset: -3px;

    pointer-events: auto !important;
    cursor: pointer !important;
    transform: none;
}

/* Horní šipka – přímo u horního okraje */
html body .scroll-nav button:first-child {
    top: 0 !important;
    bottom: auto !important;
}

/* Dolní šipka – přímo u spodního okraje */
html body .scroll-nav button:last-child {
    top: auto !important;
    bottom: 0 !important;
}

/* Vlastní vykreslení šipek */
html body .scroll-nav button::before {
    content: "" !important;
    position: absolute !important;
    left: 50% !important;
    top: 50% !important;

    width: 14px !important;
    height: 14px !important;

    border: 0 !important;
    border-top: 4px solid white !important;
    border-left: 4px solid white !important;
    border-radius: 0 !important;

    background: transparent !important;
    box-shadow: none !important;

    filter: drop-shadow(0 1px 3px black) !important;
}

/* Směr horní šipky */
html body .scroll-nav button:first-child::before {
    transform: translate(-50%, -30%) rotate(45deg) !important;
}

/* Směr dolní šipky */
html body .scroll-nav button:last-child::before {
    transform: translate(-50%, -70%) rotate(225deg) !important;
}

/* Hover bez pozadí */
html body .scroll-nav button:hover {
    background: transparent !important;
    background-color: transparent !important;
}

html body .scroll-nav button:hover::before {
    border-top-color: #22d3ee !important;
    border-left-color: #22d3ee !important;
}

@media (max-width: 700px) {
    html body .scroll-nav button {
        right: 0 !important;
        width: 40px !important;
        height: 48px !important;
        min-height: 48px !important;
    }
}
</style>
</head>

<body class="scroll-body">

    <a href="index.html" class="home-portal-btn">
        &larr; Zpět na OPS Portál
    </a>

    <nav class="scroll-nav" aria-label="Navigace mezi obrazovkami">
        <button
            type="button"
            onclick="scrollToSection(0)"
            title="První obrazovka"
            aria-label="Přejít na první obrazovku">
        </button>

        <button
            type="button"
            onclick="scrollToSection(1)"
            title="Druhá obrazovka"
            aria-label="Přejít na druhou obrazovku">
        </button>
    </nav>

    <!-- ===== PRVNÍ OBRAZOVKA ===== -->

    <section class="landing-page" id="sec-0">

        <a href="gd/index.html"
           class="choice-btn gd"
           data-text="Juchelka dash"
           aria-label="Juchelka dash"></a>

        <a href="stratagem/index.html"
           class="choice-btn hero"
           data-text="Juchelka Hero"
           aria-label="Juchelka Hero"></a>

        <a href="maturita/index.html"
           class="choice-btn maturita"
           data-text="Run From Maturita"
           aria-label="Run From Maturita"></a>

        <a href="mc/index.html"
           class="choice-btn craft"
           data-text="JuchelkaCraft"
           aria-label="JuchelkaCraft"></a>

    </section>

    <!-- ===== DRUHÁ OBRAZOVKA ===== -->

    <section class="landing-page" id="sec-1">

        <a href="hyperdrive/index.html"
           class="choice-btn race"
           data-text="Race with Kokeš"
           aria-label="Race with Kokeš"></a>

        <a href="clicker/index.html"
           class="choice-btn click"
           data-text="Maturita click"
           aria-label="Maturita click"></a>

        <a href="statistika.html"
           class="choice-btn stat"
           data-text="Statistiky"
           aria-label="Statistiky"></a>

        <a href="custom.html"
           class="choice-btn custom"
           data-text="Work in progress"
           aria-label="Reklama"></a>

    </section>

    <div
        id="opsUserBadge"
        class="ops-user-badge"
        onclick="if (window.OPS_STATS) OPS_STATS.promptUsernameModal()">
    </div>

    <script src="js/ops-stats.js"></script>

    <script>
        function scrollToSection(index) {
            const section = document.getElementById('sec-' + index);

            if (section) {
                section.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowDown' || event.key === 'PageDown') {
                event.preventDefault();

                const current =
                    window.scrollY < window.innerHeight / 2 ? 0 : 1;

                scrollToSection(Math.min(current + 1, 1));
            }

            if (event.key === 'ArrowUp' || event.key === 'PageUp') {
                event.preventDefault();

                const current =
                    window.scrollY < window.innerHeight / 2 ? 0 : 1;

                scrollToSection(Math.max(current - 1, 0));
            }
        });
    </script>

</body>
</html>
