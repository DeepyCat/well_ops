
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS - Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/bird.png">

    <style>
.home-portal-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10001;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 30px;
            background: rgba(15,23,42,0.88);
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .home-portal-btn:hover {
            background: rgba(220,38,38,0.9);
            transform: translateY(-2px);
        }
/* OPRAVA: pouze šipky, žádné pozadí sloupce */
body .scroll-nav {
    position: fixed !important;
    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    left: auto !important;
    width: 54px !important;
    height: auto !important;
    padding: 0 !important;
    margin: 0 !important;
    display: block !important;
    background: rgba(52, 52, 52, 0.218) !important;
    border: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    pointer-events: none !important;
    z-index: 99999 !important;
}

body .scroll-nav button,
body .scroll-nav button:first-child,
body .scroll-nav button:last-child {
    position: fixed !important;
    right: 0 !important;
    left: auto !important;
    width: 54px !important;
    height: 60px !important;
    min-height: 60px !important;
    max-height: 60px !important;
    margin: 0 !important;
    padding: 0 !important;
    display: block !important;
    flex: none !important;
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    transform: none !important;
    pointer-events: auto !important;
}

/* První šipka: horní okraj */
body .scroll-nav button:first-child {
    top: 0 !important;
    bottom: auto !important;
}

/* Druhá šipka: dolní okraj */
body .scroll-nav button:last-child {
    top: auto !important;
    bottom: 0 !important;
}

/* Vypnutí původních znaků a vykreslení vlastních šipek */
body .scroll-nav button {
    font-size: 0 !important;
    color: transparent !important;
}

body .scroll-nav button::before {
    content: "" !important;
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    width: 14px !important;
    height: 14px !important;
    margin: 0 !important;
    padding: 0 !important;
    border-top: 4px solid white !important;
    border-left: 4px solid white !important;
    background: transparent !important;
    filter: drop-shadow(0 1px 3px black) !important;
}

body .scroll-nav button:first-child::before {
    transform: translate(-50%, -30%) rotate(45deg) !important;
}

body .scroll-nav button:last-child::before {
    transform: translate(-50%, -70%) rotate(225deg) !important;
}
         .choice-btn.gd {
            background-image: url('gd/assets/juchelkaD.png') !important;
            background-position: center;
        }

        .choice-btn.hero {
            background-image: url('stratagem/data/Images/heroJ.png') !important;
            background-position: center;
        }

        .choice-btn.maturita {
            background-image: url('maturita/barina_run.png') !important;
            background-position: center;
        }

        .choice-btn.craft {
            background-image: url('mc/juchelka_craft.png') !important;
            background-position: 80% center;
        }

        /* ===== OBRÁZKY DRUHÉ OBRAZOVKY ===== */

        .choice-btn.race {
            background-image: url('hyperdrive/kokes_race.gif') !important;
            background-position: center;
        }

        .choice-btn.click {
            background-image: url('clicker/02_.png') !important;
            background-position: center;
        }

        .choice-btn.stat {
            background-image: none !important;
            background-color: #1e293b;
        }

        .choice-btn.custom {
            background-image: url('img/all1-b.jpg') !important;
            background-position: center;
        }

@media (max-width: 700px) {
    body .scroll-nav,
    body .scroll-nav button {
        width: 42px !important;
    }
}

</style>
</head>

<body class="scroll-body">

    <a href="index.html" class="home-portal-btn">
        &larr; Zpět na OPS Portál
    </a>

    <nav class="scroll-nav" aria-label="Navigace mezi obrazovkami">
        <button
            type="button"
            onclick="scrollToSection(0)"
            title="První obrazovka"
            aria-label="Přejít na první obrazovku">
        </button>

        <button
            type="button"
            onclick="scrollToSection(1)"
            title="Druhá obrazovka"
            aria-label="Přejít na druhou obrazovku">
        </button>
    </nav>

    <!-- ===== PRVNÍ OBRAZOVKA ===== -->

    <section class="landing-page" id="sec-0">

        <a href="gd/index.html"
           class="choice-btn gd"
           data-text="Juchelka dash"
           aria-label="Juchelka dash"></a>

        <a href="stratagem/index.html"
           class="choice-btn hero"
           data-text="Juchelka Hero"
           aria-label="Juchelka Hero"></a>

        <a href="maturita/index.html"
           class="choice-btn maturita"
           data-text="Run From Maturita"
           aria-label="Run From Maturita"></a>

        <a href="mc/index.html"
           class="choice-btn craft"
           data-text="JuchelkaCraft"
           aria-label="JuchelkaCraft"></a>

    </section>

    <!-- ===== DRUHÁ OBRAZOVKA ===== -->

    <section class="landing-page" id="sec-1">

        <a href="hyperdrive/index.html"
           class="choice-btn race"
           data-text="Race with Kokeš"
           aria-label="Race with Kokeš"></a>

        <a href="clicker/index.html"
           class="choice-btn click"
           data-text="Maturita click"
           aria-label="Maturita click"></a>

        <a href="statistika.html"
           class="choice-btn stat"
           data-text="Statistiky"
           aria-label="Statistiky"></a>

        <a href="custom.html"
           class="choice-btn custom"
           data-text="Work in progress"
           aria-label="Reklama"></a>

    </section>

    <div
        id="opsUserBadge"
        class="ops-user-badge"
        onclick="if (window.OPS_STATS) OPS_STATS.promptUsernameModal()">
    </div>

    <script src="js/ops-stats.js"></script>

    <script>
        function scrollToSection(index) {
            const section = document.getElementById('sec-' + index);

            if (section) {
                section.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowDown' || event.key === 'PageDown') {
                event.preventDefault();

                const current =
                    window.scrollY < window.innerHeight / 2 ? 0 : 1;

                scrollToSection(Math.min(current + 1, 1));
            }

            if (event.key === 'ArrowUp' || event.key === 'PageUp') {
                event.preventDefault();

                const current =
                    window.scrollY < window.innerHeight / 2 ? 0 : 1;

                scrollToSection(Math.max(current - 1, 0));
            }
        });
    </script>

</body>
</html>
