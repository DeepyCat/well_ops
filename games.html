
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS - Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/bird.png">

    <style>
        /* Plynulé scrollování */
        html {
            scroll-behavior: smooth;
        }

        /* ===== ZPĚT NA PORTÁL ===== */
        .home-portal-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10001;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 30px;
            background: rgba(15,23,42,0.88);
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .home-portal-btn:hover {
            background: rgba(220,38,38,0.9);
            transform: translateY(-2px);
        }

        /* ===== PLOVOUCÍ NAVIGAČNÍ PANEL ===== */
        body .scroll-nav {
            position: fixed !important;
            top: 50% !important;
            right: 20px !important;
            bottom: auto !important;
            left: auto !important;
            transform: translateY(-50%) !important;
            width: 48px !important;
            height: auto !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 4px !important;
            padding: 6px !important;
            margin: 0 !important;
            background: rgba(0,0,0,0.75) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            border-radius: 30px !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            pointer-events: auto !important;
            z-index: 99999 !important;
        }

        body.no-backdrop-support .scroll-nav {
            background: rgba(0,0,0,0.95) !important;
        }

        body .scroll-nav button {
            position: relative !important;
            right: auto !important;
            left: auto !important;
            top: auto !important;
            bottom: auto !important;
            width: 38px !important;
            height: 44px !important;
            min-height: 44px !important;
            max-height: 44px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 0 !important;
            padding: 0 !important;
            flex: none !important;
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            border-radius: 50% !important;
            box-shadow: none !important;
            transform: none !important;
            color: transparent !important;
            font-size: 0 !important;
            cursor: pointer !important;
            transition: background 0.2s ease !important;
        }

        body .scroll-nav button:hover {
            background: rgba(255,255,255,0.15) !important;
        }

        /* Vlastní šipky */
        body .scroll-nav button::before {
            content: "" !important;
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            width: 10px !important;
            height: 10px !important;
            margin: 0 !important;
            padding: 0 !important;
            border-top: 3px solid white !important;
            border-left: 3px solid white !important;
            background: transparent !important;
            filter: drop-shadow(0 1px 2px black) !important;
            pointer-events: none !important;
        }

        body .scroll-nav button:first-child::before {
            transform: translate(-50%, -30%) rotate(45deg) !important;
        }

        body .scroll-nav button:last-child::before {
            transform: translate(-50%, -70%) rotate(225deg) !important;
        }

        body .scroll-nav button:hover::before {
            border-color: #22d3ee !important;
        }

        body .scroll-nav button:focus-visible {
            outline: 2px solid #22d3ee !important;
            outline-offset: -2px !important;
        }

        /* ===== PRVNÍ OBRAZOVKA ===== */

        /* Juchelka Dash */
        .choice-btn.gd {
            background-image: url('gd/assets/juchelkaD.png') !important;
            background-position: center;
        }

        /* Juchelka Hero */
        .choice-btn.hero {
            background-image: url('stratagem/data/Images/heroJ.png') !important;
            background-position: center;
        }

        /* KASINO OPS – nové umístění */
        .choice-btn.maturita {
            background-image:
                linear-gradient(
                    180deg,
                    rgba(10,8,15,0.05),
                    rgba(10,8,15,0.48)
                ),
                url('kasino/img/kasino-bg.png') !important;
            background-position: center;
            background-size: cover;
            background-color: #2a0f1a;
        }

        /* JuchelkaCraft */
        .choice-btn.craft {
            background-image: url('mc/juchelka_craft.png') !important;
            background-position: 80% center;
        }

        /* ===== DRUHÁ OBRAZOVKA ===== */

        /* Race with Kokeš */
        .choice-btn.race {
            background-image: url('hyperdrive/kokes_race.gif') !important;
            background-position: center;
        }

        /* Maturita Click */
        .choice-btn.click {
            background-image: url('clicker/02_.png') !important;
            background-position: center;
        }

        /* Statistiky */
        .choice-btn.stat {
            background-image: none !important;
            background-color: #1e293b;
        }

        /* Run From Maturita – přesunuté kasino nahrazuje maturita */
        .choice-btn.custom {
            background-image: url('maturita/barina_run.png') !important;
            background-position: center;
            background-size: cover;
        }

        /* ===== MOBIL ===== */
        @media (max-width: 700px) {
            body .scroll-nav {
                right: 10px !important;
                width: 42px !important;
            }

            body .scroll-nav button {
                width: 34px !important;
                height: 38px !important;
                min-height: 38px !important;
            }

            body .scroll-nav button::before {
                width: 8px !important;
                height: 8px !important;
                border-width: 2.5px !important;
            }

            .home-portal-btn {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }

        /* Omezení animací pro uživatele, kteří je preferují vypnuté */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .home-portal-btn {
                transition: none;
            }
        }
    </style>
</head>

<body class="scroll-body">

    <!-- Kontrola podpory backdrop-filter -->
    <script>
        if (
            !CSS.supports('backdrop-filter', 'blur(10px)') &&
            !CSS.supports('-webkit-backdrop-filter', 'blur(10px)')
        ) {
            document.body.classList.add('no-backdrop-support');
        }
    </script>

    <!-- Návrat na portál -->
    <a href="index.html" class="home-portal-btn">
        ← Zpět na OPS Portál
    </a>

    <!-- Navigace mezi obrazovkami -->
    <nav class="scroll-nav" aria-label="Navigace mezi obrazovkami">
        <button
            type="button"
            onclick="scrollToSection(0)"
            title="První obrazovka"
            aria-label="Přejít na první obrazovku">
        </button>

        <button
            type="button"
            onclick="scrollToSection(1)"
            title="Druhá obrazovka"
            aria-label="Přejít na druhou obrazovku">
        </button>
    </nav>

    <!-- ===== PRVNÍ OBRAZOVKA ===== -->
    <section class="landing-page" id="sec-0">

        <a
            href="gd/index.html"
            class="choice-btn gd"
            data-text="Juchelka dash"
            aria-label="Juchelka dash">
        </a>

        <a
            href="stratagem/index.html"
            class="choice-btn hero"
            data-text="Juchelka Hero"
            aria-label="Juchelka Hero">
        </a>

        <!-- Kasino je nyní na místě Run From Maturita -->
        <a
            href="/kasino/"
            class="choice-btn maturita"
            data-text="Kasino OPS"
            aria-label="Kasino OPS – otevřít kasino">
        </a>

        <a
            href="mc/index.html"
            class="choice-btn craft"
            data-text="JuchelkaCraft"
            aria-label="JuchelkaCraft">
        </a>

    </section>

    <!-- ===== DRUHÁ OBRAZOVKA ===== -->
    <section class="landing-page" id="sec-1">

        <a
            href="hyperdrive/index.html"
            class="choice-btn race"
            data-text="Race with Kokeš"
            aria-label="Race with Kokeš">
        </a>

        <a
            href="clicker/index.html"
            class="choice-btn click"
            data-text="Maturita click"
            aria-label="Maturita click">
        </a>

        <a
            href="statistika.html"
            class="choice-btn stat"
            data-text="Statistiky"
            aria-label="Statistiky">
        </a>

        <!-- Run From Maturita je nyní na druhé obrazovce -->
        <a
            href="maturita/index.html"
            class="choice-btn custom"
            data-text="Run From Maturita"
            aria-label="Run From Maturita">
        </a>

    </section>

    <!-- Uživatelský badge -->
    <div
        id="opsUserBadge"
        class="ops-user-badge"
        onclick="if (window.OPS_STATS) OPS_STATS.promptUsernameModal()">
    </div>

    <!-- OPS statistiky -->
    <script src="/js/ops-stats.js"></script>

    <script>
        function scrollToSection(index) {
            const section = document.getElementById('sec-' + index);

            const reducedMotion = window.matchMedia(
                '(prefers-reduced-motion: reduce)'
            ).matches;

            if (section) {
                section.scrollIntoView({
                    behavior: reducedMotion ? 'auto' : 'smooth',
                    block: 'start'
                });
            }
        }

        document.addEventListener('keydown', function (event) {
            if (
                event.key === 'ArrowDown' ||
                event.key === 'PageDown'
            ) {
                event.preventDefault();

                const current =
                    window.scrollY < window.innerHeight / 2 ? 0 : 1;

                scrollToSection(Math.min(current + 1, 1));
            }

            if (
                event.key === 'ArrowUp' ||
                event.key === 'PageUp'
            ) {
                event.preventDefault();

                const current =
                    window.scrollY < window.innerHeight / 2 ? 0 : 1;

                scrollToSection(Math.max(current - 1, 0));
            }
        });
    </script>

</body>
</html>
