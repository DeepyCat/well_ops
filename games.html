<style>
    body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
    .landing-page {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    scroll-snap-align: start;
}

.choice-btn {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    color: white;
    font-size: 2rem;
    transition: flex 0.4s ease, filter 0.4s ease, transform 0.4s ease;
    background-size: cover;
    background-position: center;
    position: relative;
}

.choice-btn::after {
    content: attr(data-text);
    font-size: 2.2rem;
    font-weight: bold;
    letter-spacing: 1px;
    color: white;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    background: rgba(0, 0, 0, 0.35);
    padding: 15px 30px;
    border-radius: 50px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    transition: transform 0.3s ease, background 0.3s ease;
    text-align: center;
}

.choice-btn:hover {
    flex: 1.4;
    filter: brightness(1.25);
    z-index: 10;
}

.choice-btn:hover::after {
    transform: scale(1.1);
    background: rgba(0, 0, 0, 0.6);
}

.choice-btn:nth-child(1) { clip-path: polygon(0 0, 100% 0, 93% 100%, 0% 100%); z-index: 4; }
.choice-btn:nth-child(2) { clip-path: polygon(7% 0, 100% 0, 93% 100%, 0% 100%); margin-left: -3%; z-index: 3; }
.choice-btn:nth-child(3) { clip-path: polygon(7% 0, 100% 0, 93% 100%, 0% 100%); margin-left: -3%; z-index: 2; }
.choice-btn:nth-child(4) { clip-path: polygon(7% 0, 100% 0, 100% 100%, 0% 100%); margin-left: -3%; z-index: 1; }

.choice-btn.rezero { background-image: url(''); background-position: 80% 50%; }
.choice-btn.mushoku { background-image: url(''); background-position: 80% 50%; }
.choice-btn.konosuba { background-image: url('mc/juchelka_craft.png'); background-position: 80% 50%; }
.choice-btn.yuri { background-image: url('img/yuri-bg.jpg'); background-position: 50% 50%; }

    <script>
        function scrollToSection(index) {
            const sections = document.querySelectorAll('.landing-page');
            if (sections[index]) {
                sections[index].scrollIntoView({ behavior: 'smooth' });
