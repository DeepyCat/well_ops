    <style>
        /* Plynulé scrollování */
        html {
            scroll-behavior: smooth;
        }

        /* ===== ZPĚT NA PORTÁL ===== */
        .home-portal-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10001;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 30px;
            background: rgba(15,23,42,0.88);
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .home-portal-btn:hover {
            background: rgba(220,38,38,0.9);
            transform: translateY(-2px);
        }

        /* ===== PLOVOUCÍ NAVIGAČNÍ PANEL ===== */
        body .scroll-nav {
            position: fixed !important;
            top: 50% !important;
            right: 20px !important;
            bottom: auto !important;
            left: auto !important;
            transform: translateY(-50%) !important;
            width: 48px !important;
            height: auto !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 4px !important;
            padding: 6px !important;
            margin: 0 !important;
            background: rgba(0,0,0,0.75) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            border-radius: 30px !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            pointer-events: auto !important;
            z-index: 99999 !important;
        }

        body.no-backdrop-support .scroll-nav {
            background: rgba(0,0,0,0.95) !important;
        }

        body .scroll-nav button {
            position: relative !important;
            right: auto !important;
            left: auto !important;
            top: auto !important;
            bottom: auto !important;
            width: 38px !important;
            height: 44px !important;
            min-height: 44px !important;
            max-height: 44px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 0 !important;
            padding: 0 !important;
            flex: none !important;
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            border-radius: 50% !important;
            box-shadow: none !important;
            transform: none !important;
            color: transparent !important;
            font-size: 0 !important;
            cursor: pointer !important;
            transition: background 0.2s ease !important;
        }

        body .scroll-nav button:hover {
            background: rgba(255,255,255,0.15) !important;
        }

        /* Vlastní šipky */
        body .scroll-nav button::before {
            content: "" !important;
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            width: 10px !important;
            height: 10px !important;
            margin: 0 !important;
            padding: 0 !important;
            border-top: 3px solid white !important;
            border-left: 3px solid white !important;
            background: transparent !important;
            filter: drop-shadow(0 1px 2px black) !important;
            pointer-events: none !important;
        }

        body .scroll-nav button:first-child::before {
            transform: translate(-50%, -30%) rotate(45deg) !important;
        }

        body .scroll-nav button:last-child::before {
            transform: translate(-50%, -70%) rotate(225deg) !important;
        }

        body .scroll-nav button:hover::before {
            border-color: #22d3ee !important;
        }

        body .scroll-nav button:focus-visible {
            outline: 2px solid #22d3ee !important;
            outline-offset: -2px !important;
        }

        /* ===== PRVNÍ OBRAZOVKA ===== */

        /* Juchelka Dash */
        .choice-btn.gd {
            background-image: url('gd/assets/juchelkaD.png') !important;
            background-position: center;
        }

        /* Juchelka Hero */
        .choice-btn.hero {
            background-image: url('stratagem/data/Images/heroJ.png') !important;
            background-position: center;
        }

        /* KASINO OPS – nové umístění */
        .choice-btn.maturita {
            background-image:
                linear-gradient(
                    180deg,
                    rgba(10,8,15,0.05),
                    rgba(10,8,15,0.48)
                ),
                url('kasino/img/kasino-bg.png') !important;
            background-position: center;
            background-size: cover;
            background-color: #2a0f1a;
        }

        /* JuchelkaCraft */
        .choice-btn.craft {
            background-image: url('mc/juchelka_craft.png') !important;
            background-position: 80% center;
        }

        /* ===== DRUHÁ OBRAZOVKA ===== */

        /* Race with Kokeš */
        .choice-btn.race {
            background-image: url('hyperdrive/kokes_race.gif') !important;
            background-position: center;
        }

        /* Maturita Click */
        .choice-btn.click {
            background-image: url('clicker/02_.png') !important;
            background-position: center;
        }

        /* Statistiky */
        .choice-btn.stat {
            background-image: none !important;
            background-color: #1e293b;
        }

        /* Run From Maturita – přesunuté kasino nahrazuje maturita */
        .choice-btn.custom {
            background-image: url('maturita/barina_run.png') !important;
            background-position: center;
            background-size: cover;
        }

        /* ===== MOBIL ===== */
        @media (max-width: 700px) {
            body .scroll-nav {
                right: 10px !important;
                width: 42px !important;
            }

            body .scroll-nav button {
                width: 34px !important;
                height: 38px !important;
                min-height: 38px !important;
            }

            body .scroll-nav button::before {
                width: 8px !important;
                height: 8px !important;
                border-width: 2.5px !important;
            }

            .home-portal-btn {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }

        /* Omezení animací pro uživatele, kteří je preferují vypnuté */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .home-portal-btn {
                transition: none;
            }
        }
    </style>
</head>

    <script>
        function scrollToSection(index) {
            const section = document.getElementById('sec-' + index);

            const reducedMotion = window.matchMedia(
                '(prefers-reduced-motion: reduce)'
            ).matches;

            if (section) {
                section.scrollIntoView({
                    behavior: reducedMotion ? 'auto' : 'smooth',
                    block: 'start'
                });
            }
        }

        document.addEventListener('keydown', function (event) {
            // Když se píše do JuchyAI okna, navigaci šipkami nech být
            if (event.target.closest && event.target.closest('.jai-wurzel')) return;

            if (
                event.key === 'ArrowDown' ||
                event.key === 'PageDown'
            ) {
                event.preventDefault();

                const current =
                    window.scrollY < window.innerHeight / 2 ? 0 : 1;

                scrollToSection(Math.min(current + 1, 1));
            }

            if (
                event.key === 'ArrowUp' ||
                event.key === 'PageUp'
            ) {
                event.preventDefault();

                const current =
                    window.scrollY < window.innerHeight / 2 ? 0 : 1;

                scrollToSection(Math.max(current - 1, 0));
            }
        });
    </script>

<style>
  .jai-wurzel {
    --jai-hintergrund: #212121;
    --jai-flaeche: #2f2f2f;
    --jai-blase: #3a3a3a;
    --jai-akzent: #10a37f;
    --jai-akzent-dunkel: #0d8c6d;
    --jai-text: #ececec;
    --jai-gedaempft: #8e8e8e;
    --jai-rand: #3d3d3d;
    --jai-schrift: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 2147483000;
    font-family: var(--jai-schrift);
    font-size: 15px;
    line-height: 1.45;
    color: var(--jai-text);
    text-align: left;
    letter-spacing: normal;
    text-transform: none;
  }
  .jai-wurzel > * { pointer-events: auto; }
  .jai-wurzel *,
  .jai-wurzel *::before,
  .jai-wurzel *::after {
    box-sizing: border-box;
  }

  /* ---------- Knopf (tlačítko "Zeptat se AI") ---------- */
  .jai-wurzel .jai-knopf {
    all: unset;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 20px 13px 16px;
    border-radius: 999px;
    background: var(--jai-akzent);
    color: #fff;
    font: 600 15px/1 var(--jai-schrift);
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .jai-wurzel .jai-knopf:hover { background: var(--jai-akzent-dunkel); }
  .jai-wurzel .jai-knopf:active { transform: scale(0.97); }
  .jai-wurzel .jai-knopf:focus-visible,
  .jai-wurzel .jai-schliessen:focus-visible,
  .jai-wurzel .jai-senden:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .jai-wurzel .jai-symbol {
    display: block;
    width: 20px;
    height: 20px;
    flex: none;
    fill: currentColor;
  }

  /* ---------- Fenster (chat okno) ---------- */
  .jai-wurzel .jai-fenster {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    max-width: calc(100vw - 24px);
    height: 540px;
    max-height: calc(100vh - 150px);
    background: var(--jai-hintergrund);
    border: 1px solid var(--jai-rand);
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    transform-origin: center;
    animation: jai-einblenden 0.18s ease-out;
  }
  .jai-wurzel .jai-fenster[hidden] { display: none; }

  @keyframes jai-einblenden {
    from { opacity: 0; transform: translate(-50%, -48%) scale(0.97); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }

  .jai-wurzel .jai-kopf {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px 14px 18px;
    border-bottom: 1px solid var(--jai-rand);
    background: var(--jai-hintergrund);
  }
  .jai-wurzel .jai-logo {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #10a37f, #2563eb);
    color: #fff;
    flex: none;
  }
  .jai-wurzel .jai-logo .jai-symbol { width: 16px; height: 16px; }
  .jai-wurzel .jai-titel {
    flex: 1;
    font: 600 16px/1.2 var(--jai-schrift);
    color: var(--jai-text);
  }
  .jai-wurzel .jai-schliessen {
    all: unset;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;

    font: 400 22px/1 var(--jai-schrift);
    cursor: pointer;

  .jai-wurzel .jai-schliessen:hover { background: var(--jai-flaeche); color: var(--jai-text); }

  /* ---------- Nachrichten ---------- */
  .jai-wurzel .jai-nachrichten {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;

    max-width: 82%;

    border-radius: 16px 16px 4px 16px;

  .jai-wurzel .jai-punkte { display: inline-flex; gap: 4px; align-items: center; height: 22px; }
  .jai-wurzel .jai-punkt {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--jai-gedaempft);
    animation: jai-huepfen 1.1s infinite ease-in-out;
  }
  .jai-wurzel .jai-punkt:nth-child(2) { animation-delay: 0.15s; }
  .jai-wurzel .jai-punkt:nth-child(3) { animation-delay: 0.3s; }
  @keyframes jai-huepfen {
    0%, 70%, 100% { opacity: 0.35; transform: translateY(0); }

  }

  .jai-wurzel .jai-eingabefeld {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--jai-flaeche);
    border-radius: 14px;
    padding: 6px 6px 6px 14px;
  }
  .jai-wurzel .jai-eingabe {
    all: unset;
    box-sizing: border-box;
    flex: 1;
    min-width: 0;
    padding: 8px 0;

    font: 400 15px/1.3 var(--jai-schrift);

  .jai-wurzel .jai-eingabe::placeholder { color: var(--jai-gedaempft); }
  .jai-wurzel .jai-senden {
    all: unset;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;

    background: var(--jai-akzent);

    cursor: pointer;

  .jai-wurzel .jai-senden[disabled] { opacity: 0.4; cursor: default; }
  .jai-wurzel .jai-hinweis {
    margin: 8px 0 0;
    padding: 0;

    color: var(--jai-gedaempft);

    .jai-wurzel .jai-fenster {

      height: 75vh;
      height: 75dvh;
      max-height: calc(100vh - 110px);

  }

  @media (prefers-reduced-motion: reduce) {
    .jai-wurzel .jai-fenster,
    .jai-wurzel .jai-punkt { animation: none; }
    .jai-wurzel .jai-knopf { transition: none; }
  }

  var begruessung = 'Ahoj! Jsem JuchyAI. Zeptej se mě na cokoliv.';
  var sternSvg = '<svg class="jai-symbol" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M12 2c.8 5.2 4.8 9.2 10 10-5.2.8-9.2 4.8-10 10-.8-5.2-4.8-9.2-10-10 5.2-.8 9.2-4.8 10-10z"/></svg>';

  function starten() {
    var wurzel = document.getElementById('jai-wurzel');
    if (!wurzel) return;
    document.body.appendChild(wurzel);      // aby position: fixed nerozbil žádný rodič s transform

    var fenster = document.getElementById('jai-fenster');
    var knopf = document.getElementById('jai-knopf');
    var schliessen = document.getElementById('jai-schliessen');
    var nachrichten = document.getElementById('jai-nachrichten');
    var eingabe = document.getElementById('jai-eingabe');
    var senden = document.getElementById('jai-senden');

    var beschaeftigt = false;
    var begruesst = false;
    var letzteAntwort = -1;

    function nachUnten() { nachrichten.scrollTop = nachrichten.scrollHeight; }

    function zeileErstellen(vonBenutzer, text) {
      var zeile = document.createElement('div');
      zeile.className = 'jai-zeile' + (vonBenutzer ? ' jai-zeile-benutzer' : '');
      if (!vonBenutzer) {
        var avatar = document.createElement('span');
        avatar.className = 'jai-avatar';
        avatar.innerHTML = sternSvg;
        zeile.appendChild(avatar);
      }
      var inhalt = document.createElement('div');
      inhalt.className = 'jai-text';
      inhalt.textContent = text || '';
      zeile.appendChild(inhalt);
      nachrichten.appendChild(zeile);
      nachUnten();
      return { zeile: zeile, inhalt: inhalt };
    }

    function zufallsAntwort() {
      var i;
      do { i = Math.floor(Math.random() * antworten.length); }
      while (i === letzteAntwort && antworten.length > 1);
      letzteAntwort = i;
      return antworten[i];
    }

    function tippen(inhalt, text, index) {
      if (index < text.length) {
        inhalt.textContent += text.charAt(index);
        nachUnten();
        setTimeout(function () { tippen(inhalt, text, index + 1); }, 15 + Math.random() * 30);
      } else {
        beschaeftigt = false;
        senden.disabled = false;
        eingabe.focus();
      }
    }

    function antworten_(frage) {
      var denkt = zeileErstellen(false, '');
      denkt.inhalt.innerHTML = '<span class="jai-punkte"><span class="jai-punkt"></span><span class="jai-punkt"></span><span class="jai-punkt"></span></span>';
      nachUnten();
      setTimeout(function () {
        denkt.inhalt.textContent = '';
        tippen(denkt.inhalt, zufallsAntwort(), 0);
      }, 1200 + Math.random() * 800);
    }

    function abschicken() {
      var frage = eingabe.value.trim();
      if (!frage || beschaeftigt) return;
      beschaeftigt = true;
      senden.disabled = true;
      eingabe.value = '';
      zeileErstellen(true, frage);
      setTimeout(function () { antworten_(frage); }, 350);
    }

    function oeffnen() {
      fenster.hidden = false;
      knopf.setAttribute('aria-expanded', 'true');
      if (!begruesst) {
        begruesst = true;
        zeileErstellen(false, begruessung);
      }
      eingabe.focus();
    }

    function schliessenFenster() {
      fenster.hidden = true;
      knopf.setAttribute('aria-expanded', 'false');
      knopf.focus();
    }

    knopf.addEventListener('click', function () {
      if (fenster.hidden) oeffnen(); else schliessenFenster();
    });
    schliessen.addEventListener('click', schliessenFenster);
    senden.addEventListener('click', abschicken);
    eingabe.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); abschicken(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !fenster.hidden) schliessenFenster();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', starten);
  } else {
    starten();
  }
})();
</script>
