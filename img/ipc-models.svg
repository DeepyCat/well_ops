<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280">
  <rect width="640" height="280" fill="#16181d" rx="10"/>
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#e2e8f0" font-weight="bold">Modely IPC: Sdílená paměť vs. Message Passing</text>

  <!-- Model 1: Shared Memory -->
  <g transform="translate(30, 50)">
    <rect width="270" height="205" rx="8" fill="#1e222b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="135" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#38bdf8" font-weight="bold">1. Sdílená paměť (Shared Memory)</text>
    <!-- Process A -->
    <rect x="20" y="45" width="95" height="45" rx="5" fill="#0369a1"/>
    <text x="67" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" font-weight="bold">Proces A</text>
    <!-- Process B -->
    <rect x="155" y="45" width="95" height="45" rx="5" fill="#0369a1"/>
    <text x="202" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" font-weight="bold">Proces B</text>
    <!-- Shared region -->
    <rect x="40" y="115" width="190" height="45" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4,2"/>
    <text x="135" y="137" text-anchor="middle" font-family="Arial" font-size="11" fill="#38bdf8" font-weight="bold">Sdílený paměťový blok</text>
    <text x="135" y="150" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">přímé čtení a zápis paměti</text>
    <!-- Arrows -->
    <line x1="67" y1="90" x2="80" y2="115" stroke="#38bdf8" stroke-width="2"/>
    <line x1="202" y1="90" x2="190" y2="115" stroke="#38bdf8" stroke-width="2"/>
    <text x="135" y="180" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">⚡ Maximální rychlost (bez přepínání kontextu)</text>
    <text x="135" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#f87171">Nutno řešit souběh (mutexy/semafory)</text>
  </g>

  <!-- Model 2: Message Passing -->
  <g transform="translate(340, 50)">
    <rect width="270" height="205" rx="8" fill="#1e222b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="135" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#f43f5e" font-weight="bold">2. Předávání zpráv (Message Passing)</text>
    <!-- Process A -->
    <rect x="20" y="45" width="95" height="45" rx="5" fill="#be123c"/>
    <text x="67" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" font-weight="bold">Proces A</text>
    <!-- Process B -->
    <rect x="155" y="45" width="95" height="45" rx="5" fill="#be123c"/>
    <text x="202" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" font-weight="bold">Proces B</text>
    <!-- Kernel Queue -->
    <rect x="40" y="115" width="190" height="45" rx="6" fill="#2a1215" stroke="#f43f5e"/>
    <text x="135" y="135" text-anchor="middle" font-family="Arial" font-size="10" fill="#f43f5e" font-weight="bold">Fronta zpráv (Jádro OS)</text>
    <text x="135" y="150" text-anchor="middle" font-family="Arial" font-size="9" fill="#fda4af">send() ➔ [Zpráva] ➔ recv()</text>
    <!-- Arrows -->
    <line x1="67" y1="90" x2="67" y2="115" stroke="#f43f5e" stroke-width="2"/>
    <line x1="202" y1="115" x2="202" y2="90" stroke="#f43f5e" stroke-width="2"/>
    <text x="135" y="180" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">✓ Vhodné i pro distribuované sítě</text>
    <text x="135" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#fbbf24">Pomalejší režie (systémová volání OS)</text>
  </g>
</svg>