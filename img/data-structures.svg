<svg xmlns="http://www.w3.org/2000/svg" width="620" height="270" viewBox="0 0 620 270">
  <rect width="620" height="270" fill="#1a1a1a" rx="10"/>
  <text x="310" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Přehled datových struktur</text>

  <defs>
    <marker id="ds-arr-blue" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="ds-arr-green" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#22c55e"/>
    </marker>
    <marker id="ds-arr-orange" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f97316"/>
    </marker>
    <marker id="ds-arr-red" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- === ARRAY (Pole) === -->
  <rect x="10" y="36" width="148" height="224" rx="8" fill="#0f1a2e" stroke="#3b82f6" stroke-width="2"/>
  <rect x="10" y="36" width="148" height="24" rx="8" fill="#1e3a6e" stroke="#3b82f6" stroke-width="2"/>
  <rect x="10" y="48" width="148" height="12" fill="#1e3a6e"/>
  <text x="84" y="52" text-anchor="middle" font-family="Arial" font-size="11" fill="#3b82f6" font-weight="bold">Pole (Array)</text>

  <!-- Array boxes -->
  <rect x="18" y="72" width="26" height="26" rx="2" fill="#1e3050" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="31" y="89" text-anchor="middle" font-family="Arial" font-size="10" fill="#7dd3fc">42</text>
  <rect x="46" y="72" width="26" height="26" rx="2" fill="#1e3050" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="59" y="89" text-anchor="middle" font-family="Arial" font-size="10" fill="#7dd3fc">17</text>
  <rect x="74" y="72" width="26" height="26" rx="2" fill="#1e3050" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="87" y="89" text-anchor="middle" font-family="Arial" font-size="10" fill="#7dd3fc">8</text>
  <rect x="102" y="72" width="26" height="26" rx="2" fill="#1e3050" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="115" y="89" text-anchor="middle" font-family="Arial" font-size="10" fill="#7dd3fc">93</text>
  <rect x="130" y="72" width="26" height="26" rx="2" fill="#1e3050" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="143" y="89" text-anchor="middle" font-family="Arial" font-size="10" fill="#7dd3fc">5</text>
  <!-- Index labels -->
  <text x="31" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">[0]</text>
  <text x="59" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">[1]</text>
  <text x="87" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">[2]</text>
  <text x="115" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">[3]</text>
  <text x="143" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">[4]</text>
  <!-- Access arrow -->
  <line x1="143" y1="116" x2="143" y2="128" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ds-arr-blue)"/>
  <text x="84" y="144" text-anchor="middle" font-family="Arial" font-size="9" fill="#7dd3fc">O(1) přístup</text>
  <text x="84" y="157" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">addr = base + N × size</text>
  <text x="84" y="172" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✓ rychlý náhodný přístup</text>
  <text x="84" y="185" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✓ setříděné: bin. hledání</text>
  <text x="84" y="198" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✗ vložení = posun prvků</text>
  <text x="84" y="213" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Použití: registry, buffery</text>

  <!-- === LINKED LIST (Spojový seznam) === -->
  <rect x="166" y="36" width="148" height="224" rx="8" fill="#0d1f0d" stroke="#22c55e" stroke-width="2"/>
  <rect x="166" y="36" width="148" height="24" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <rect x="166" y="48" width="148" height="12" fill="#14532d"/>
  <text x="240" y="52" text-anchor="middle" font-family="Arial" font-size="10" fill="#22c55e" font-weight="bold">Spoj. seznam</text>

  <!-- Node 1 -->
  <rect x="172" y="72" width="34" height="28" rx="2" fill="#1a3a1a" stroke="#22c55e" stroke-width="1.2"/>
  <text x="189" y="84" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">42</text>
  <text x="189" y="94" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">next</text>
  <rect x="206" y="72" width="14" height="28" rx="1" fill="#152814" stroke="#22c55e" stroke-width="0.8"/>
  <line x1="220" y1="86" x2="234" y2="86" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ds-arr-green)"/>

  <!-- Node 2 -->
  <rect x="234" y="72" width="34" height="28" rx="2" fill="#1a3a1a" stroke="#22c55e" stroke-width="1.2"/>
  <text x="251" y="84" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">17</text>
  <text x="251" y="94" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">next</text>
  <rect x="268" y="72" width="14" height="28" rx="1" fill="#152814" stroke="#22c55e" stroke-width="0.8"/>
  <line x1="282" y1="86" x2="296" y2="86" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ds-arr-green)"/>

  <!-- Node 3 -->
  <rect x="276" y="72" width="34" height="28" rx="2" fill="#1a3a1a" stroke="#22c55e" stroke-width="1.2"/>
  <text x="293" y="84" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">8</text>
  <text x="293" y="94" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">next</text>
  <!-- NULL -->
  <rect x="310" y="79" width="1" height="14" fill="#ef4444"/>
  <text x="308" y="106" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#ef4444">NULL</text>

  <text x="240" y="130" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">bloky roztroušené v paměti</text>
  <text x="240" y="148" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✓ vložení O(1) (na začátek)</text>
  <text x="240" y="161" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✗ náhodný přístup O(n)</text>
  <text x="240" y="174" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✗ nutný průchod od head</text>
  <text x="240" y="190" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Varianty: jednosměrný,</text>
  <text x="240" y="202" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">obousměrný, cyklický</text>
  <text x="240" y="218" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Použití: procesy Windows</text>

  <!-- === STACK (Zásobník) === -->
  <rect x="322" y="36" width="148" height="224" rx="8" fill="#1e1400" stroke="#f97316" stroke-width="2"/>
  <rect x="322" y="36" width="148" height="24" rx="8" fill="#7c2d12" stroke="#f97316" stroke-width="2"/>
  <rect x="322" y="48" width="148" height="12" fill="#7c2d12"/>
  <text x="396" y="52" text-anchor="middle" font-family="Arial" font-size="11" fill="#f97316" font-weight="bold">Zásobník (LIFO)</text>

  <!-- Stack visualization -->
  <!-- push arrow (down) -->
  <text x="376" y="74" font-family="Arial" font-size="9" fill="#fb923c">push ↓</text>
  <rect x="342" y="78" width="80" height="22" rx="2" fill="#f97316" opacity="0.9"/>
  <text x="382" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">TOP → C</text>
  <rect x="342" y="101" width="80" height="22" rx="2" fill="#c2410c" opacity="0.85"/>
  <text x="382" y="116" text-anchor="middle" font-family="Arial" font-size="9" fill="#fed7aa">B</text>
  <rect x="342" y="124" width="80" height="22" rx="2" fill="#9a3412" opacity="0.8"/>
  <text x="382" y="139" text-anchor="middle" font-family="Arial" font-size="9" fill="#fdba74">A (bottom)</text>
  <!-- base line -->
  <line x1="342" y1="146" x2="422" y2="146" stroke="#f97316" stroke-width="2"/>
  <!-- pop arrow (up) -->
  <text x="430" y="93" font-family="Arial" font-size="9" fill="#fb923c">pop ↑</text>
  <line x1="426" y1="78" x2="426" y2="60" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#ds-arr-orange)"/>

  <text x="396" y="164" text-anchor="middle" font-family="Arial" font-size="9" fill="#fb923c">Last In, First Out</text>
  <text x="396" y="179" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">push / pop / empty</text>
  <text x="396" y="194" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✓ O(1) push a pop</text>
  <text x="396" y="209" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Implementace: pole / seznam</text>
  <text x="396" y="222" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Použití: zásobník volání</text>
  <text x="396" y="234" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">funkcí, zpětný chod</text>

  <!-- === HASH TABLE === -->
  <rect x="478" y="36" width="134" height="224" rx="8" fill="#1f0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="478" y="36" width="134" height="24" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <rect x="478" y="48" width="134" height="12" fill="#7f1d1d"/>
  <text x="545" y="52" text-anchor="middle" font-family="Arial" font-size="10" fill="#ef4444" font-weight="bold">Hašovací tabulka</text>

  <!-- Key → hash fn → slot -->
  <text x="545" y="72" text-anchor="middle" font-family="Arial" font-size="8" fill="#fca5a5">klíč → hash fn → slot</text>
  <!-- Slots -->
  <rect x="556" y="78" width="44" height="14" rx="1" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="578" y="89" text-anchor="middle" font-family="Arial" font-size="7" fill="#fca5a5">[0] →</text>
  <rect x="556" y="93" width="44" height="14" rx="1" fill="#3a1a1a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="578" y="104" text-anchor="middle" font-family="Arial" font-size="7" fill="#fca5a5">[1] 42</text>
  <rect x="556" y="108" width="44" height="14" rx="1" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="578" y="119" text-anchor="middle" font-family="Arial" font-size="7" fill="#fca5a5">[2] →</text>
  <rect x="556" y="123" width="44" height="14" rx="1" fill="#3a1a1a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="578" y="134" text-anchor="middle" font-family="Arial" font-size="7" fill="#fca5a5">[3] 17</text>
  <rect x="556" y="138" width="44" height="14" rx="1" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="578" y="149" text-anchor="middle" font-family="Arial" font-size="7" fill="#fca5a5">[4] →</text>
  <!-- Key label -->
  <text x="490" y="100" font-family="Arial" font-size="8" fill="#ef4444" font-weight="bold">hash</text>
  <text x="490" y="112" font-family="Arial" font-size="8" fill="#ef4444" font-weight="bold">fn(k)</text>
  <line x1="515" y1="106" x2="554" y2="106" stroke="#ef4444" stroke-width="1" marker-end="url(#ds-arr-red)"/>

  <!-- Chaining (collision) -->
  <text x="545" y="166" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">kolize → řetězení</text>
  <text x="545" y="180" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✓ O(1) průměr</text>
  <text x="545" y="193" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">✗ O(n) nejhorší případ</text>
  <text x="545" y="208" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Použití: jádro Windows</text>
  <text x="545" y="220" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">(ovladače, procesy)</text>
</svg>
