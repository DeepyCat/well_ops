  <rect x="410" y="195" width="120" height="30" rx="4" fill="#2563eb"/><text x="470" y="214" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Proces P2 běží</text>
  <rect x="30" y="195" width="120" height="30" rx="4" fill="#1e293b"/><text x="90" y="214" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">P1 čeká v Ready</text>
  <text x="280" y="232" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#777">Během přepnutí kontextu CPU nevykonává žádnou užitečnou práci uživatele (čistá režie systému)</text>
