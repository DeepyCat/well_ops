  <rect x="30" y="46" width="120" height="30" rx="4" fill="#166534"/><text x="90" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Proces P1 běží</text>
  <line x1="90" y1="76" x2="90" y2="195" stroke="#4ade80" stroke-width="2" stroke-dasharray="3,3"/>
  <rect x="410" y="46" width="120" height="30" rx="4" fill="#1e3a8a"/><text x="470" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Proces P2 čeká</text>
