  <text x="280" y="120" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#94a3b8">Režie jádra OS</text>
  <rect x="220" y="130" width="120" height="20" rx="3" fill="#222" stroke="#555"/>
  <text x="280" y="144" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaa">Plánovač vybere P2</text>
  <rect x="210" y="155" width="140" height="30" rx="4" fill="#152840" stroke="#3b82f6" stroke-width="1"/>
