<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <rect width="520" height="300" fill="#1a1a1a" rx="10"/>
  <text x="260" y="22" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Přehled funkcí operačního systému</text>

  <!-- Central OS box -->
  <rect x="208" y="118" width="104" height="44" rx="8" fill="#2a0a0a" stroke="#dc2626" stroke-width="3"/>
  <text x="260" y="137" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#dc2626" font-weight="bold">OS</text>
  <text x="260" y="153" text-anchor="middle" font-family="Arial" font-size="8" fill="#f87171">Operační systém</text>

  <!-- Spokes and labels -->
  <!-- 1. Správa procesů — top-left (blue) -->
  <line x1="215" y1="124" x2="120" y2="68" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="30" y="46" width="86" height="36" rx="5" fill="#101828" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="73" y="61" text-anchor="middle" font-family="Arial" font-size="9" fill="#3b82f6" font-weight="bold">Správa procesů</text>
  <text x="73" y="74" text-anchor="middle" font-family="Arial" font-size="7" fill="#7dd3fc">plánování, PCB</text>

  <!-- 2. Správa paměti — top (green) -->
  <line x1="248" y1="118" x2="200" y2="56" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="148" y="36" width="100" height="36" rx="5" fill="#0d1a10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="198" y="51" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e" font-weight="bold">Správa paměti</text>
  <text x="198" y="64" text-anchor="middle" font-family="Arial" font-size="7" fill="#86efac">přidělování, ochrana</text>

  <!-- 3. Správa periferií I/O — top-right (orange) -->
  <line x1="305" y1="124" x2="370" y2="68" stroke="#f97316" stroke-width="1.5"/>
  <rect x="358" y="46" width="110" height="36" rx="5" fill="#1e1208" stroke="#f97316" stroke-width="1.5"/>
  <text x="413" y="61" text-anchor="middle" font-family="Arial" font-size="9" fill="#f97316" font-weight="bold">Správa periferií I/O</text>
  <text x="413" y="74" text-anchor="middle" font-family="Arial" font-size="7" fill="#fdba74">přerušení, fronty</text>

  <!-- 4. Správa systému — right (purple) -->
  <line x1="312" y1="140" x2="404" y2="140" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="406" y="122" width="104" height="36" rx="5" fill="#1a0d2a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="458" y="137" text-anchor="middle" font-family="Arial" font-size="9" fill="#a855f7" font-weight="bold">Správa systému</text>
  <text x="458" y="150" text-anchor="middle" font-family="Arial" font-size="7" fill="#c084fc">jádro, bezpečnost</text>

  <!-- 5. Správa souborů — bottom-right (yellow) -->
  <line x1="305" y1="156" x2="370" y2="210" stroke="#eab308" stroke-width="1.5"/>
  <rect x="356" y="200" width="104" height="36" rx="5" fill="#1a1400" stroke="#eab308" stroke-width="1.5"/>
  <text x="408" y="215" text-anchor="middle" font-family="Arial" font-size="9" fill="#eab308" font-weight="bold">Správa souborů</text>
  <text x="408" y="228" text-anchor="middle" font-family="Arial" font-size="7" fill="#fde047">FS, žurnálování</text>

  <!-- 6. Správa uživatelů — bottom-left (cyan) -->
  <line x1="215" y1="156" x2="150" y2="212" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="60" y="200" width="104" height="36" rx="5" fill="#071a1e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="112" y="215" text-anchor="middle" font-family="Arial" font-size="9" fill="#06b6d4" font-weight="bold">Správa uživatelů</text>
  <text x="112" y="228" text-anchor="middle" font-family="Arial" font-size="7" fill="#67e8f9">účty, logování</text>

  <!-- 7. UI / API — bottom-center (gray) -->
  <line x1="260" y1="162" x2="260" y2="226" stroke="#888" stroke-width="1.5"/>
  <rect x="196" y="226" width="128" height="36" rx="5" fill="#1a1a1a" stroke="#888" stroke-width="1.5"/>
  <text x="260" y="241" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa" font-weight="bold">UI / API</text>
  <text x="260" y="254" text-anchor="middle" font-family="Arial" font-size="7" fill="#666">GUI, CLI, systémová volání</text>

  <!-- footer -->
  <text x="260" y="288" text-anchor="middle" font-family="Arial" font-size="8" fill="#444">OS jako správce fyzických i logických prostředků výpočetního systému</text>
</svg>
