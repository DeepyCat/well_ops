<svg xmlns="http://www.w3.org/2000/svg" width="620" height="270" viewBox="0 0 620 270">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#aaa"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#4ade80"/>
    </marker>
    <marker id="ao" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#f97316"/>
    </marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#ef4444"/>
    </marker>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="620" height="270" fill="#1a1a1a" rx="10"/>
  <text x="310" y="22" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Plánovací fronty procesů</text>

  <!-- JOB QUEUE (disk/spooler) -->
  <rect x="12" y="50" width="90" height="52" rx="5" fill="#0d1f11" stroke="#166534" stroke-width="2"/>
  <text x="57" y="68" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80" font-weight="bold">JOB QUEUE</text>
  <text x="57" y="82" text-anchor="middle" font-family="Arial" font-size="8" fill="#86efac">disk/spooler</text>
  <text x="57" y="94" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">všechny procesy</text>

  <!-- Long-term scheduler -->
  <rect x="118" y="56" width="84" height="40" rx="5" fill="#1e1a10" stroke="#f97316" stroke-width="1.5"/>
  <text x="160" y="71" text-anchor="middle" font-family="Arial" font-size="8" fill="#f97316" font-weight="bold">Long-term</text>
  <text x="160" y="82" text-anchor="middle" font-family="Arial" font-size="8" fill="#fdba74">scheduler</text>
  <text x="160" y="93" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">(job sched.)</text>

  <!-- Arrow JOB → LTS -->
  <line x1="102" y1="76" x2="117" y2="76" stroke="#4ade80" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- READY QUEUE -->
  <rect x="218" y="50" width="90" height="52" rx="5" fill="#0d1f11" stroke="#166534" stroke-width="2"/>
  <text x="263" y="68" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80" font-weight="bold">READY QUEUE</text>
  <text x="263" y="82" text-anchor="middle" font-family="Arial" font-size="8" fill="#86efac">hlavní paměť</text>
  <text x="263" y="94" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">PCB spojový seznam</text>

  <!-- Arrow LTS → READY -->
  <line x1="202" y1="76" x2="217" y2="76" stroke="#f97316" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- Short-term scheduler -->
  <rect x="324" y="56" width="84" height="40" rx="5" fill="#1e1a10" stroke="#f97316" stroke-width="1.5"/>
  <text x="366" y="71" text-anchor="middle" font-family="Arial" font-size="8" fill="#f97316" font-weight="bold">Short-term</text>
  <text x="366" y="82" text-anchor="middle" font-family="Arial" font-size="8" fill="#fdba74">scheduler</text>
  <text x="366" y="93" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">(CPU sched.)</text>

  <!-- Arrow READY → STS -->
  <line x1="308" y1="76" x2="323" y2="76" stroke="#4ade80" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- CPU box -->
  <rect x="424" y="50" width="80" height="52" rx="6" fill="#101828" stroke="#3b82f6" stroke-width="2"/>
  <text x="464" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#3b82f6" font-weight="bold">CPU</text>
  <text x="464" y="88" text-anchor="middle" font-family="Arial" font-size="8" fill="#7dd3fc">běžící proces</text>
  <text x="464" y="99" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">time-slice</text>

  <!-- Arrow STS → CPU -->
  <line x1="408" y1="76" x2="423" y2="76" stroke="#f97316" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- I/O wait queue -->
  <rect x="500" y="138" width="100" height="46" rx="5" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="550" y="156" text-anchor="middle" font-family="Arial" font-size="9" fill="#ef4444" font-weight="bold">I/O fronta</text>
  <text x="550" y="169" text-anchor="middle" font-family="Arial" font-size="8" fill="#fca5a5">čekání na V/V</text>
  <text x="550" y="180" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">(device queue)</text>

  <!-- Arrow CPU → I/O queue -->
  <line x1="504" y1="88" x2="536" y2="138" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="534" y="118" text-anchor="middle" font-family="Arial" font-size="8" fill="#ef4444">V/V req.</text>

  <!-- I/O queue → back to READY (arc) -->
  <path d="M500,161 Q420,200 263,150 Q263,130 263,102" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#ag)" stroke-dasharray="4,2"/>
  <text x="380" y="210" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">I/O dokončeno → ready</text>

  <!-- Child wait box -->
  <rect x="12" y="155" width="100" height="40" rx="5" fill="#1a1a10" stroke="#a855f7" stroke-width="1.5"/>
  <text x="62" y="172" text-anchor="middle" font-family="Arial" font-size="8" fill="#a855f7" font-weight="bold">Čekání na potomka</text>
  <text x="62" y="185" text-anchor="middle" font-family="Arial" font-size="7" fill="#c084fc">fork() / wait()</text>

  <!-- CPU → child wait -->
  <line x1="434" y1="102" x2="113" y2="165" stroke="#a855f7" stroke-width="1" marker-end="url(#a)" stroke-dasharray="3,2"/>

  <!-- interrupt → back to ready -->
  <rect x="200" y="155" width="110" height="40" rx="5" fill="#0d1828" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="255" y="172" text-anchor="middle" font-family="Arial" font-size="8" fill="#3b82f6" font-weight="bold">Přerušení (interrupt)</text>
  <text x="255" y="185" text-anchor="middle" font-family="Arial" font-size="7" fill="#7dd3fc">odebrán z CPU → ready</text>

  <!-- CPU → interrupt box -->
  <line x1="454" y1="102" x2="310" y2="155" stroke="#3b82f6" stroke-width="1" marker-end="url(#ab)" stroke-dasharray="3,2"/>
  <!-- interrupt → ready queue -->
  <line x1="255" y1="155" x2="263" y2="103" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Medium-term scheduler (swap) -->
  <rect x="116" y="200" width="100" height="40" rx="5" fill="#1e1a10" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="166" y="217" text-anchor="middle" font-family="Arial" font-size="8" fill="#f97316" font-weight="bold">Medium-term</text>
  <text x="166" y="229" text-anchor="middle" font-family="Arial" font-size="7" fill="#fdba74">swap out / swap in</text>

  <!-- swap arrows -->
  <line x1="210" y1="107" x2="200" y2="200" stroke="#f97316" stroke-width="1" marker-end="url(#ao)" stroke-dasharray="3,2"/>
  <line x1="166" y1="200" x2="210" y2="107" stroke="#f97316" stroke-width="1" marker-end="url(#ao)" stroke-dasharray="3,2"/>

  <!-- footer -->
  <text x="310" y="255" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Long-term: stupeň multiprogramování · Short-term: výběr dalšího procesu pro CPU · Medium-term: swap</text>
</svg>
