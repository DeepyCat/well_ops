<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220">
  <rect width="560" height="220" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Tři vrstvy firmware BIOS a rozhraní k OS</text>
  <rect x="30" y="50" width="150" height="135" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#60a5fa" font-weight="bold">Základní vrstva</text>
  <text x="105" y="90" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Hardwarově specifická</text>
  <rect x="40" y="102" width="130" height="24" rx="3" fill="#0f172a"/><text x="105" y="117" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#cbd5e1">Obslužné rutiny přerušení</text>
  <rect x="40" y="132" width="130" height="24" rx="3" fill="#0f172a"/><text x="105" y="147" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#cbd5e1">Pevně v ROM čipu desky</text>
  <rect x="205" y="50" width="150" height="135" rx="6" fill="#221e35" stroke="#a855f7" stroke-width="1.5"/>
  <text x="280" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#c084fc" font-weight="bold">Rozšiřující vrstva</text>
  <text x="280" y="90" text-anchor="middle" font-family="Arial" font-size="9" fill="#d8b4fe">Periferní karty</text>
  <rect x="215" y="102" width="130" height="24" rx="3" fill="#191226"/><text x="280" y="117" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#e9d5ff">Option ROM GPU</text>
  <rect x="215" y="132" width="130" height="24" rx="3" fill="#191226"/><text x="280" y="147" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#e9d5ff">PXE Network Boot ROM</text>
  <rect x="380" y="50" width="150" height="135" rx="6" fill="#142e1e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="455" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#4ade80" font-weight="bold">Uživatelská vrstva</text>
  <text x="455" y="90" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">Konfigurace &amp; OS</text>
  <rect x="390" y="102" width="130" height="24" rx="3" fill="#0d2315"/><text x="455" y="117" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#bbf7d0">CMOS/NVRAM Setup</text>
  <rect x="390" y="132" width="130" height="24" rx="3" fill="#0d2315"/><text x="455" y="147" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#bbf7d0">Předání řízení zavaděči</text>
  <text x="280" y="206" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">POST testuje integritu všech vrstev před spuštěním operačního systému</text>
</svg>