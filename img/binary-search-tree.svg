  <text x="395" y="123" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" font-weight="bold">30</text>
  <line x1="155" y1="132" x2="105" y2="165" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="175" y1="132" x2="225" y2="165" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="385" y1="132" x2="335" y2="165" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="405" y1="132" x2="455" y2="165" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="95" cy="178" r="14" fill="#14532d" stroke="#4ade80"/><text x="95" y="182" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff">5</text>
  <circle cx="235" cy="178" r="14" fill="#14532d" stroke="#4ade80"/><text x="235" y="182" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff">15</text>
