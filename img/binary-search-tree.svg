  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Binární vyhledávací strom (BST) a vyhledávání O(log N)</text>
  <circle cx="280" cy="60" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
