<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280">
  <rect width="620" height="280" fill="#16181d" rx="10"/>
  <text x="310" y="28" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#f59e0b" font-weight="bold">Synchronizace procesů: Kritická sekce &amp; Vzájemné vyloučení</text>

  <!-- Flow layout -->
  <g transform="translate(60, 55)">
    <!-- 1. Entry Section -->
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#1e222b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#38bdf8" font-weight="bold">1. Vstupní sekce</text>
    <text x="70" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#93c5fd">lock(mutex);</text>
    <text x="70" y="58" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">wait(semaphore);</text>

    <!-- Arrow -->
    <line x1="140" y1="35" x2="180" y2="35" stroke="#f59e0b" stroke-width="2"/>

    <!-- 2. Critical Section -->
    <rect x="180" y="0" width="160" height="70" rx="6" fill="#3b151e" stroke="#ef4444" stroke-width="2"/>
    <text x="260" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#f87171" font-weight="bold">2. KRITICKÁ SEKCE</text>
    <text x="260" y="44" text-anchor="middle" font-family="Arial" font-size="9" fill="#fecaca">Zápis do sdíleného zdroje</text>
    <text x="260" y="58" text-anchor="middle" font-family="Arial" font-size="9" fill="#ef4444" font-weight="bold">🔒 Jen 1 proces najednou!</text>

    <!-- Arrow -->
    <line x1="340" y1="35" x2="380" y2="35" stroke="#f59e0b" stroke-width="2"/>

    <!-- 3. Exit Section -->
    <rect x="380" y="0" width="130" height="70" rx="6" fill="#1e222b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="445" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#4ade80" font-weight="bold">3. Výstupní sekce</text>
    <text x="445" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#86efac">unlock(mutex);</text>
    <text x="445" y="58" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">signal(semaphore);</text>
  </g>

  <!-- Deadlock 4 Conditions Box -->
  <g transform="translate(60, 150)">
    <rect width="510" height="110" rx="6" fill="#1e222b" stroke="#f59e0b"/>
    <text x="255" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#f59e0b" font-weight="bold">Podmínky vzniku uváznutí (Deadlock - Coffmanovy podmínky):</text>
    <text x="20" y="50" font-family="Arial" font-size="9" fill="#e2e8f0">1. <tspan fill="#f87171" font-weight="bold">Vzájemné vyloučení:</tspan> Prostředek drží max. 1 proces</text>
    <text x="260" y="50" font-family="Arial" font-size="9" fill="#e2e8f0">2. <tspan fill="#f87171" font-weight="bold">Držení a čekání:</tspan> Proces drží zdroj a žádá další</text>
    <text x="20" y="75" font-family="Arial" font-size="9" fill="#e2e8f0">3. <tspan fill="#f87171" font-weight="bold">Neexistence preempce:</tspan> Zdroj nelze násilně odebrat</text>
    <text x="260" y="75" font-family="Arial" font-size="9" fill="#e2e8f0">4. <tspan fill="#f87171" font-weight="bold">Cirkulární čekání:</tspan> Cyklus P1 → čeká na P2 → čeká na P1</text>
    <text x="255" y="98" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">Porušení kterékoli z těchto 4 podmínek zabrání vzniku deadlocku!</text>
  </g>
</svg>