<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
  <rect width="560" height="250" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Přerušení (Interrupt) — tok události</text>
  <defs><marker id="aInt" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fbbf24"/></marker></defs>
  <!-- CPU -->
  <rect x="30" y="60" width="110" height="55" rx="6" fill="#1e2030" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="82" text-anchor="middle" font-family="Arial" font-size="12" fill="#60a5fa" font-weight="bold">CPU</text>
  <text x="85" y="100" text-anchor="middle" font-family="Arial" font-size="9" fill="#7dd3fc">vykonává program</text>
  <!-- Interrupt signal -->
  <line x1="140" y1="90" x2="195" y2="90" stroke="#fbbf24" stroke-width="2" marker-end="url(#aInt)"/>
  <text x="152" y="82" font-family="Arial" font-size="9" fill="#fbbf24">IRQ signal</text>
  <!-- Handler -->
  <rect x="195" y="60" width="130" height="55" rx="6" fill="#2a2010" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="260" y="82" text-anchor="middle" font-family="Arial" font-size="11" fill="#fbbf24" font-weight="bold">Obsluha přerušení</text>
  <text x="260" y="97" text-anchor="middle" font-family="Arial" font-size="9" fill="#fde68a">(Interrupt Handler)</text>
  <text x="260" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Interrupt Vector Table</text>
  <!-- Arrow to device -->
  <line x1="325" y1="90" x2="390" y2="90" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#aInt)"/>
  <!-- Device -->
  <rect x="390" y="60" width="140" height="55" rx="6" fill="#1a2a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="460" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#4ade80" font-weight="bold">I/O Zařízení</text>
  <text x="460" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">Klávesnice · Disk · Síť</text>
  <text x="460" y="109" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Řadič zařízení</text>
  <!-- DMA -->
  <rect x="195" y="150" width="250" height="50" rx="6" fill="#1a1a2a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="320" y="170" text-anchor="middle" font-family="Arial" font-size="11" fill="#818cf8" font-weight="bold">DMA (Direct Memory Access)</text>
  <text x="320" y="188" text-anchor="middle" font-family="Arial" font-size="9" fill="#a5b4fc">Pro velká data: přenos disk→RAM bez CPU · 1 přerušení na celý blok</text>
  <line x1="325" y1="115" x2="320" y2="150" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aInt)"/>
  <!-- Bootstrap note -->
  <rect x="30" y="150" width="155" height="50" rx="6" fill="#1a1a1a" stroke="#333"/>
  <text x="107" y="168" text-anchor="middle" font-family="Arial" font-size="9" fill="#888" font-weight="bold">Bootstrap program</text>
  <text x="107" y="183" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">ROM/EEPROM · spustí se</text>
  <text x="107" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">jako první po zapnutí</text>
  <!-- RTC -->
  <text x="280" y="232" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">RTC (Real Time Clock) — generuje pravidelná přerušení · má vlastní baterii</text>
</svg>