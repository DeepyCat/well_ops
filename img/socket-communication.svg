<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240">
  <rect width="560" height="240" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Klient–Server komunikace přes Sockety (IP adresa : Port)</text>
  <rect x="30" y="50" width="180" height="145" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#60a5fa" font-weight="bold">Host X (Klient)</text>
  <text x="120" y="88" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">IP: 192.168.1.100</text>
  <rect x="45" y="98" width="150" height="80" rx="4" fill="#0f172a" stroke="#2563eb"/>
  <text x="120" y="116" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#93c5fd">Klientský proces (Prohlížeč)</text>
  <rect x="55" y="126" width="130" height="26" rx="3" fill="#1d4ed8"/><text x="120" y="143" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">Socket: 192.168.1.100 : 50234</text>
  <text x="120" y="168" text-anchor="middle" font-family="Arial" font-size="8" fill="#cbd5e1">Dynamický port &gt; 1024</text>
  <line x1="210" y1="140" x2="350" y2="140" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="280" y="128" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac" font-weight="bold">TCP Spojení (SYN / ACK)</text>
  <text x="280" y="155" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaa">Obousměrný proud dat</text>
  <rect x="350" y="50" width="180" height="145" rx="6" fill="#142e1e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="440" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#4ade80" font-weight="bold">Host Y (Web Server)</text>
  <text x="440" y="88" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">IP: 161.25.19.8</text>
  <rect x="365" y="98" width="150" height="80" rx="4" fill="#052e16" stroke="#16a34a"/>
  <text x="440" y="116" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#bbf7d0">Web Server démon (HTTP)</text>
  <rect x="375" y="126" width="130" height="26" rx="3" fill="#15803d"/><text x="440" y="143" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">Socket: 161.25.19.8 : 80</text>
  <text x="440" y="168" text-anchor="middle" font-family="Arial" font-size="8" fill="#bbf7d0">Well-known port 80 / 443</text>
  <text x="280" y="218" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#666">Socket je koncový bod síťové komunikace určený dvojicí [IP adresa, Číslo portu]</text>
</svg>