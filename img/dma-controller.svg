<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240">
  <rect width="560" height="240" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Architektura přímého přístupu do paměti (DMA)</text>
  <rect x="30" y="50" width="110" height="75" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="78" text-anchor="middle" font-family="Arial" font-size="12" fill="#60a5fa" font-weight="bold">CPU</text>
  <text x="85" y="98" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#94a3b8">Zahájí DMA přenos</text>
  <text x="85" y="110" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#94a3b8">a pokračuje v práci</text>
  <rect x="220" y="50" width="130" height="75" rx="6" fill="#2a1e12" stroke="#f97316" stroke-width="1.5"/>
  <text x="285" y="78" text-anchor="middle" font-family="Arial" font-size="12" fill="#fb923c" font-weight="bold">DMA Řadič</text>
  <text x="285" y="98" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#fdba74">Řídí tok dat bez CPU</text>
  <text x="285" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#9a3412">Čítač bajtů + Adresní reg.</text>
  <rect x="420" y="50" width="110" height="75" rx="6" fill="#142e1e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="475" y="78" text-anchor="middle" font-family="Arial" font-size="12" fill="#4ade80" font-weight="bold">RAM (Paměť)</text>
  <text x="475" y="98" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#86efac">Přímé čtení/zápis</text>
  <rect x="220" y="155" width="130" height="55" rx="6" fill="#26162a" stroke="#ec4899" stroke-width="1.5"/>
  <text x="285" y="178" text-anchor="middle" font-family="Arial" font-size="11" fill="#f472b6" font-weight="bold">I/O Zařízení (Disk/NIC)</text>
  <text x="285" y="196" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#fbcfe8">Vyrovnávací paměť buffer</text>
  <line x1="140" y1="80" x2="220" y2="80" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="180" y="73" text-anchor="middle" font-family="Arial" font-size="8" fill="#93c5fd">1. Start DMA</text>
  <line x1="285" y1="155" x2="285" y2="125" stroke="#ec4899" stroke-width="2"/>
  <text x="325" y="143" text-anchor="middle" font-family="Arial" font-size="8" fill="#f472b6">2. Data požadavek</text>
  <line x1="350" y1="85" x2="420" y2="85" stroke="#22c55e" stroke-width="2.5"/>
  <text x="385" y="75" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">3. Přímý přenos</text>
  <path d="M 220,105 Q 180,140 140,110" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="170" y="140" text-anchor="middle" font-family="Arial" font-size="8" fill="#f87171">4. Interrupt: Hotovo</text>
  <text x="280" y="228" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">DMA minimalizuje vytížení procesoru: CPU obdrží pouze jedno přerušení po přenosu celého bloku dat</text>
</svg>