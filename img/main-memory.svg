<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230">
  <defs>
    <marker id="green-arr" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#22c55e"/>
    </marker>
    <marker id="red-arr" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#ef4444"/>
    </marker>
    <marker id="blue-arr" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="orange-arr" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="580" height="230" fill="#1a1a1a" rx="10"/>
  <text x="290" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Ochrana paměti — Base a Limit registry</text>

  <!-- CPU box -->
  <rect x="20" y="70" width="100" height="60" rx="6" fill="#101828" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="94" text-anchor="middle" font-family="Arial" font-size="11" fill="#3b82f6" font-weight="bold">CPU</text>
  <text x="70" y="112" text-anchor="middle" font-family="Arial" font-size="9" fill="#7dd3fc">logická adresa</text>

  <!-- Arrow CPU → comparator -->
  <line x1="120" y1="100" x2="178" y2="100" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue-arr)"/>

  <!-- Base register -->
  <rect x="140" y="42" width="120" height="28" rx="5" fill="#1e1a10" stroke="#f97316" stroke-width="1.5"/>
  <text x="200" y="57" text-anchor="middle" font-family="Arial" font-size="10" fill="#f97316" font-weight="bold">base register</text>
  <text x="200" y="68" text-anchor="middle" font-family="Arial" font-size="8" fill="#fdba74">nejnižší legální adresa</text>

  <!-- Limit register -->
  <rect x="140" y="138" width="120" height="28" rx="5" fill="#1e1a10" stroke="#f97316" stroke-width="1.5"/>
  <text x="200" y="153" text-anchor="middle" font-family="Arial" font-size="10" fill="#f97316" font-weight="bold">limit register</text>
  <text x="200" y="164" text-anchor="middle" font-family="Arial" font-size="8" fill="#fdba74">velikost povoleného rozsahu</text>

  <!-- Comparator box -->
  <rect x="180" y="78" width="100" height="44" rx="6" fill="#1a1a2e" stroke="#a855f7" stroke-width="2"/>
  <text x="230" y="97" text-anchor="middle" font-family="Arial" font-size="10" fill="#a855f7" font-weight="bold">Porovnání</text>
  <text x="230" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#c084fc">base ≤ addr &lt; base+limit?</text>

  <!-- base → comparator -->
  <line x1="200" y1="70" x2="215" y2="79" stroke="#f97316" stroke-width="1.5"/>
  <!-- limit → comparator -->
  <line x1="200" y1="138" x2="215" y2="121" stroke="#f97316" stroke-width="1.5"/>

  <!-- Valid path → Physical Memory -->
  <line x1="280" y1="93" x2="378" y2="93" stroke="#22c55e" stroke-width="2" marker-end="url(#green-arr)"/>
  <text x="327" y="88" text-anchor="middle" font-family="Arial" font-size="8" fill="#22c55e">✓ platná adresa</text>

  <!-- Physical Memory box -->
  <rect x="380" y="60" width="120" height="70" rx="6" fill="#0f2a1a" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="82" text-anchor="middle" font-family="Arial" font-size="11" fill="#22c55e" font-weight="bold">Fyzická paměť</text>
  <text x="440" y="98" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">logická + base</text>
  <text x="440" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">= fyzická adresa</text>
  <text x="440" y="124" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">(MMU překlad)</text>

  <!-- Invalid path → TRAP -->
  <line x1="280" y1="107" x2="378" y2="160" stroke="#ef4444" stroke-width="2" marker-end="url(#red-arr)"/>
  <text x="330" y="148" text-anchor="middle" font-family="Arial" font-size="8" fill="#ef4444">✗ neplatná</text>

  <!-- TRAP box -->
  <rect x="380" y="148" width="120" height="50" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="440" y="168" text-anchor="middle" font-family="Arial" font-size="11" fill="#ef4444" font-weight="bold">TRAP / Výjimka</text>
  <text x="440" y="184" text-anchor="middle" font-family="Arial" font-size="9" fill="#fca5a5">OS: fatal error</text>

  <!-- Footer -->
  <text x="290" y="215" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Base a limit registry smí nastavit jen OS (privilegovaná instrukce v režimu jádra)</text>
</svg>
