<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230">
  <rect width="560" height="230" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Duální režim činnosti procesoru (Dual-Mode Operation)</text>
  <rect x="30" y="48" width="500" height="65" rx="6" fill="#16253b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="50" y="70" font-family="Arial" font-size="12" fill="#38bdf8" font-weight="bold">Uživatelský režim (User Mode / Ring 3)</text>
  <text x="50" y="88" font-family="Arial" font-size="9" fill="#94a3b8">Aplikační programy • Omezený přístup k paměti • Zákaz privilegovaných instrukcí</text>
  <text x="50" y="102" font-family="Arial" font-size="8.5" fill="#64748b">Chyba v uživatelském programu způsobí pád procesu, ale nezhroutí celý systém</text>
  <line x1="180" y1="113" x2="180" y2="137" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="170" y="128" text-anchor="end" font-family="Arial" font-size="8.5" fill="#f87171">Systémové volání / Trap (Bit=0)</text>
  <line x1="380" y1="137" x2="380" y2="113" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="128" font-family="Arial" font-size="8.5" fill="#4ade80">Návrat ze syscallu (Bit=1)</text>
  <rect x="30" y="137" width="500" height="65" rx="6" fill="#361214" stroke="#ef4444" stroke-width="1.5"/>
  <text x="50" y="160" font-family="Arial" font-size="12" fill="#f87171" font-weight="bold">Režim jádra (Kernel / Supervisor Mode / Ring 0)</text>
  <text x="50" y="178" font-family="Arial" font-size="9" fill="#fca5a5">Jádro operačního systému • Přímý přístup k hardwaru • Všechny instrukce povoleny</text>
  <text x="50" y="192" font-family="Arial" font-size="8.5" fill="#7f1d1d">Správa stránek, ovladače zařízení, přepínání kontextu procesů</text>
  <text x="280" y="218" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Hardwarový bit v registru PSW určuje aktuální režim procesoru (0 = Kernel, 1 = User)</text>
</svg>