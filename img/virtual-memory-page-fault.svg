<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330">
  <rect width="660" height="330" fill="#16181d" rx="10"/>
  <text x="330" y="28" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#a855f7" font-weight="bold">Demand Paging: Mechanismus výpadku stránky (Page Fault)</text>
  
  <defs>
    <marker id="mArr" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c084fc"/></marker>
    <marker id="mArrRed" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f43f5e"/></marker>
  </defs>

  <!-- CPU -->
  <rect x="30" y="60" width="100" height="70" rx="6" fill="#1e222b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="90" text-anchor="middle" font-family="Arial" font-size="12" fill="#38bdf8" font-weight="bold">CPU</text>
  <text x="80" y="108" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Instrukce: LOAD M</text>

  <!-- Step 1: Memory access to Page Table -->
  <line x1="130" y1="95" x2="190" y2="95" stroke="#c084fc" stroke-width="2" marker-end="url(#mArr)"/>
  <text x="160" y="85" text-anchor="middle" font-family="Arial" font-size="9" fill="#c084fc">1. Reference</text>

  <!-- Page Table -->
  <rect x="195" y="55" width="130" height="135" rx="6" fill="#1e1b2e" stroke="#a855f7" stroke-width="1.5"/>
  <text x="260" y="75" text-anchor="middle" font-family="Arial" font-size="10" fill="#c084fc" font-weight="bold">Tabulka stránek</text>
  <rect x="205" y="85" width="110" height="20" fill="#3b0764"/>
  <text x="260" y="99" text-anchor="middle" font-family="monospace" font-size="9" fill="#e9d5ff">Str 0 | rámec 4 | v</text>
  <rect x="205" y="110" width="110" height="20" fill="#4c0519" stroke="#f43f5e"/>
  <text x="260" y="124" text-anchor="middle" font-family="monospace" font-size="9" fill="#fda4af">Str 1 | --- | i (invalid)</text>
  <rect x="205" y="135" width="110" height="20" fill="#3b0764"/>
  <text x="260" y="149" text-anchor="middle" font-family="monospace" font-size="9" fill="#e9d5ff">Str 2 | rámec 9 | v</text>

  <!-- Step 2: Trap to OS -->
  <path d="M 260 190 L 260 230 L 150 230" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#mArrRed)"/>
  <text x="205" y="220" text-anchor="middle" font-family="Arial" font-size="9" fill="#f43f5e" font-weight="bold">2. Trap: Page Fault!</text>

  <!-- OS Trap Handler -->
  <rect x="20" y="200" width="130" height="60" rx="6" fill="#2a1215" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="85" y="225" text-anchor="middle" font-family="Arial" font-size="11" fill="#f43f5e" font-weight="bold">Jádro OS</text>
  <text x="85" y="242" text-anchor="middle" font-family="Arial" font-size="9" fill="#fda4af">Obsluha Page Fault</text>

  <!-- Step 3: Fetch from Swap/Disk -->
  <path d="M 85 260 L 85 295 L 430 295 L 430 220" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#mArr)"/>
  <text x="250" y="290" text-anchor="middle" font-family="Arial" font-size="9" fill="#f59e0b">3. Najdi chybějící stránku na swapu / disku</text>

  <!-- Swap Storage -->
  <rect x="380" y="160" width="110" height="60" rx="6" fill="#1e222b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="435" y="185" text-anchor="middle" font-family="Arial" font-size="11" fill="#f59e0b" font-weight="bold">Swap / Disk</text>
  <text x="435" y="202" text-anchor="middle" font-family="Arial" font-size="8" fill="#cbd5e1">Záložní úložiště</text>

  <!-- Step 4: Bring into Physical Memory -->
  <path d="M 490 190 L 530 190 L 530 145" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#mArr)"/>
  <text x="560" y="170" text-anchor="middle" font-family="Arial" font-size="8" fill="#22c55e">4. Nahrát do volného rámce</text>

  <!-- Physical Memory -->
  <rect x="490" y="55" width="145" height="90" rx="6" fill="#14291e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="562" y="75" text-anchor="middle" font-family="Arial" font-size="10" fill="#4ade80" font-weight="bold">Fyzická RAM</text>
  <rect x="500" y="85" width="125" height="20" fill="#15803d" rx="2"/><text x="562" y="99" text-anchor="middle" font-size="8" fill="#fff">Rámec 4 [Stránka 0]</text>
  <rect x="500" y="110" width="125" height="20" fill="#166534" rx="2" stroke="#4ade80"/><text x="562" y="124" text-anchor="middle" font-size="8" fill="#fff">Nový Rámec [Stránka 1] ★</text>

  <!-- Step 5 & 6 -->
  <path d="M 500 65 L 340 65" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#mArr)"/>
  <text x="415" y="58" text-anchor="middle" font-family="Arial" font-size="8" fill="#38bdf8">5. Přepiš bit na v (valid)</text>
  <text x="80" y="145" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">6. Restartuj instrukci</text>
</svg>