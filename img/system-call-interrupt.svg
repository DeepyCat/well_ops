<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230">
  <rect width="560" height="230" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Obsluha systémového volání: Software Interrupt / Sysenter</text>
  <rect x="30" y="50" width="130" height="145" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#93c5fd" font-weight="bold">Uživ. aplikace</text>
  <rect x="40" y="85" width="110" height="30" rx="3" fill="#1e3a8a"/><text x="95" y="104" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">printf() / write()</text>
  <rect x="40" y="125" width="110" height="30" rx="3" fill="#1e40af"/><text x="95" y="144" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#bfdbfe">Předání reg: EAX=4</text>
  <line x1="160" y1="100" x2="210" y2="100" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="185" y="92" text-anchor="middle" font-family="Arial" font-size="8" fill="#f87171">INT 0x80 / syscall</text>
  <rect x="210" y="50" width="140" height="145" rx="5" fill="#301518" stroke="#ef4444" stroke-width="1.5"/>
  <text x="280" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#f87171" font-weight="bold">Tabulka volání</text>
  <rect x="220" y="85" width="120" height="20" fill="#451216"/><text x="280" y="98" text-anchor="middle" font-family="Arial" font-size="8" fill="#fecaca">Syscall #0: read()</text>
  <rect x="220" y="110" width="120" height="22" fill="#7f1d1d" stroke="#f87171"/><text x="280" y="125" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#fff" font-weight="bold">Syscall #4: write()</text>
  <rect x="220" y="137" width="120" height="20" fill="#451216"/><text x="280" y="150" text-anchor="middle" font-family="Arial" font-size="8" fill="#fecaca">Syscall #11: execve()</text>
  <line x1="350" y1="120" x2="400" y2="120" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="400" y="50" width="130" height="145" rx="5" fill="#142e1e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="465" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#4ade80" font-weight="bold">Ovladač / Kernel</text>
  <rect x="410" y="85" width="110" height="30" rx="3" fill="#166534"/><text x="465" y="104" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#bbf7d0">Kontrola parametrů</text>
  <rect x="410" y="125" width="110" height="30" rx="3" fill="#15803d"/><text x="465" y="144" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#fff" font-weight="bold">Zápis na hardware</text>
  <text x="280" y="215" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#666">Jádro ověří uživatelská práva k pointeru před provedením operace v Ring 0</text>
</svg>