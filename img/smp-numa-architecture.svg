<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230">
  <rect width="560" height="230" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Multiprocesorové systémy: SMP (Symetrický) vs NUMA</text>
  <rect x="25" y="48" width="240" height="155" rx="6" fill="#1e2538" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="145" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#60a5fa" font-weight="bold">SMP (Symmetric Multiprocessing)</text>
  <rect x="35" y="80" width="65" height="35" rx="3" fill="#1e3a8a"/><text x="67" y="102" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">CPU 0</text>
  <rect x="112" y="80" width="65" height="35" rx="3" fill="#1e3a8a"/><text x="145" y="102" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">CPU 1</text>
  <rect x="190" y="80" width="65" height="35" rx="3" fill="#1e3a8a"/><text x="222" y="102" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">CPU 2</text>
  <line x1="35" y1="128" x2="255" y2="128" stroke="#60a5fa" stroke-width="3"/>
  <text x="145" y="123" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#93c5fd">Sdílená systémová sběrnice</text>
  <rect x="55" y="140" width="180" height="35" rx="4" fill="#166534"/><text x="145" y="162" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Sdílená RAM (Jednotný přístup UMA)</text>
  <text x="145" y="192" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#94a3b8">Všechny procesory mají stejnou latenci přístupu k libovolné adrese</text>
  <rect x="295" y="48" width="240" height="155" rx="6" fill="#221628" stroke="#a855f7" stroke-width="1.5"/>
  <text x="415" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#c084fc" font-weight="bold">NUMA (Non-Uniform Memory Access)</text>
  <rect x="305" y="82" width="105" height="60" rx="3" fill="#301540" stroke="#9333ea"/>
  <text x="357" y="98" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#d8b4fe">Uzel 0 (Node)</text>
  <text x="332" y="122" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">CPU 0</text>
  <text x="382" y="122" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">Lokální RAM</text>
  <rect x="420" y="82" width="105" height="60" rx="3" fill="#301540" stroke="#9333ea"/>
  <text x="472" y="98" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#d8b4fe">Uzel 1 (Node)</text>
  <text x="447" y="122" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">CPU 1</text>
  <text x="497" y="122" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">Lokální RAM</text>
  <line x1="410" y1="112" x2="420" y2="112" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="415" y="160" text-anchor="middle" font-family="Arial" font-size="8" fill="#fbbf24">Propojovací sběrnice mezi uzly</text>
  <text x="415" y="182" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#d8b4fe">Přístup do vlastní RAM je rychlý, přístup do cizí RAM přes sběrnici pomalejší</text>
</svg>