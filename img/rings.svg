<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340">
  <rect width="520" height="340" fill="#1a1a1a" rx="10"/>
  <text x="260" y="30" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Bezpečnostní okruhy procesoru</text>
  <!-- Ring 3 -->
  <ellipse cx="260" cy="185" rx="220" ry="130" fill="#2a1520" stroke="#888" stroke-width="1.5"/>
  <text x="260" y="310" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">Ring 3 — User Space (aplikace, CLI, GUI)</text>
  <!-- Ring 2 -->
  <ellipse cx="260" cy="185" rx="170" ry="100" fill="#2a2015" stroke="#666" stroke-width="1.5"/>
  <text x="430" y="190" font-family="Arial" font-size="10" fill="#666">Ring 2</text>
  <!-- Ring 1 -->
  <ellipse cx="260" cy="185" rx="120" ry="70" fill="#20252a" stroke="#555" stroke-width="1.5"/>
  <text x="373" y="165" font-family="Arial" font-size="10" fill="#555">Ring 1</text>
  <!-- Ring 0 -->
  <ellipse cx="260" cy="185" rx="70" ry="40" fill="#1a2a3a" stroke="#4db8ff" stroke-width="2"/>
  <text x="260" y="181" text-anchor="middle" font-family="Arial" font-size="12" fill="#4db8ff" font-weight="bold">Ring 0</text>
  <text x="260" y="196" text-anchor="middle" font-family="Arial" font-size="9" fill="#7dd3fc">Kernel</text>
  <!-- Labels -->
  <text x="10" y="58" font-family="Arial" font-size="10" fill="#f87171">Ring 3:</text>
  <text x="60" y="58" font-family="Arial" font-size="10" fill="#aaa">bash, GUI, Word, Firefox (omezený přístup)</text>
  <text x="10" y="74" font-family="Arial" font-size="10" fill="#fbbf24">Ring 1-2:</text>
  <text x="68" y="74" font-family="Arial" font-size="10" fill="#aaa">v praxi nevyužito (některé hypervisory)</text>
  <text x="10" y="90" font-family="Arial" font-size="10" fill="#4db8ff">Ring 0:</text>
  <text x="60" y="90" font-family="Arial" font-size="10" fill="#aaa">Scheduler, Správce paměti, IPC (plná oprávnění)</text>
  <!-- Arrow from Ring3 pointing inward -->
  <line x1="170" y1="248" x2="215" y2="220" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="252" font-family="Arial" font-size="10" fill="#888">Ring 3 = nejméně privilegovaný</text>
  <line x1="330" y1="160" x2="305" y2="174" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="335" y="155" font-family="Arial" font-size="10" fill="#4db8ff">Ring 0 = nejvíce privilegovaný</text>
</svg>