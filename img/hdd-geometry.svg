<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280">
  <rect width="620" height="280" fill="#16181d" rx="10"/>
  <text x="310" y="28" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#38bdf8" font-weight="bold">Fyzická geometrie magnetického pevného disku (HDD)</text>

  <!-- Disk Platters (isometric-like circles) -->
  <g transform="translate(180, 140)">
    <!-- Outer Track -->
    <ellipse cx="0" cy="0" rx="130" ry="60" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Sector slice highlight -->
    <path d="M 0 0 L 110 -25 A 130 60 0 0 1 125 15 Z" fill="#0284c7" opacity="0.6"/>
    <!-- Middle Track -->
    <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Inner Track -->
    <ellipse cx="0" cy="0" rx="50" ry="22" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Spindle Center -->
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#38bdf8"/>
    <text x="0" y="3" text-anchor="middle" font-size="7" fill="#0f172a" font-weight="bold">Vřeteno</text>
  </g>

  <!-- Actuator Arm & Head -->
  <g transform="translate(380, 140)">
    <circle cx="60" cy="40" r="14" fill="#334155" stroke="#94a3b8"/>
    <text x="60" y="70" text-anchor="middle" font-size="9" fill="#94a3b8">Aktuátor</text>
    <!-- Arm -->
    <polygon points="60,40 -100,5 -100,-5 60,35" fill="#64748b"/>
    <!-- Head -->
    <rect x="-105" y="-5" width="12" height="10" fill="#f59e0b" rx="2"/>
    <text x="-120" y="30" font-family="Arial" font-size="9" fill="#f59e0b" font-weight="bold">Čtecí/zápisová hlava</text>
    <line x1="-100" y1="5" x2="-100" y2="20" stroke="#f59e0b"/>
  </g>

  <!-- Labels on Left -->
  <g transform="translate(35, 65)">
    <rect width="180" height="185" rx="6" fill="#1e222b" stroke="#334155"/>
    <text x="15" y="24" font-family="Arial" font-size="11" fill="#38bdf8" font-weight="bold">Základní pojmy:</text>
    <text x="15" y="48" font-family="Arial" font-size="9" fill="#e2e8f0"><tspan fill="#38bdf8" font-weight="bold">• Talíř (Platter):</tspan> magnetický disk</text>
    <text x="15" y="70" font-family="Arial" font-size="9" fill="#e2e8f0"><tspan fill="#0284c7" font-weight="bold">• Stopa (Track):</tspan> soustředná kružnice</text>
    <text x="15" y="92" font-family="Arial" font-size="9" fill="#38bdf8"><tspan fill="#38bdf8" font-weight="bold">• Sektor (Sector):</tspan> výseč stopy (512B-4KB)</text>
    <text x="15" y="114" font-family="Arial" font-size="9" fill="#e2e8f0"><tspan fill="#a855f7" font-weight="bold">• Cylindr:</tspan> stopy nad sebou na všech talířích</text>
    <line x1="15" y1="128" x2="165" y2="128" stroke="#334155"/>
    <text x="15" y="146" font-family="Arial" font-size="9" fill="#fbbf24">Doba přístupu =</text>
    <text x="15" y="162" font-family="Arial" font-size="9" fill="#94a3b8">Seek Time (pohyb hlavy) +</text>
    <text x="15" y="176" font-family="Arial" font-size="9" fill="#94a3b8">Rotační zpoždění (otčení talíře)</text>
  </g>
</svg>