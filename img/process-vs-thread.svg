<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280">
  <rect width="620" height="280" fill="#16181d" rx="10"/>
  <text x="310" y="28" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#38bdf8" font-weight="bold">Architektura paměti: Samostatný proces vs. Vícevláknový proces</text>

  <!-- Single Thread Process -->
  <g transform="translate(30, 50)">
    <rect width="250" height="205" rx="8" fill="#1e222b" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8" font-weight="bold">Jednovláknový proces</text>
    <!-- Code, Data, Files -->
    <rect x="15" y="38" width="65" height="30" fill="#0f172a" stroke="#475569" rx="3"/><text x="47" y="57" text-anchor="middle" font-size="9" fill="#cbd5e1">Kód</text>
    <rect x="90" y="38" width="65" height="30" fill="#0f172a" stroke="#475569" rx="3"/><text x="122" y="57" text-anchor="middle" font-size="9" fill="#cbd5e1">Data</text>
    <rect x="165" y="38" width="70" height="30" fill="#0f172a" stroke="#475569" rx="3"/><text x="200" y="57" text-anchor="middle" font-size="9" fill="#cbd5e1">Soubory</text>
    <!-- Single Thread Box -->
    <rect x="15" y="80" width="220" height="80" fill="#0369a1" rx="4"/>
    <text x="125" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" font-weight="bold">Vlákno 1 (Thread)</text>
    <rect x="25" y="120" width="90" height="25" fill="#0284c7" rx="2"/><text x="70" y="136" text-anchor="middle" font-size="8" fill="#fff">Registry + PC</text>
    <rect x="125" y="120" width="100" height="25" fill="#0284c7" rx="2"/><text x="175" y="136" text-anchor="middle" font-size="8" fill="#fff">Zásobník (Stack)</text>
    <text x="125" y="185" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Těžký kontext, vlastní adresní prostor</text>
  </g>

  <!-- Multi-Thread Process -->
  <g transform="translate(320, 50)">
    <rect width="270" height="205" rx="8" fill="#1e222b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="135" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="#38bdf8" font-weight="bold">Vícevláknový proces (Multithreaded)</text>
    <!-- Shared Code, Data, Files, Heap -->
    <rect x="15" y="38" width="240" height="30" fill="#0369a1" rx="3"/>
    <text x="135" y="57" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">SDÍLENO: Kód · Globální data · Halda (Heap) · Otevřené soubory</text>
    <!-- Threads -->
    <g transform="translate(15, 80)">
      <rect width="75" height="80" rx="3" fill="#0f172a" stroke="#38bdf8"/>
      <text x="37" y="20" text-anchor="middle" font-size="8" fill="#38bdf8" font-weight="bold">Vlákno A</text>
      <rect x="5" y="30" width="65" height="18" fill="#0284c7" rx="2"/><text x="37" y="42" text-anchor="middle" font-size="7" fill="#fff">PC, Regs</text>
      <rect x="5" y="52" width="65" height="18" fill="#0284c7" rx="2"/><text x="37" y="64" text-anchor="middle" font-size="7" fill="#fff">Zásobník</text>
    </g>
    <g transform="translate(97, 80)">
      <rect width="75" height="80" rx="3" fill="#0f172a" stroke="#38bdf8"/>
      <text x="37" y="20" text-anchor="middle" font-size="8" fill="#38bdf8" font-weight="bold">Vlákno B</text>
      <rect x="5" y="30" width="65" height="18" fill="#0284c7" rx="2"/><text x="37" y="42" text-anchor="middle" font-size="7" fill="#fff">PC, Regs</text>
      <rect x="5" y="52" width="65" height="18" fill="#0284c7" rx="2"/><text x="37" y="64" text-anchor="middle" font-size="7" fill="#fff">Zásobník</text>
    </g>
    <g transform="translate(180, 80)">
      <rect width="75" height="80" rx="3" fill="#0f172a" stroke="#38bdf8"/>
      <text x="37" y="20" text-anchor="middle" font-size="8" fill="#38bdf8" font-weight="bold">Vlákno C</text>
      <rect x="5" y="30" width="65" height="18" fill="#0284c7" rx="2"/><text x="37" y="42" text-anchor="middle" font-size="7" fill="#fff">PC, Regs</text>
      <rect x="5" y="52" width="65" height="18" fill="#0284c7" rx="2"/><text x="37" y="64" text-anchor="middle" font-size="7" fill="#fff">Zásobník</text>
    </g>
    <text x="135" y="185" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">⚡ Rychlé přepínání (stejný adresní prostor)</text>
    <text x="135" y="198" text-anchor="middle" font-family="Arial" font-size="8" fill="#f87171">Pád vlákna může shodit celý proces!</text>
  </g>
</svg>