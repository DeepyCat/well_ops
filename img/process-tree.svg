<svg xmlns="http://www.w3.org/2000/svg" width="580" height="270" viewBox="0 0 580 270">
  <defs>
    <marker id="ta" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#aaa"/>
    </marker>
    <marker id="tao" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="580" height="270" fill="#1a1a1a" rx="10"/>
  <text x="290" y="22" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Strom procesů — fork(), exec() a hierarchie PID</text>

  <!-- === PROCESS TREE (left half) === -->
  <!-- init PID 1 -->
  <rect x="88" y="40" width="100" height="36" rx="6" fill="#0d2a14" stroke="#22c55e" stroke-width="2"/>
  <text x="138" y="55" text-anchor="middle" font-family="Arial" font-size="11" fill="#22c55e" font-weight="bold">init</text>
  <text x="138" y="69" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">PID 1</text>

  <!-- Tree lines from init -->
  <line x1="138" y1="76" x2="138" y2="110" stroke="#555" stroke-width="1.5"/>
  <line x1="50" y1="110" x2="250" y2="110" stroke="#555" stroke-width="1.5"/>

  <!-- bash PID 234 -->
  <line x1="50" y1="110" x2="50" y2="126" stroke="#555" stroke-width="1.5"/>
  <rect x="10" y="126" width="82" height="34" rx="5" fill="#101828" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="51" y="141" text-anchor="middle" font-family="Arial" font-size="10" fill="#3b82f6" font-weight="bold">bash</text>
  <text x="51" y="153" text-anchor="middle" font-family="Arial" font-size="8" fill="#7dd3fc">PID 234</text>

  <!-- sshd PID 567 -->
  <line x1="138" y1="110" x2="138" y2="126" stroke="#555" stroke-width="1.5"/>
  <rect x="97" y="126" width="82" height="34" rx="5" fill="#101828" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="138" y="141" text-anchor="middle" font-family="Arial" font-size="10" fill="#3b82f6" font-weight="bold">sshd</text>
  <text x="138" y="153" text-anchor="middle" font-family="Arial" font-size="8" fill="#7dd3fc">PID 567</text>

  <!-- httpd PID 890 -->
  <line x1="250" y1="110" x2="250" y2="126" stroke="#555" stroke-width="1.5"/>
  <rect x="209" y="126" width="82" height="34" rx="5" fill="#101828" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="141" text-anchor="middle" font-family="Arial" font-size="10" fill="#3b82f6" font-weight="bold">httpd</text>
  <text x="250" y="153" text-anchor="middle" font-family="Arial" font-size="8" fill="#7dd3fc">PID 890</text>

  <!-- vim PID 901 (child of bash) -->
  <line x1="51" y1="160" x2="51" y2="186" stroke="#555" stroke-width="1.5"/>
  <rect x="11" y="186" width="82" height="34" rx="5" fill="#071a1e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="52" y="201" text-anchor="middle" font-family="Arial" font-size="10" fill="#06b6d4" font-weight="bold">vim</text>
  <text x="52" y="213" text-anchor="middle" font-family="Arial" font-size="8" fill="#67e8f9">PID 901</text>

  <!-- legend left -->
  <text x="138" y="250" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Strom procesů: init → bash/sshd/httpd → vim</text>

  <!-- === DIVIDER === -->
  <line x1="338" y1="36" x2="338" y2="246" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === FORK/EXEC FLOW (right half) === -->
  <text x="462" y="44" text-anchor="middle" font-family="Arial" font-size="11" fill="#f97316" font-weight="bold">fork() / exec() flow</text>

  <!-- Parent -->
  <rect x="382" y="56" width="90" height="32" rx="5" fill="#0d2a14" stroke="#22c55e" stroke-width="1.5"/>
  <text x="427" y="71" text-anchor="middle" font-family="Arial" font-size="10" fill="#22c55e" font-weight="bold">Parent</text>
  <text x="427" y="82" text-anchor="middle" font-family="Arial" font-size="8" fill="#86efac">rodičovský proc.</text>

  <!-- fork() label -->
  <line x1="427" y1="88" x2="427" y2="112" stroke="#f97316" stroke-width="2" marker-end="url(#tao)"/>
  <text x="440" y="103" font-family="Arial" font-size="9" fill="#f97316" font-weight="bold">fork()</text>

  <!-- fork splits -->
  <line x1="427" y1="112" x2="380" y2="112" stroke="#f97316" stroke-width="1.5"/>
  <line x1="427" y1="112" x2="530" y2="112" stroke="#f97316" stroke-width="1.5"/>

  <!-- Parent continues waiting -->
  <line x1="380" y1="112" x2="380" y2="130" stroke="#aaa" stroke-width="1.5" marker-end="url(#ta)"/>
  <rect x="340" y="130" width="84" height="30" rx="5" fill="#101828" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="382" y="144" text-anchor="middle" font-family="Arial" font-size="9" fill="#3b82f6" font-weight="bold">wait()</text>
  <text x="382" y="155" text-anchor="middle" font-family="Arial" font-size="7" fill="#7dd3fc">čeká na potomka</text>

  <!-- Child copy -->
  <line x1="530" y1="112" x2="530" y2="130" stroke="#f97316" stroke-width="1.5" marker-end="url(#tao)"/>
  <rect x="488" y="130" width="84" height="30" rx="5" fill="#1e1208" stroke="#f97316" stroke-width="1.5"/>
  <text x="530" y="144" text-anchor="middle" font-family="Arial" font-size="9" fill="#f97316" font-weight="bold">Child (kopie)</text>
  <text x="530" y="155" text-anchor="middle" font-family="Arial" font-size="7" fill="#fdba74">ret 0 z fork()</text>

  <!-- exec() -->
  <line x1="530" y1="160" x2="530" y2="178" stroke="#f97316" stroke-width="2" marker-end="url(#tao)"/>
  <text x="543" y="172" font-family="Arial" font-size="9" fill="#f97316" font-weight="bold">exec()</text>

  <!-- New program -->
  <rect x="488" y="178" width="84" height="30" rx="5" fill="#0d2a14" stroke="#22c55e" stroke-width="1.5"/>
  <text x="530" y="192" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e" font-weight="bold">Nový program</text>
  <text x="530" y="204" text-anchor="middle" font-family="Arial" font-size="7" fill="#86efac">přepsání prostoru</text>

  <!-- child exits, parent wakes -->
  <line x1="488" y1="193" x2="424" y2="160" stroke="#aaa" stroke-width="1" marker-end="url(#ta)" stroke-dasharray="3,2"/>
  <text x="450" y="178" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">exit() →</text>
  <text x="450" y="187" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">parent pokrač.</text>

  <!-- footer -->
  <text x="462" y="250" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">fork() kopíruje adresní prostor · exec() přepíše novým programem</text>
</svg>
