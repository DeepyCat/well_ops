<svg xmlns="http://www.w3.org/2000/svg" width="620" height="250" viewBox="0 0 620 250">
  <rect width="620" height="250" fill="#1a1a1a" rx="10"/>
  <text x="310" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Přehled souborových systémů a vrstva VFS</text>

  <!-- VFS Layer (top, full width) -->
  <rect x="14" y="40" width="592" height="38" rx="6" fill="#0f1a2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="310" y="55" text-anchor="middle" font-family="Arial" font-size="12" fill="#3b82f6" font-weight="bold">VFS — Virtual File System (abstrakce)</text>
  <text x="310" y="70" text-anchor="middle" font-family="Arial" font-size="9" fill="#7dd3fc">Jednotné rozhraní pro aplikace: open() read() write() close() — nezávisle na konkrétním FS</text>

  <!-- Arrows VFS → FS boxes -->
  <line x1="87" y1="78" x2="87" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="222" y1="78" x2="222" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="390" y1="78" x2="390" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="535" y1="78" x2="535" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ext4 box -->
  <rect x="14" y="100" width="146" height="90" rx="6" fill="#0d1f0d" stroke="#22c55e" stroke-width="1.8"/>
  <text x="87" y="118" text-anchor="middle" font-family="Arial" font-size="12" fill="#22c55e" font-weight="bold">ext4</text>
  <text x="87" y="134" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">Linux — standard</text>
  <text x="87" y="148" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">žurnálování</text>
  <text x="87" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">max. velikost: 16 TB</text>
  <text x="87" y="176" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">blok až 4 KB</text>

  <!-- NTFS box -->
  <rect x="168" y="100" width="146" height="90" rx="6" fill="#0a1e2a" stroke="#06b6d4" stroke-width="1.8"/>
  <text x="241" y="118" text-anchor="middle" font-family="Arial" font-size="12" fill="#06b6d4" font-weight="bold">NTFS</text>
  <text x="241" y="134" text-anchor="middle" font-family="Arial" font-size="9" fill="#67e8f9">Windows — standard</text>
  <text x="241" y="148" text-anchor="middle" font-family="Arial" font-size="9" fill="#67e8f9">EFS, ACL, žurnálování</text>
  <text x="241" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#67e8f9">max. velikost: 256 TB</text>
  <text x="241" y="176" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">MFT, komprimace</text>

  <!-- FAT32 box -->
  <rect x="322" y="100" width="136" height="90" rx="6" fill="#1e1400" stroke="#f97316" stroke-width="1.8"/>
  <text x="390" y="118" text-anchor="middle" font-family="Arial" font-size="12" fill="#f97316" font-weight="bold">FAT32</text>
  <text x="390" y="134" text-anchor="middle" font-family="Arial" font-size="9" fill="#fdba74">Přenositelný</text>
  <text x="390" y="148" text-anchor="middle" font-family="Arial" font-size="9" fill="#fdba74">USB, SD karty</text>
  <text x="390" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#fdba74">max. soubor: 4 GB</text>
  <text x="390" y="176" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">bez oprávnění/žurnálu</text>

  <!-- HFS+/APFS box -->
  <rect x="466" y="100" width="140" height="90" rx="6" fill="#1a0a2e" stroke="#a855f7" stroke-width="1.8"/>
  <text x="536" y="118" text-anchor="middle" font-family="Arial" font-size="11" fill="#a855f7" font-weight="bold">HFS+ / APFS</text>
  <text x="536" y="134" text-anchor="middle" font-family="Arial" font-size="9" fill="#d8b4fe">Apple macOS</text>
  <text x="536" y="148" text-anchor="middle" font-family="Arial" font-size="9" fill="#d8b4fe">APFS: šifrování</text>
  <text x="536" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#d8b4fe">snapshoty, CoW</text>
  <text x="536" y="176" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">SSD-optimalizovaný</text>

  <!-- Arrows FS → Hardware -->
  <line x1="87" y1="190" x2="87" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="241" y1="190" x2="241" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="390" y1="190" x2="390" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="536" y1="190" x2="536" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Hardware Storage box (bottom, full width) -->
  <rect x="14" y="208" width="592" height="30" rx="6" fill="#1e1e1e" stroke="#6b7280" stroke-width="1.5"/>
  <text x="310" y="228" text-anchor="middle" font-family="Arial" font-size="11" fill="#9ca3af" font-weight="bold">Hardwarové úložiště — HDD / SSD / USB / NAS</text>
</svg>
