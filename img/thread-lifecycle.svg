<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230">
  <rect width="560" height="230" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Modely vláken: Uživatelská vlákna vs Vlákna jádra</text>
  <rect x="30" y="48" width="240" height="155" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="70" text-anchor="middle" font-family="Arial" font-size="11" fill="#60a5fa" font-weight="bold">Many-to-One (Uživatelská vlákna)</text>
  <text x="150" y="88" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#94a3b8">Knihovna vláken v User Space</text>
  <rect x="45" y="98" width="65" height="22" rx="3" fill="#1e40af"/><text x="77" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">Vlákno 1</text>
  <rect x="117" y="98" width="65" height="22" rx="3" fill="#1e40af"/><text x="149" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">Vlákno 2</text>
  <rect x="190" y="98" width="65" height="22" rx="3" fill="#1e40af"/><text x="222" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">Vlákno 3</text>
  <line x1="150" y1="120" x2="150" y2="140" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="80" y="140" width="140" height="26" rx="4" fill="#0f172a" stroke="#3b82f6"/><text x="150" y="157" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#93c5fd">1 Vlákno jádra (Kernel)</text>
  <text x="150" y="182" text-anchor="middle" font-family="Arial" font-size="8" fill="#ef4444">Blokující volání jednoho vlákna</text>
  <text x="150" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#ef4444">zastaví celý proces!</text>
  <rect x="290" y="48" width="240" height="155" rx="6" fill="#142e1e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="410" y="70" text-anchor="middle" font-family="Arial" font-size="11" fill="#4ade80" font-weight="bold">One-to-One (Vlákna jádra - Win/Linux)</text>
  <text x="410" y="88" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#86efac">Přímé mapování na úrovni jádra</text>
  <rect x="305" y="98" width="65" height="22" rx="3" fill="#15803d"/><text x="337" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">Vlákno 1</text>
  <rect x="377" y="98" width="65" height="22" rx="3" fill="#15803d"/><text x="409" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">Vlákno 2</text>
  <rect x="450" y="98" width="65" height="22" rx="3" fill="#15803d"/><text x="482" y="112" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">Vlákno 3</text>
  <line x1="337" y1="120" x2="337" y2="140" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="409" y1="120" x2="409" y2="140" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="482" y1="120" x2="482" y2="140" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="305" y="140" width="65" height="22" rx="3" fill="#052e16" stroke="#4ade80"/><text x="337" y="154" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#bbf7d0">Jádro 1</text>
  <rect x="377" y="140" width="65" height="22" rx="3" fill="#052e16" stroke="#4ade80"/><text x="409" y="154" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#bbf7d0">Jádro 2</text>
  <rect x="450" y="140" width="65" height="22" rx="3" fill="#052e16" stroke="#4ade80"/><text x="482" y="154" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#bbf7d0">Jádro 3</text>
  <text x="410" y="182" text-anchor="middle" font-family="Arial" font-size="8" fill="#86efac">Pravý souběh na vícejádrových CPU</text>
  <text x="410" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#86efac">Blokace jednoho vlákna neovlivní ostatní</text>
  <text x="280" y="218" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#666">Windows i Linux nativně implementují One-to-One model s podporou plánování jednotlivých vláken</text>
</svg>