<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240">
  <rect width="580" height="240" fill="#1a1a1a" rx="10"/>
  <text x="290" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Stavy procesu</text>
  <defs>
    <marker id="aProc" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f87171"/>
    </marker>
  </defs>
  <!-- States -->
  <ellipse cx="80" cy="120" rx="55" ry="28" fill="#1a2030" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="124" text-anchor="middle" font-family="Arial" font-size="12" fill="#60a5fa" font-weight="bold">New</text>
  <ellipse cx="220" cy="80" rx="55" ry="28" fill="#251e3a" stroke="#a78bfa" stroke-width="2"/>
  <text x="220" y="84" text-anchor="middle" font-family="Arial" font-size="12" fill="#c4b5fd" font-weight="bold">Ready</text>
  <ellipse cx="360" cy="120" rx="60" ry="30" fill="#2a1111" stroke="#f87171" stroke-width="2.5"/>
  <text x="360" y="116" text-anchor="middle" font-family="Arial" font-size="12" fill="#f87171" font-weight="bold">Running</text>
  <text x="360" y="130" text-anchor="middle" font-family="Arial" font-size="9" fill="#fca5a5">← CPU ←</text>
  <ellipse cx="220" cy="170" rx="55" ry="28" fill="#1e2a1a" stroke="#4ade80" stroke-width="2"/>
  <text x="220" y="174" text-anchor="middle" font-family="Arial" font-size="12" fill="#4ade80" font-weight="bold">Waiting</text>
  <ellipse cx="500" cy="120" rx="60" ry="28" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <text x="500" y="124" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">Terminated</text>
  <!-- Arrows -->
  <line x1="135" y1="107" x2="165" y2="93" stroke="#f87171" stroke-width="1.5" marker-end="url(#aProc)"/>
  <text x="148" y="94" font-family="Arial" font-size="9" fill="#888">admit</text>
  <line x1="275" y1="90" x2="300" y2="106" stroke="#f87171" stroke-width="1.5" marker-end="url(#aProc)"/>
  <text x="280" y="90" font-family="Arial" font-size="9" fill="#888">dispatch</text>
  <line x1="300" y1="130" x2="275" y2="158" stroke="#f87171" stroke-width="1.5" marker-end="url(#aProc)"/>
  <text x="250" y="150" font-family="Arial" font-size="9" fill="#888">I/O čeká</text>
  <line x1="220" y1="142" x2="220" y2="108" stroke="#f87171" stroke-width="1.5" marker-end="url(#aProc)"/>
  <text x="225" y="130" font-family="Arial" font-size="9" fill="#888">I/O done</text>
  <line x1="302" y1="105" x2="275" y2="92" stroke="#f87171" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aProc)"/>
  <text x="275" y="107" font-family="Arial" font-size="8" fill="#666">preempt</text>
  <line x1="420" y1="120" x2="440" y2="120" stroke="#888" stroke-width="1.5" marker-end="url(#aProc)"/>
  <text x="422" y="114" font-family="Arial" font-size="8" fill="#555">exit</text>
  <!-- PCB note -->
  <rect x="30" y="195" width="520" height="30" rx="5" fill="#222" stroke="#333"/>
  <text x="290" y="207" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">PCB: stav · PC · CPU registry · priorita · info o paměti · V/V zařízení · otevřené soubory</text>
  <text x="290" y="220" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Přepnutí kontextu (context switch): uloží PCB starého procesu, načte PCB nového</text>
</svg>