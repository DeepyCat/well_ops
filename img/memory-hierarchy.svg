<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300">
  <rect width="620" height="300" fill="#16181d" rx="10"/>
  <text x="310" y="28" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#4ade80" font-weight="bold">Paměťová hierarchie výpočetního systému</text>

  <!-- Pyramid Levels -->
  <g transform="translate(70, 50)">
    <!-- Level 1: Registers -->
    <polygon points="170,0 230,0 260,35 140,35" fill="#dc2626"/>
    <text x="200" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">CPU Registry (&lt;1 KB)</text>

    <!-- Level 2: Cache -->
    <polygon points="140,38 260,38 290,75 110,75" fill="#ea580c"/>
    <text x="200" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Cache L1 / L2 / L3 (MB)</text>

    <!-- Level 3: Main Memory -->
    <polygon points="110,78 290,78 330,120 70,120" fill="#d97706"/>
    <text x="200" y="103" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Hlavní paměť RAM (GB)</text>

    <!-- Level 4: Secondary Storage -->
    <polygon points="70,123 330,123 370,170 30,170" fill="#16a34a"/>
    <text x="200" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Sekundární úložiště SSD / NVMe (TB)</text>

    <!-- Level 5: Tertiary Storage -->
    <polygon points="30,173 370,173 400,215 0,215" fill="#0284c7"/>
    <text x="200" y="198" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Terciární / Cloudové / Páskové úložiště</text>
  </g>

  <!-- Left Side: Arrow Speed / Cost -->
  <line x1="45" y1="260" x2="45" y2="60" stroke="#f43f5e" stroke-width="2"/>
  <polygon points="45,50 40,65 50,65" fill="#f43f5e"/>
  <text x="20" y="160" font-family="Arial" font-size="10" fill="#f43f5e" font-weight="bold" transform="rotate(-90,20,160)">Rychlost &amp; Cena za Byte</text>

  <!-- Right Side: Arrow Capacity -->
  <line x1="565" y1="60" x2="565" y2="260" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="565,270 560,255 570,255" fill="#38bdf8"/>
  <text x="590" y="160" font-family="Arial" font-size="10" fill="#38bdf8" font-weight="bold" transform="rotate(90,590,160)">Kapacita úložiště</text>

  <text x="310" y="285" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Volatile (nestálé): Registry, Cache, RAM  |  Non-Volatile (stálé): SSD, HDD, Pásky</text>
</svg>