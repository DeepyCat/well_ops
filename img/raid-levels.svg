<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
  <rect width="700" height="340" fill="#16181d" rx="10"/>
  <text x="350" y="28" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#38bdf8" font-weight="bold">Architektura polí RAID (Redundant Array of Independent Disks)</text>
  
  <!-- RAID 0: Striping -->
  <g transform="translate(30, 50)">
    <rect width="140" height="260" rx="8" fill="#1e222b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#38bdf8" font-weight="bold">RAID 0: Striping</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Vysoký výkon, 0 redundance</text>
    <!-- Disk 0 -->
    <rect x="15" y="55" width="50" height="150" rx="4" fill="#0f172a" stroke="#0284c7"/>
    <text x="40" y="75" text-anchor="middle" font-family="Arial" font-size="9" fill="#38bdf8">Disk 0</text>
    <rect x="20" y="90" width="40" height="20" fill="#0369a1" rx="2"/><text x="40" y="104" text-anchor="middle" font-size="9" fill="#fff">A1</text>
    <rect x="20" y="115" width="40" height="20" fill="#0369a1" rx="2"/><text x="40" y="129" text-anchor="middle" font-size="9" fill="#fff">A3</text>
    <rect x="20" y="140" width="40" height="20" fill="#0369a1" rx="2"/><text x="40" y="154" text-anchor="middle" font-size="9" fill="#fff">A5</text>
    <!-- Disk 1 -->
    <rect x="75" y="55" width="50" height="150" rx="4" fill="#0f172a" stroke="#0284c7"/>
    <text x="100" y="75" text-anchor="middle" font-family="Arial" font-size="9" fill="#38bdf8">Disk 1</text>
    <rect x="80" y="90" width="40" height="20" fill="#0369a1" rx="2"/><text x="100" y="104" text-anchor="middle" font-size="9" fill="#fff">A2</text>
    <rect x="80" y="115" width="40" height="20" fill="#0369a1" rx="2"/><text x="100" y="129" text-anchor="middle" font-size="9" fill="#fff">A4</text>
    <rect x="80" y="140" width="40" height="20" fill="#0369a1" rx="2"/><text x="100" y="154" text-anchor="middle" font-size="9" fill="#fff">A6</text>
    <text x="70" y="225" text-anchor="middle" font-family="Arial" font-size="9" fill="#f87171">Selhání 1 disku = ztráta všeho</text>
    <text x="70" y="242" text-anchor="middle" font-family="Arial" font-size="9" fill="#38bdf8">Kapacita: 100%</text>
  </g>

  <!-- RAID 1: Mirroring -->
  <g transform="translate(195, 50)">
    <rect width="140" height="260" rx="8" fill="#1e222b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#4ade80" font-weight="bold">RAID 1: Mirroring</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Zrcadlení stejných dat</text>
    <!-- Disk 0 -->
    <rect x="15" y="55" width="50" height="150" rx="4" fill="#0f172a" stroke="#16a34a"/>
    <text x="40" y="75" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">Disk 0</text>
    <rect x="20" y="90" width="40" height="20" fill="#15803d" rx="2"/><text x="40" y="104" text-anchor="middle" font-size="9" fill="#fff">A1</text>
    <rect x="20" y="115" width="40" height="20" fill="#15803d" rx="2"/><text x="40" y="129" text-anchor="middle" font-size="9" fill="#fff">A2</text>
    <rect x="20" y="140" width="40" height="20" fill="#15803d" rx="2"/><text x="40" y="154" text-anchor="middle" font-size="9" fill="#fff">A3</text>
    <!-- Disk 1 -->
    <rect x="75" y="55" width="50" height="150" rx="4" fill="#0f172a" stroke="#16a34a"/>
    <text x="100" y="75" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">Disk 1</text>
    <rect x="80" y="90" width="40" height="20" fill="#15803d" rx="2"/><text x="100" y="104" text-anchor="middle" font-size="9" fill="#fff">A1</text>
    <rect x="80" y="115" width="40" height="20" fill="#15803d" rx="2"/><text x="100" y="129" text-anchor="middle" font-size="9" fill="#fff">A2</text>
    <rect x="80" y="140" width="40" height="20" fill="#15803d" rx="2"/><text x="100" y="154" text-anchor="middle" font-size="9" fill="#fff">A3</text>
    <text x="70" y="225" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">Přežije výpadek 1 disku</text>
    <text x="70" y="242" text-anchor="middle" font-family="Arial" font-size="9" fill="#fbbf24">Kapacita: 50%</text>
  </g>

  <!-- RAID 5: Distributed Parity -->
  <g transform="translate(360, 50)">
    <rect width="180" height="260" rx="8" fill="#1e222b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#f59e0b" font-weight="bold">RAID 5: Parita</text>
    <text x="90" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Distribuovaná parita (XOR)</text>
    <!-- Disk 0 -->
    <rect x="15" y="55" width="45" height="150" rx="4" fill="#0f172a" stroke="#d97706"/>
    <text x="37" y="73" text-anchor="middle" font-family="Arial" font-size="8" fill="#f59e0b">D0</text>
    <rect x="20" y="85" width="35" height="18" fill="#b45309" rx="2"/><text x="37" y="98" text-anchor="middle" font-size="8" fill="#fff">A1</text>
    <rect x="20" y="108" width="35" height="18" fill="#b45309" rx="2"/><text x="37" y="121" text-anchor="middle" font-size="8" fill="#fff">B1</text>
    <rect x="20" y="131" width="35" height="18" fill="#ef4444" rx="2"/><text x="37" y="144" text-anchor="middle" font-size="8" fill="#fff">P(C)</text>
    <!-- Disk 1 -->
    <rect x="68" y="55" width="45" height="150" rx="4" fill="#0f172a" stroke="#d97706"/>
    <text x="90" y="73" text-anchor="middle" font-family="Arial" font-size="8" fill="#f59e0b">D1</text>
    <rect x="73" y="85" width="35" height="18" fill="#b45309" rx="2"/><text x="90" y="98" text-anchor="middle" font-size="8" fill="#fff">A2</text>
    <rect x="73" y="108" width="35" height="18" fill="#ef4444" rx="2"/><text x="90" y="121" text-anchor="middle" font-size="8" fill="#fff">P(B)</text>
    <rect x="73" y="131" width="35" height="18" fill="#b45309" rx="2"/><text x="90" y="144" text-anchor="middle" font-size="8" fill="#fff">C1</text>
    <!-- Disk 2 -->
    <rect x="121" y="55" width="45" height="150" rx="4" fill="#0f172a" stroke="#d97706"/>
    <text x="143" y="73" text-anchor="middle" font-family="Arial" font-size="8" fill="#f59e0b">D2</text>
    <rect x="126" y="85" width="35" height="18" fill="#ef4444" rx="2"/><text x="143" y="98" text-anchor="middle" font-size="8" fill="#fff">P(A)</text>
    <rect x="126" y="108" width="35" height="18" fill="#b45309" rx="2"/><text x="143" y="121" text-anchor="middle" font-size="8" fill="#fff">B2</text>
    <rect x="126" y="131" width="35" height="18" fill="#b45309" rx="2"/><text x="143" y="144" text-anchor="middle" font-size="8" fill="#fff">C2</text>
    <text x="90" y="225" text-anchor="middle" font-family="Arial" font-size="9" fill="#f59e0b">Min. 3 disky · Přežije 1 výpadek</text>
    <text x="90" y="242" text-anchor="middle" font-family="Arial" font-size="9" fill="#38bdf8">Kapacita: (N-1)/N</text>
  </g>

  <!-- RAID 10: 1+0 -->
  <g transform="translate(560, 50)">
    <rect width="115" height="260" rx="8" fill="#1e222b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="57" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#a855f7" font-weight="bold">RAID 10 (1+0)</text>
    <text x="57" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Mirroring + Striping</text>
    <rect x="12" y="60" width="40" height="60" rx="3" fill="#0f172a" stroke="#9333ea"/><text x="32" y="85" text-anchor="middle" font-size="8" fill="#a855f7">D0 (M)</text>
    <rect x="62" y="60" width="40" height="60" rx="3" fill="#0f172a" stroke="#9333ea"/><text x="82" y="85" text-anchor="middle" font-size="8" fill="#a855f7">D1 (M)</text>
    <text x="57" y="140" text-anchor="middle" font-size="14" fill="#a855f7">⇕ Striped</text>
    <rect x="12" y="150" width="40" height="60" rx="3" fill="#0f172a" stroke="#9333ea"/><text x="32" y="175" text-anchor="middle" font-size="8" fill="#a855f7">D2 (M)</text>
    <rect x="62" y="150" width="40" height="60" rx="3" fill="#0f172a" stroke="#9333ea"/><text x="82" y="175" text-anchor="middle" font-size="8" fill="#a855f7">D3 (M)</text>
    <text x="57" y="225" text-anchor="middle" font-family="Arial" font-size="9" fill="#a855f7">Rychlé &amp; odolné</text>
    <text x="57" y="242" text-anchor="middle" font-family="Arial" font-size="9" fill="#fbbf24">Kapacita: 50%</text>
  </g>
</svg>