<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230">
  <rect width="560" height="230" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Fragmentace paměti: Externí vs Interní</text>
  <rect x="30" y="48" width="240" height="155" rx="6" fill="#1e1628" stroke="#a855f7" stroke-width="1.5"/>
  <text x="150" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#c084fc" font-weight="bold">Externí fragmentace</text>
  <text x="150" y="86" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#d8b4fe">(Souvislé přidělování)</text>
  <rect x="45" y="95" width="210" height="22" fill="#166534"/><text x="150" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Proces 1 (obsazeno)</text>
  <rect x="45" y="119" width="210" height="16" fill="#991b1b" stroke="#f87171" stroke-dasharray="2,2"/><text x="150" y="131" text-anchor="middle" font-family="Arial" font-size="8" fill="#fecaca">Volná díra: 14 KB (malá)</text>
  <rect x="45" y="137" width="210" height="22" fill="#1d4ed8"/><text x="150" y="152" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Proces 2 (obsazeno)</text>
  <rect x="45" y="161" width="210" height="16" fill="#991b1b" stroke="#f87171" stroke-dasharray="2,2"/><text x="150" y="173" text-anchor="middle" font-family="Arial" font-size="8" fill="#fecaca">Volná díra: 18 KB (malá)</text>
  <text x="150" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#fca5a5">Součet volné RAM = 32 KB, ale proces 30 KB nelze umístit!</text>
  <rect x="290" y="48" width="240" height="155" rx="6" fill="#14251e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="410" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#4ade80" font-weight="bold">Interní fragmentace</text>
  <text x="410" y="86" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#86efac">(Fixní bloky / stránkování)</text>
  <rect x="305" y="100" width="210" height="55" rx="4" fill="#1f2937" stroke="#4ade80"/>
  <rect x="305" y="100" width="145" height="55" fill="#2563eb"/>
  <text x="375" y="132" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">Proces: 18 KB</text>
  <rect x="450" y="100" width="65" height="55" fill="#b91c1c" stroke="#f87171" stroke-dasharray="3,2"/>
  <text x="482" y="126" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">Nevyužito</text>
  <text x="482" y="138" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">6 KB</text>
  <text x="410" y="175" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#aaa">Alokovaný blok má pevnou velikost 24 KB</text>
  <text x="410" y="192" text-anchor="middle" font-family="Arial" font-size="8" fill="#86efac">Rozdíl (6 KB) zůstává nevyužit uvnitř alokovaného bloku</text>
  <text x="280" y="220" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#666">Řešení externí fragmentace: Kompakce (přesun procesů) nebo moderní stránkování (Paging)</text>
</svg>