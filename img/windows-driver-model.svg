<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240">
  <rect width="560" height="240" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Architektura ovladačů Windows: WDF (KMDF vs UMDF)</text>
  <rect x="30" y="46" width="500" height="55" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="45" y="66" font-family="Arial" font-size="11" fill="#93c5fd" font-weight="bold">User Mode (Uživatelský prostor)</text>
  <rect x="45" y="72" width="210" height="22" rx="3" fill="#1e3a8a"/><text x="150" y="87" text-anchor="middle" font-family="Arial" font-size="9" fill="#dbeafe">Uživatelská aplikace (Win32 API)</text>
  <rect x="285" y="72" width="230" height="22" rx="3" fill="#1e40af"/><text x="400" y="87" text-anchor="middle" font-family="Arial" font-size="9" fill="#bfdbfe">UMDF ovladač (User-Mode Driver Framework)</text>
  <line x1="280" y1="101" x2="280" y2="115" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="280" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#fef08a">Hranice ochrany Ring 3 / Ring 0</text>
  <rect x="30" y="117" width="500" height="75" rx="5" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
  <text x="45" y="135" font-family="Arial" font-size="11" fill="#e9d5ff" font-weight="bold">Kernel Mode (Jádro OS Windows)</text>
  <rect x="45" y="143" width="145" height="38" rx="3" fill="#4c1d95"/><text x="117" y="160" text-anchor="middle" font-family="Arial" font-size="9" fill="#f3e8ff">I/O Manager</text><text x="117" y="173" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#c4b5fd">IRP pakety</text>
  <rect x="200" y="143" width="155" height="38" rx="3" fill="#581c87"/><text x="277" y="160" text-anchor="middle" font-family="Arial" font-size="9" fill="#f3e8ff">KMDF ovladač</text><text x="277" y="173" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#c4b5fd">Kernel-Mode Framework</text>
  <rect x="365" y="143" width="150" height="38" rx="3" fill="#3b0764"/><text x="440" y="160" text-anchor="middle" font-family="Arial" font-size="9" fill="#f3e8ff">Legacy WDM ovladač</text><text x="440" y="173" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#c4b5fd">Přímý kód jádra</text>
  <rect x="30" y="198" width="500" height="28" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="280" y="216" text-anchor="middle" font-family="Arial" font-size="9" fill="#cbd5e1">Fyzický Hardware: Řadič zařízení, PCI/USB sběrnice, registry zařízení</text>
</svg>