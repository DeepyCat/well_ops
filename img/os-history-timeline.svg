<svg xmlns="http://www.w3.org/2000/svg" width="620" height="200" viewBox="0 0 620 200">
  <rect width="620" height="200" fill="#1a1a1a" rx="10"/>
  <text x="310" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Časová osa vývoje operačních systémů</text>

  <!-- Timeline axis -->
  <line x1="30" y1="110" x2="598" y2="110" stroke="#555" stroke-width="2"/>
  <!-- Arrow at end -->
  <polygon points="598,106 610,110 598,114" fill="#555"/>

  <!-- Milestones data: x, color, label, year, above(1)/below(-1) -->
  <!-- 1950: x=48 -->
  <circle cx="50" cy="110" r="5" fill="#ef4444"/>
  <line x1="50" y1="105" x2="50" y2="68" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="50" y="62" text-anchor="middle" font-family="Arial" font-size="8" fill="#ef4444" font-weight="bold">1950</text>
  <text x="50" y="52" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#fca5a5">Dávkové</text>
  <text x="50" y="43" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#fca5a5">zpracování</text>

  <!-- 1965: x=118 -->
  <circle cx="118" cy="110" r="5" fill="#3b82f6"/>
  <line x1="118" y1="115" x2="118" y2="155" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="118" y="163" text-anchor="middle" font-family="Arial" font-size="8" fill="#3b82f6" font-weight="bold">1965</text>
  <text x="118" y="174" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#93c5fd">Multics</text>
  <text x="118" y="184" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#93c5fd">(Bell Labs)</text>

  <!-- 1969: x=186 -->
  <circle cx="186" cy="110" r="5" fill="#22c55e"/>
  <line x1="186" y1="105" x2="186" y2="60" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="186" y="54" text-anchor="middle" font-family="Arial" font-size="8" fill="#22c55e" font-weight="bold">1969</text>
  <text x="186" y="44" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#86efac">UNIX</text>
  <text x="186" y="35" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#86efac">Thompson &amp; Ritchie</text>

  <!-- 1980: x=270 -->
  <circle cx="270" cy="110" r="5" fill="#f97316"/>
  <line x1="270" y1="115" x2="270" y2="158" stroke="#f97316" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="270" y="166" text-anchor="middle" font-family="Arial" font-size="8" fill="#f97316" font-weight="bold">1980</text>
  <text x="270" y="177" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#fdba74">MS-DOS /</text>
  <text x="270" y="187" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#fdba74">Apple System 1</text>

  <!-- 1985: x=338 -->
  <circle cx="338" cy="110" r="5" fill="#ef4444"/>
  <line x1="338" y1="105" x2="338" y2="62" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="338" y="56" text-anchor="middle" font-family="Arial" font-size="8" fill="#ef4444" font-weight="bold">1985</text>
  <text x="338" y="46" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#fca5a5">Windows 1.0</text>

  <!-- 1991: x=406 -->
  <circle cx="406" cy="110" r="5" fill="#3b82f6"/>
  <line x1="406" y1="115" x2="406" y2="158" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="406" y="166" text-anchor="middle" font-family="Arial" font-size="8" fill="#3b82f6" font-weight="bold">1991</text>
  <text x="406" y="177" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#93c5fd">Linux</text>
  <text x="406" y="187" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#93c5fd">(Torvalds)</text>

  <!-- 1993: x=440 -->
  <circle cx="448" cy="110" r="5" fill="#22c55e"/>
  <line x1="448" y1="105" x2="448" y2="56" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="448" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#22c55e" font-weight="bold">1993</text>
  <text x="448" y="40" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#86efac">Windows NT</text>

  <!-- 2001: x=516 -->
  <circle cx="516" cy="110" r="5" fill="#f97316"/>
  <line x1="516" y1="115" x2="516" y2="158" stroke="#f97316" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="516" y="166" text-anchor="middle" font-family="Arial" font-size="8" fill="#f97316" font-weight="bold">2001</text>
  <text x="516" y="177" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#fdba74">Windows XP</text>

  <!-- 2010: x=576 -->
  <circle cx="576" cy="110" r="5" fill="#ef4444"/>
  <line x1="576" y1="105" x2="576" y2="60" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="576" y="54" text-anchor="middle" font-family="Arial" font-size="8" fill="#ef4444" font-weight="bold">2010</text>
  <text x="576" y="44" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#fca5a5">ChromeOS</text>
</svg>
