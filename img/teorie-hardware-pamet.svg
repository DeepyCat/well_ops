<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1a0d"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#g2)"/>
  <text x="400" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#34d399" font-weight="bold" letter-spacing="2">HARDWARE · PERIFERIE · PAMĚŤ</text>
  <!-- CPU -->
  <rect x="60" y="45" width="130" height="130" rx="8" fill="#1a2a1a" stroke="#34d399" stroke-width="1.5"/>
  <rect x="75" y="60" width="100" height="100" rx="4" fill="#0d1a0d" stroke="#22c55e" stroke-width="1"/>
  <text x="125" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#34d399" font-weight="bold">CPU</text>
  <text x="125" y="116" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e">L1 / L2 / L3</text>
  <text x="125" y="130" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">Cache</text>
  <text x="125" y="155" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Procesor</text>
  <!-- RAM -->
  <rect x="230" y="45" width="110" height="55" rx="5" fill="#1a2a1a" stroke="#34d399" stroke-width="1.5"/>
  <text x="285" y="68" text-anchor="middle" font-family="Arial" font-size="11" fill="#34d399" font-weight="bold">RAM</text>
  <text x="285" y="84" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e">DDR5 · Volatile</text>
  <text x="285" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Hlavní paměť</text>
  <!-- SSD/HDD -->
  <rect x="230" y="120" width="110" height="55" rx="5" fill="#1a2a1a" stroke="#34d399" stroke-width="1.5"/>
  <text x="285" y="143" text-anchor="middle" font-family="Arial" font-size="11" fill="#34d399" font-weight="bold">SSD/HDD</text>
  <text x="285" y="159" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e">Perzistentní</text>
  <!-- RAID -->
  <rect x="390" y="45" width="150" height="130" rx="8" fill="#1a2a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="465" y="70" text-anchor="middle" font-family="Arial" font-size="11" fill="#4ade80" font-weight="bold">RAID</text>
  <rect x="405" y="80" width="35" height="25" rx="3" fill="#0d1a0d" stroke="#22c55e" stroke-width="1"/>
  <rect x="448" y="80" width="35" height="25" rx="3" fill="#0d1a0d" stroke="#22c55e" stroke-width="1"/>
  <rect x="491" y="80" width="35" height="25" rx="3" fill="#0d1a0d" stroke="#22c55e" stroke-width="1"/>
  <text x="422" y="97" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">D0</text>
  <text x="465" y="97" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">D1</text>
  <text x="508" y="97" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">D2</text>
  <text x="465" y="125" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e">RAID 0/1/5/6</text>
  <text x="465" y="140" text-anchor="middle" font-family="Arial" font-size="9" fill="#4ade80">Redundance</text>
  <text x="465" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Stable Storage</text>
  <!-- I/O Periferie -->
  <rect x="590" y="45" width="150" height="130" rx="8" fill="#1a2a1a" stroke="#16a34a" stroke-width="1.5"/>
  <text x="665" y="68" text-anchor="middle" font-family="Arial" font-size="11" fill="#34d399" font-weight="bold">PERIFERIE</text>
  <text x="665" y="88" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e">⌨ Klávesnice</text>
  <text x="665" y="104" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e">🖥 Monitor</text>
  <text x="665" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e">🌐 Síťová karta</text>
  <text x="665" y="136" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e">🔌 USB zařízení</text>
  <text x="665" y="156" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">I/O Devices</text>
  <!-- BUS lines -->
  <line x1="190" y1="110" x2="230" y2="90" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="190" y1="110" x2="230" y2="147" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="340" y1="90" x2="390" y2="110" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="540" y1="110" x2="590" y2="110" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">─────────────────── Systémová sběrnice (BUS) ───────────────────</text>
</svg>