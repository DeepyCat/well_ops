<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240">
  <rect width="620" height="240" fill="#1a1a1a" rx="10"/>
  <text x="310" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Metody přístupu k souboru</text>

  <!-- Sequential Access -->
  <rect x="14" y="40" width="190" height="180" rx="8" fill="#0f1a2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="109" y="62" text-anchor="middle" font-family="Arial" font-size="11" fill="#3b82f6" font-weight="bold">Sekvenční přístup</text>
  <!-- Tape blocks -->
  <rect x="24" y="74" width="36" height="22" rx="2" fill="#1e3a6e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="42" y="89" text-anchor="middle" font-family="Arial" font-size="8" fill="#7dd3fc">Záz. 1</text>
  <rect x="62" y="74" width="36" height="22" rx="2" fill="#1e3a6e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="89" text-anchor="middle" font-family="Arial" font-size="8" fill="#7dd3fc">Záz. 2</text>
  <rect x="100" y="74" width="36" height="22" rx="2" fill="#1e3a6e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="118" y="89" text-anchor="middle" font-family="Arial" font-size="8" fill="#7dd3fc">Záz. 3</text>
  <rect x="138" y="74" width="36" height="22" rx="2" fill="#1e3050" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="156" y="89" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">…</text>
  <!-- Arrow right -->
  <line x1="24" y1="107" x2="170" y2="107" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  <!-- Rewind arrow -->
  <path d="M168,120 Q96,138 26,120" stroke="#3b82f6" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <text x="97" y="148" text-anchor="middle" font-family="Arial" font-size="8" fill="#60a5fa">rewind</text>
  <text x="109" y="170" text-anchor="middle" font-family="Arial" font-size="9" fill="#7dd3fc">Pouze vpřed / rewind</text>
  <text x="109" y="186" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">read_next() write_next()</text>
  <text x="109" y="202" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Model: magnetická páska</text>

  <!-- Direct (Random) Access -->
  <rect x="216" y="40" width="190" height="180" rx="8" fill="#1e1400" stroke="#f97316" stroke-width="2"/>
  <text x="311" y="62" text-anchor="middle" font-family="Arial" font-size="11" fill="#f97316" font-weight="bold">Přímý přístup</text>
  <!-- Disk cylinder simplified -->
  <ellipse cx="311" cy="90" rx="46" ry="12" fill="#3a2000" stroke="#f97316" stroke-width="1.5"/>
  <rect x="265" y="90" width="92" height="30" fill="#2a1800" stroke="#f97316" stroke-width="1.5"/>
  <ellipse cx="311" cy="120" rx="46" ry="12" fill="#3a2000" stroke="#f97316" stroke-width="1.5"/>
  <!-- Track lines -->
  <line x1="265" y1="100" x2="357" y2="100" stroke="#7c3d00" stroke-width="0.8"/>
  <line x1="265" y1="110" x2="357" y2="110" stroke="#7c3d00" stroke-width="0.8"/>
  <!-- Block N highlight -->
  <rect x="298" y="94" width="26" height="16" rx="2" fill="#f97316" opacity="0.8"/>
  <text x="311" y="106" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff" font-weight="bold">blok N</text>
  <!-- Jump arrow -->
  <path d="M270,145 Q245,160 270,175 L357,175 Q380,175 357,145" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arr-orange)"/>
  <text x="311" y="168" text-anchor="middle" font-family="Arial" font-size="8" fill="#fb923c">přímý skok</text>
  <text x="311" y="186" text-anchor="middle" font-family="Arial" font-size="9" fill="#fdba74">Přímý skok na blok N</text>
  <text x="311" y="202" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">read(n) write(n)</text>
  <text x="311" y="214" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Model: disk, databáze</text>

  <!-- Index Access -->
  <rect x="418" y="40" width="190" height="180" rx="8" fill="#0d1f0d" stroke="#22c55e" stroke-width="2"/>
  <text x="513" y="62" text-anchor="middle" font-family="Arial" font-size="11" fill="#22c55e" font-weight="bold">Přístup přes index</text>
  <!-- Index table -->
  <rect x="428" y="72" width="60" height="70" rx="3" fill="#142814" stroke="#22c55e" stroke-width="1.2"/>
  <text x="458" y="86" text-anchor="middle" font-family="Arial" font-size="8" fill="#22c55e" font-weight="bold">INDEX</text>
  <rect x="431" y="90" width="54" height="13" rx="1" fill="#1a3a1a" stroke="#15803d" stroke-width="0.8"/>
  <text x="458" y="100" text-anchor="middle" font-family="Arial" font-size="7" fill="#86efac">záznam 1 →</text>
  <rect x="431" y="105" width="54" height="13" rx="1" fill="#1a3a1a" stroke="#15803d" stroke-width="0.8"/>
  <text x="458" y="115" text-anchor="middle" font-family="Arial" font-size="7" fill="#86efac">záznam 2 →</text>
  <rect x="431" y="120" width="54" height="13" rx="1" fill="#1a3a1a" stroke="#15803d" stroke-width="0.8"/>
  <text x="458" y="130" text-anchor="middle" font-family="Arial" font-size="7" fill="#86efac">záznam 3 →</text>
  <!-- Data blocks -->
  <rect x="530" y="78" width="50" height="18" rx="2" fill="#142814" stroke="#22c55e" stroke-width="1"/>
  <text x="555" y="91" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#4ade80">Datový blok 1</text>
  <rect x="530" y="103" width="50" height="18" rx="2" fill="#142814" stroke="#22c55e" stroke-width="1"/>
  <text x="555" y="116" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#4ade80">Datový blok 2</text>
  <rect x="530" y="128" width="50" height="18" rx="2" fill="#142814" stroke="#22c55e" stroke-width="1"/>
  <text x="555" y="141" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#4ade80">Datový blok 3</text>
  <!-- Arrows index→data -->
  <line x1="485" y1="97" x2="530" y2="87" stroke="#22c55e" stroke-width="1" marker-end="url(#arr-green)"/>
  <line x1="485" y1="112" x2="530" y2="112" stroke="#22c55e" stroke-width="1" marker-end="url(#arr-green)"/>
  <line x1="485" y1="127" x2="530" y2="137" stroke="#22c55e" stroke-width="1" marker-end="url(#arr-green)"/>
  <text x="513" y="176" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">Index → Data blok</text>
  <text x="513" y="192" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Nejdřív index, pak přímý</text>
  <text x="513" y="204" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">přístup k datovému bloku</text>
</svg>
