<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <rect width="800" height="220" fill="#120d1a"/>
  <text x="400" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#a855f7" font-weight="bold" letter-spacing="2">SOUBOROVÉ SYSTÉMY · ROZHRANÍ</text>
  <defs>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a855f7"/>
    </marker>
  </defs>
  <!-- Directory tree -->
  <text x="50" y="55" font-family="monospace" font-size="11" fill="#a855f7">📁 /</text>
  <text x="50" y="75" font-family="monospace" font-size="11" fill="#c084fc">├── 📁 home/</text>
  <text x="50" y="93" font-family="monospace" font-size="11" fill="#c084fc">│   └── 📁 user/</text>
  <text x="50" y="111" font-family="monospace" font-size="11" fill="#d8b4fe">│       ├── 📄 file.txt</text>
  <text x="50" y="129" font-family="monospace" font-size="11" fill="#c084fc">├── 📁 etc/</text>
  <text x="50" y="147" font-family="monospace" font-size="11" fill="#c084fc">├── 📁 var/</text>
  <text x="50" y="165" font-family="monospace" font-size="11" fill="#c084fc">└── 📁 usr/</text>
  <!-- FS Layers -->
  <rect x="340" y="42" width="200" height="30" rx="5" fill="#2a1a3a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="440" y="62" text-anchor="middle" font-family="Arial" font-size="11" fill="#c084fc">Aplikace / Uživatel</text>
  <rect x="340" y="82" width="200" height="30" rx="5" fill="#2a1a3a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="440" y="102" text-anchor="middle" font-family="Arial" font-size="11" fill="#c084fc">VFS (Virtual FS)</text>
  <rect x="340" y="122" width="200" height="30" rx="5" fill="#2a1a3a" stroke="#9333ea" stroke-width="1.5"/>
  <text x="440" y="142" text-anchor="middle" font-family="Arial" font-size="11" fill="#a855f7">ext4 / NTFS / FAT32</text>
  <rect x="340" y="162" width="200" height="30" rx="5" fill="#1a1a2a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="182" text-anchor="middle" font-family="Arial" font-size="11" fill="#7c3aed">Blokové zařízení</text>
  <line x1="440" y1="72" x2="440" y2="82" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="440" y1="112" x2="440" y2="122" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="440" y1="152" x2="440" y2="162" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <!-- inode box -->
  <rect x="590" y="42" width="175" height="150" rx="8" fill="#1e1228" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="677" y="62" text-anchor="middle" font-family="Arial" font-size="11" fill="#a855f7" font-weight="bold">inode</text>
  <text x="600" y="80" font-family="monospace" font-size="9" fill="#c084fc">owner:  root</text>
  <text x="600" y="96" font-family="monospace" font-size="9" fill="#c084fc">perms:  rwxr-xr-x</text>
  <text x="600" y="112" font-family="monospace" font-size="9" fill="#c084fc">size:   4096 B</text>
  <text x="600" y="128" font-family="monospace" font-size="9" fill="#c084fc">links:  2</text>
  <text x="600" y="144" font-family="monospace" font-size="9" fill="#c084fc">blocks: [42,43,44]</text>
  <text x="600" y="160" font-family="monospace" font-size="9" fill="#c084fc">atime:  2026-10-05</text>
  <text x="677" y="185" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Metadata souboru</text>
  <!-- System calls note -->
  <text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Systémová volání: open() · read() · write() · close() · stat() · mmap()</text>
</svg>