<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230">
  <rect width="560" height="230" fill="#1a1a1a" rx="10"/>
  <text x="280" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Mechanismus tvorby procesů v UNIXu: fork(), exec(), wait(), exit()</text>
  <rect x="30" y="50" width="120" height="150" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#60a5fa" font-weight="bold">Rodič (Parent)</text>
  <rect x="40" y="82" width="100" height="22" rx="3" fill="#0f172a"/><text x="90" y="96" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#93c5fd">PID = 1000</text>
  <rect x="40" y="110" width="100" height="22" rx="3" fill="#1d4ed8"/><text x="90" y="125" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">fork()</text>
  <rect x="40" y="138" width="100" height="22" rx="3" fill="#451a03" stroke="#d97706"/><text x="90" y="153" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#fde68a">wait(&amp;status)</text>
  <rect x="40" y="166" width="100" height="22" rx="3" fill="#166534"/><text x="90" y="181" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#bbf7d0">Pokračuje po exit</text>
  <line x1="140" y1="121" x2="220" y2="100" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="175" y="104" text-anchor="middle" font-family="Arial" font-size="8" fill="#fde68a">Klon paměti</text>
  <rect x="220" y="50" width="130" height="80" rx="5" fill="#2e2412" stroke="#d97706" stroke-width="1.5"/>
  <text x="285" y="70" text-anchor="middle" font-family="Arial" font-size="10" fill="#fde68a" font-weight="bold">Potomek (Kopie)</text>
  <text x="285" y="88" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#fed7aa">PID = 1001 (fork vrátí 0)</text>
  <text x="285" y="102" text-anchor="middle" font-family="Arial" font-size="8" fill="#cbd5e1">Stejný kód i proměnné</text>
  <line x1="350" y1="90" x2="400" y2="90" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="375" y="82" text-anchor="middle" font-family="Arial" font-size="8" fill="#4ade80">execve()</text>
  <rect x="400" y="50" width="130" height="150" rx="5" fill="#142e1e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="465" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#4ade80" font-weight="bold">Nový program</text>
  <rect x="410" y="82" width="110" height="35" rx="3" fill="#166534"/><text x="465" y="98" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#dcfce7">Nahrazen text, data</text><text x="465" y="110" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#bbf7d0">i zásobník procesu</text>
  <rect x="410" y="125" width="110" height="24" rx="3" fill="#052e16"/><text x="465" y="140" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#86efac">Běh nové úlohy</text>
  <rect x="410" y="156" width="110" height="28" rx="3" fill="#7f1d1d" stroke="#ef4444"/><text x="465" y="173" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">exit(status)</text>
  <line x1="410" y1="170" x2="140" y2="150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="260" y="182" text-anchor="middle" font-family="Arial" font-size="8" fill="#fca5a5">Exit kód probudí čekajícího rodiče</text>
  <text x="280" y="218" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#666">Pokud rodič nezavolá wait(), stane se z potomka Zombie proces, dokud není ukončen</text>
</svg>