  <rect x="200" y="48" width="330" height="155" rx="6" fill="#1e2520" stroke="#22c55e" stroke-width="1.5"/>
  <text x="365" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#4ade80" font-weight="bold">NAND Flash Paměťové buňky</text>
