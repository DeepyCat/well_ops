  <text x="367" y="166" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">Čtení/Zápis po STRÁNKÁCH (4–16 KB) • Mazání po BLOCÍCH (128–512 stránek)</text>
  <text x="367" y="182" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#888">Trim příkaz: OS informuje SSD o smazaných blocích pro Garbage Collection</text>
  <text x="280" y="224" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">SSD nemá pohyblivé mechanické části • Rychlý náhodný přístup • Omezený počet přepisů P/E cyklů</text>
