<svg xmlns="http://www.w3.org/2000/svg" width="580" height="280" viewBox="0 0 580 280">
  <rect width="580" height="280" fill="#1a1a1a" rx="10"/>
  <text x="290" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#e0e0e0" font-weight="bold">Stránkování (Paging)</text>
  <defs><marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a78bfa"/></marker></defs>
  <!-- Logical address -->
  <rect x="20" y="50" width="130" height="36" rx="4" fill="#251e3a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="85" y="63" text-anchor="middle" font-family="monospace" font-size="11" fill="#c4b5fd">Logická adresa</text>
  <rect x="22" y="68" width="55" height="16" rx="2" fill="#3b2a5a"/>
  <text x="50" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#a78bfa">p (stránka)</text>
  <rect x="80" y="68" width="68" height="16" rx="2" fill="#2a2040"/>
  <text x="115" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#818cf8">d (offset)</text>
  <!-- Arrow to page table -->
  <line x1="85" y1="86" x2="85" y2="130" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="88" y="115" font-family="Arial" font-size="9" fill="#7c3aed">index</text>
  <!-- Page table -->
  <rect x="22" y="130" width="126" height="100" rx="4" fill="#1e1830" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="85" y="147" text-anchor="middle" font-family="Arial" font-size="10" fill="#a78bfa" font-weight="bold">Tabulka stránek</text>
  <rect x="30" y="153" width="110" height="16" rx="2" fill="#2a2040"/>
  <text x="85" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">p=0 → rámec 5</text>
  <rect x="30" y="172" width="110" height="16" rx="2" fill="#251830"/>
  <text x="85" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">p=1 → rámec 6</text>
  <rect x="30" y="191" width="110" height="16" rx="2" fill="#2a2040"/>
  <text x="85" y="203" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">p=2 → rámec 2</text>
  <rect x="30" y="210" width="110" height="16" rx="2" fill="#251830"/>
  <text x="85" y="222" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">p=3 → rámec 8</text>
  <!-- Arrow from page table to physical -->
  <line x1="148" y1="180" x2="200" y2="180" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="155" y="173" font-family="Arial" font-size="9" fill="#7c3aed">bázová adresa rámce</text>
  <!-- Physical address -->
  <rect x="200" y="160" width="130" height="36" rx="4" fill="#1e2a1e" stroke="#34d399" stroke-width="1.5"/>
  <text x="265" y="173" text-anchor="middle" font-family="monospace" font-size="11" fill="#6ee7b7">Fyzická adresa</text>
  <rect x="202" y="178" width="55" height="16" rx="2" fill="#1a3020"/>
  <text x="230" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">rámec f</text>
  <rect x="260" y="178" width="68" height="16" rx="2" fill="#1e2820"/>
  <text x="295" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">d (offset)</text>
  <!-- Physical memory blocks -->
  <text x="400" y="48" text-anchor="middle" font-family="Arial" font-size="11" fill="#34d399" font-weight="bold">Fyzická paměť</text>
  <rect x="340" y="55" width="80" height="22" rx="3" fill="#1a2a1a" stroke="#4ade80" stroke-width="1"/>
  <text x="380" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">Rámec 0</text>
  <rect x="430" y="55" width="80" height="22" rx="3" fill="#1a2a1a" stroke="#4ade80" stroke-width="1"/>
  <text x="470" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">Rámec 1</text>
  <rect x="340" y="83" width="80" height="22" rx="3" fill="#1a2a1a" stroke="#4ade80" stroke-width="1"/>
  <text x="380" y="98" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">Rámec 2 ◀ p=2</text>
  <rect x="430" y="83" width="80" height="22" rx="3" fill="#1a2a1a" stroke="#4ade80" stroke-width="1"/>
  <text x="470" y="98" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">Rámec 3</text>
  <rect x="340" y="111" width="80" height="22" rx="3" fill="#1a2a1a" stroke="#4ade80" stroke-width="1"/>
  <text x="380" y="126" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">Rámec 4</text>
  <rect x="430" y="111" width="80" height="22" rx="3" fill="#253a25" stroke="#22c55e" stroke-width="2"/>
  <text x="470" y="126" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">Rámec 5 ◀ p=0</text>
  <rect x="340" y="139" width="80" height="22" rx="3" fill="#253a25" stroke="#22c55e" stroke-width="2"/>
  <text x="380" y="154" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">Rámec 6 ◀ p=1</text>
  <rect x="430" y="139" width="80" height="22" rx="3" fill="#1a2a1a" stroke="#4ade80" stroke-width="1"/>
  <text x="470" y="154" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">Rámec 7</text>
  <rect x="340" y="167" width="80" height="22" rx="3" fill="#253a25" stroke="#22c55e" stroke-width="2"/>
  <text x="380" y="182" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">Rámec 8 ◀ p=3</text>
  <!-- Legend -->
  <text x="290" y="250" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Žádná externí fragmentace · Libovolné rámce pro libovolný proces · Logický adresní prostor ≠ fyzický</text>
  <text x="290" y="268" text-anchor="middle" font-family="Arial" font-size="9" fill="#444">MMU (Memory Management Unit) provádí překlad automaticky při každém přístupu do paměti</text>
</svg>