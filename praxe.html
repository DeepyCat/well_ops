<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrolní seznam přípravy VM - Modul 0</title>
  <link rel="icon" type="image/x-icon" href="img/remielle.jpg">

  <style>
    :root {
      --bg-main: #1a1a1a;
      --bg-sidebar: #222;
      --bg-box: #242424;
      --border-color: #333;
      --text-main: #e0e0e0;
      --text-muted: #888;
      --accent: #ff5555;
      --accent-hover: #ff7777;
      --code-bg: #151515;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: #444 var(--bg-main);
    }
    
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background-color: var(--bg-sidebar);
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      z-index: 100;
      position: sticky;
      top: 0;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .doc-link-btn {
      background-color: #202428;
      border: 1px solid #373e47;
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .doc-link-btn:hover {
      background-color: #2b323a;
      color: #58a6ff;
      border-color: #58a6ff;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    }

    .doc-link-btn .external-icon {
      color: #8b949e;
      transition: color 0.2s ease;
      margin-left: 2px;
    }

    .doc-link-btn:hover .external-icon {
      color: #58a6ff;
    }

    .back-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
    }

    .back-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    .reset-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 20px 25px 60px 25px;
      box-sizing: border-box;
      width: 100%;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .vm-tabs {
      display: flex;
      gap: 8px;
    }

    .vm-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .vm-btn:hover {
      background-color: #2a2a2a;
      border-color: #444;
      color: #fff;
    }

    .vm-btn.active {
      background-color: #332222;
      color: var(--accent-hover);
      border-color: var(--accent);
      font-weight: bold;
    }

    .vm-badge {
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .vm-btn.active .vm-badge {
      background: rgba(255, 85, 85, 0.25);
      color: var(--accent-hover);
    }

    .vm-verified-tag {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.45);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.3px;
    }

    .vm-verified-alert {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-left: 4px solid #22c55e;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.86rem;
      color: #bbf7d0;
    }

    .vm-verified-alert svg {
      flex-shrink: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .sidebar {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 75px;
      max-height: calc(100vh - 95px);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .progress-bar-bg {
      background: var(--code-bg);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }

    .task-items {
      overflow-y: auto;
      list-style: none;
      flex: 1;
      padding: 0;
      margin: 0;
      max-height: calc(100vh - 165px);
      scrollbar-width: thin;
      scrollbar-color: #555 #181818;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      gap: 10px;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .task-item:hover {
      background-color: #2a2a2a;
      color: #fff;
    }

    .task-item.selected {
      background-color: #332222;
      border-left: 3px solid var(--accent);
      color: var(--accent-hover);
      font-weight: 600;
    }

    /* Vlastní stylování checkboxů */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #555;
      border-radius: 4px;
      background-color: #181818;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .custom-checkbox:hover {
      border-color: var(--accent);
      background-color: #222;
      box-shadow: 0 0 6px rgba(255, 85, 85, 0.3);
    }

    .custom-checkbox:checked {
      background-color: var(--accent);
      border-color: var(--accent);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2.5-2.5a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3E%3C/svg%3E");
      background-size: 13px 13px;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 0 8px rgba(255, 85, 85, 0.45);
    }

    .custom-checkbox:active {
      transform: scale(0.9);
    }

    /* Moderní přepínač stavu v detailu úkolu */
    .status-toggle {
      font-size: 0.82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      user-select: none;
      color: var(--text-muted);
    }

    .status-toggle:hover {
      background: #252525;
      border-color: #555;
      color: var(--text-main);
    }

    .status-toggle.is-done {
      background: rgba(255, 85, 85, 0.12);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    /* Navigace mezi úkoly v patce detailu */
    .detail-nav-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .nav-step-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-step-btn:hover:not(:disabled) {
      background-color: #2a2a2a;
      border-color: var(--accent);
      color: #fff;
    }

    .nav-step-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--border-color);
    }

    .task-label {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-label.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .detail-pane {
      background: var(--bg-box);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px 28px 40px 28px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      min-width: 0;
      min-height: 400px;
    }

    .task-items::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    .task-items::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    .task-items::-webkit-scrollbar-thumb {
      background: #383838;
      border-radius: 4px;
    }
    .task-items::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .detail-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .vm-tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--accent-hover);
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-family: ui-monospace, monospace;
    }

    /* 3-krokové karty pro hlavní okno */
    .step-card {
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .step-card.step-goal {
      border-left: 4px solid #6b7280;
    }

    .step-card.step-action {
      border-left: 4px solid var(--accent);
      border-color: #3d2a2c;
    }

    .step-card.step-verify {
      border-left: 4px solid #3b82f6;
      border-color: #1e2c3f;
    }

    .step-card-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .step-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-goal .step-card-header {
      background: #222222;
      color: #9ca3af;
      border-bottom-color: #2e2e2e;
    }

    .step-action .step-card-header {
      background: #251c1d;
      color: var(--accent-hover);
      border-bottom-color: #382424;
    }

    .step-verify .step-card-header {
      background: #16202e;
      color: #60a5fa;
      border-bottom-color: #1e2d42;
    }

    .step-card-body {
      padding: 14px 16px;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    pre.action-code {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      color: #ffc9c2;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--code-bg);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #382424;
      margin: 0;
    }

    pre.verify-code {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      color: #bfdbfe;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--code-bg);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      margin: 0;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 4px;
      padding: 5px 11px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn-action {
      background: rgba(255, 85, 85, 0.18);
      border: 1px solid rgba(255, 85, 85, 0.45);
      color: #fff;
    }

    .copy-btn-action:hover {
      background: rgba(255, 85, 85, 0.35);
      border-color: var(--accent);
      color: #fff;
    }

    .copy-btn-verify {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #fff;
    }

    .copy-btn-verify:hover {
      background: rgba(59, 130, 246, 0.35);
      border-color: #60a5fa;
      color: #fff;
    }

    /* Očekávaný výstup ověření */
    .expected-output-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: #101712;
      border: 1px solid #1c3222;
      border-left: 3px solid #22c55e;
      border-radius: 6px;
    }

    .expected-output-header {
      font-size: 0.76rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: #4ade80;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .expected-output-content {
      font-size: 0.84rem;
      color: #d1fae5;
      line-height: 1.55;
      white-space: pre-line;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      background: #090e0b;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #162a1c;
      overflow-x: auto;
    }

    /* Přehledná tabulka parametrů */
    .params-table-wrapper {
      overflow-x: auto;
      width: 100%;
      margin: 4px 0 8px 0;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .params-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: #181818;
      text-align: left;
    }

    .params-table th, .params-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #282828;
      border-right: 1px solid #242424;
      white-space: nowrap;
    }

    .params-table th:last-child, .params-table td:last-child {
      border-right: none;
    }

    .params-table th {
      background-color: #222;
      color: #fff;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .params-table tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .params-table .active-col {
      background-color: rgba(255, 85, 85, 0.1);
      color: #fff;
      font-weight: 600;
      border-left: 1px solid rgba(255, 85, 85, 0.35);
      border-right: 1px solid rgba(255, 85, 85, 0.35);
    }

    .params-table th.active-col {
      background-color: rgba(255, 85, 85, 0.22);
      color: var(--accent-hover);
      border-bottom: 2px solid var(--accent);
    }

    .params-table tr.active-row {
      background-color: rgba(255, 85, 85, 0.1);
      font-weight: 600;
    }

    .params-table tr.active-row td {
      color: #fff;
      border-top: 1px solid rgba(255, 85, 85, 0.35);
      border-bottom: 1px solid rgba(255, 85, 85, 0.35);
    }

    /* Ovládání čísla pracoviště X */
    .workstation-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .ws-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-weight: 600;
    }

    .ws-stepper {
      display: inline-flex;
      align-items: center;
      background: #141414;
      border: 1px solid #444;
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .ws-stepper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(255, 85, 85, 0.4);
    }

    .ws-step-btn {
      width: 28px;
      height: 28px;
      background: #252525;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
      outline: none;
      padding: 0;
    }

    .ws-step-btn:hover {
      background: #353535;
      color: #fff;
    }

    .ws-step-btn:active {
      background: var(--accent);
      color: #fff;
      transform: scale(0.92);
    }

    .ws-number-input {
      width: 44px;
      height: 28px;
      background: transparent;
      border: none;
      border-left: 1px solid #333;
      border-right: 1px solid #333;
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
      font-family: ui-monospace, monospace;
      padding: 0;
      margin: 0;
    }

    .ws-number-input::-webkit-outer-spin-button,
    .ws-number-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .ws-info-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .ws-info-pill strong {
      color: var(--accent-hover);
      font-family: ui-monospace, monospace;
    }

    .ws-sep {
      color: #555;
    }

    /* Sjednocený varovný blok pro síťová rozhraní NIC 1 / 2 / 3 */
    .nic-warning-banner {
      background: #20170d;
      border: 1px solid #5a3a14;
      border-left: 5px solid #f59e0b;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .nic-warning-header {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fbbf24;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
    }

    .nic-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .nic-list-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 10px;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #e5e7eb;
    }

    .nic-name {
      font-weight: 700;
      color: #fff;
      min-width: 130px;
    }

    .nic-tag-badge {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: ui-monospace, monospace;
      flex-shrink: 0;
    }

    .nic-tag-badge.danger {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .nic-tag-badge.success {
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.5);
    }

    .nic-tag-badge.info {
      background: rgba(59, 130, 246, 0.25);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.5);
    }

    .nic-note {
      font-size: 0.82rem;
      color: #fde68a;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.2);
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .nic-note svg {
      flex-shrink: 0;
      margin-top: 3px;
      color: #f59e0b;
    }

    .nic-note code, .nic-list-row code {
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Terminal Console Styling */
    .terminal-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    .terminal-header {
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .terminal-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .t-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .t-dot.red { background: #ff5f56; }
    .t-dot.yellow { background: #ffbd2e; }
    .t-dot.green { background: #27c93f; }

    .terminal-title-text {
      color: #8b949e;
      font-size: 0.78rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.3px;
    }

    .terminal-copy-btn {
      background: #21262d;
      border: 1px solid #363b42;
      color: #c9d1d9;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .terminal-copy-btn:hover {
      background: #30363d;
      color: #fff;
      border-color: #58a6ff;
    }

    .terminal-body {
      padding: 14px 16px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #e6edf3;
      overflow-x: auto;
      overflow-y: visible;
    }

    .terminal-body::-webkit-scrollbar {
      height: 6px;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background: #383838;
      border-radius: 3px;
    }

    .t-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      white-space: pre;
    }

    .t-line.empty {
      height: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .t-ps-prompt {
      color: #58a6ff;
      font-weight: 700;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      flex-shrink: 0;
    }

    .t-cmd-text {
      color: #e6edf3;
      user-select: text;
      -webkit-user-select: text;
    }

    .t-line.t-comment,
    .t-comment-text {
      color: #8b949e;
      font-style: italic;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      cursor: default;
    }

    .t-prefix {
      color: #6e7681;
      font-weight: 700;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      flex-shrink: 0;
    }

    @media screen and (max-width: 900px) {
      .main-content {
        padding: 14px 14px 40px 14px;
      }
      .top-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .workstation-card {
        justify-content: space-between;
      }
      .workspace {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .sidebar {
        position: static;
        max-height: 280px;
      }
      .task-items {
        max-height: 200px;
      }
      .detail-pane {
        padding: 18px 18px 30px 18px;
      }
      .header-actions {
        flex-direction: row;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Konfigurace zkurvených VM</h1>
    <div class="header-actions">
      <a href="praxe/01/__zadani.html" target="_blank" rel="noopener noreferrer" class="doc-link-btn" title="Otevřít zformátované zadání (_zadani.md) v nové záložce">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>_zadani.md</span>
        <svg class="external-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <a href="praxe/01/__reseni.html" target="_blank" rel="noopener noreferrer" class="doc-link-btn" title="Otevřít zformátované řešení (__reseni.md) v nové záložce">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        <span>__reseni.md</span>
        <svg class="external-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <button class="reset-btn" onclick="resetCurrentVM()">Resetovat stav VM</button>
      <a href="index.html" class="back-btn">Chcu zpět</a>
    </div>
  </header>

  <div class="main-content">
    <div class="top-controls">
      <div class="vm-tabs">
        <button class="vm-btn active" id="btn-SRV1-DC" onclick="switchVM('SRV1-DC')">
          SRV1-DC <span class="vm-badge" id="badge-SRV1-DC">0/11</span>
          <span class="vm-verified-tag" title="Všechny příkazy a konfigurace na SRV1-DC byly v praxi otestovány a ověřeny jako 100% funkční!">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Ověřeno OK
          </span>
        </button>
        <button class="vm-btn" id="btn-SRV2-FS" onclick="switchVM('SRV2-FS')">
          SRV2-FS <span class="vm-badge" id="badge-SRV2-FS">0/11</span>
        </button>
        <button class="vm-btn" id="btn-PC1-WIN" onclick="switchVM('PC1-WIN')">
          PC1-WIN <span class="vm-badge" id="badge-PC1-WIN">0/12</span>
        </button>
      </div>

      <div class="workstation-card">
        <div class="ws-header">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
          <span class="ws-title">Pracoviště X:</span>
          <div class="ws-stepper">
            <button type="button" class="ws-step-btn" onclick="stepWorkstation(-1)" title="Snížit číslo pracoviště">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <input type="number" id="workstation-input" class="ws-number-input" min="1" max="254" value="2" oninput="changeWorkstation(this.value)">
            <button type="button" class="ws-step-btn" onclick="stepWorkstation(1)" title="Zvýšit číslo pracoviště">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
        <div class="ws-info-pill" id="ws-info-text">
          <span>Podsíť: <strong>192.168.2.0/24</strong></span>
          <span class="ws-sep">•</span>
          <span>GW: <strong>192.168.2.1</strong></span>
          <span class="ws-sep">•</span>
          <span>DC: <strong>.10</strong> | FS: <strong>.20</strong></span>
        </div>
      </div>
    </div>

    <div class="workspace">
      <div class="sidebar">
        <div class="sidebar-header">
          <div style="display:flex; justify-content:space-between; font-size: 0.8rem; color: var(--text-muted);">
            <span>Dokončeno</span>
            <span id="progress-text">0 %</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
        </div>
        <ul class="task-items" id="task-list"></ul>
      </div>

      <div class="detail-pane" id="detail-pane"></div>
    </div>
  </div>

  <script>
    const taskDefinitions = [
      {
        id: "vm-specs",
        title: "1. Parametry virtuálního stroje",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => `
          <div class="params-table-wrapper">
            <table class="params-table">
              <thead>
                <tr>
                  <th>Parametr</th>
                  <th class="${vm === 'SRV1-DC' ? 'active-col' : ''}">SRV1-DC</th>
                  <th class="${vm === 'SRV2-FS' ? 'active-col' : ''}">SRV2-FS</th>
                  <th class="${vm === 'PC1-WIN' ? 'active-col' : ''}">PC1-WIN</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>vCPU</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">2 jádra</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}">2 jádra</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">2 jádra</td>
                </tr>
                <tr>
                  <td><strong>RAM</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">8 GB</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}">8 GB</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">8 GB</td>
                </tr>
                <tr>
                  <td><strong>Systémový disk</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">100 GB</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}">100 GB</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">60 GB</td>
                </tr>
                <tr>
                  <td><strong>Další disky</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">—</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}"><strong>5× 10 GB</strong> (Storage Pool)</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">—</td>
                </tr>
                <tr>
                  <td><strong>Sítě v CyLab</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">NIC 1, <strong>NIC 2 (zapnout!)</strong>, NIC 3</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}">NIC 1, <strong>NIC 2 (zapnout!)</strong>, NIC 3</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">NIC 1, <strong>NIC 2 (zapnout!)</strong>, NIC 3</td>
                </tr>
              </tbody>
            </table>
          </div>
        `,
        how: (vm) => {
          if (vm === "PC1-WIN") return "V hypervizoru (CyLab): 2 vCPU, 8 GB RAM, 60 GB systémový disk. Zkontrolujte, že je zapnutý síťový adaptér NIC 2.";
          if (vm === "SRV2-FS") return "V hypervizoru (CyLab): 2 vCPU, 8 GB RAM, 100 GB systémový disk + 5x virtuální disk 10 GB. Zkontrolujte, že je zapnutý adaptér NIC 2.";
          return "V hypervizoru (CyLab): 2 vCPU, 8 GB RAM, 100 GB systémový disk. Zkontrolujte, že je zapnutý síťový adaptér NIC 2.";
        },
        verify: (vm) => {
          if (vm === "SRV2-FS") return "Get-Disk | Select-Object Number, FriendlyName, Size, PartitionStyle\n# Ověřte systémový disk (~100 GB) a 5x RAW disků (~10 GB)";
          return "Get-Disk | Select-Object Number, FriendlyName, Size";
        },
        expected: (vm) => {
          if (vm === "SRV2-FS") return "Výpis obsahuje systémový disk (~100 GB) a 5x neinicializovaných disků (~10 GB) ve stavu RAW:\nNumber  FriendlyName            Size  PartitionStyle\n------  ------------            ----  --------------\n0       ... (Systémový disk)  ~100 GB  GPT/MBR\n1-5     ... (5x datový disk)   ~10 GB  RAW";
          if (vm === "PC1-WIN") return "Výpis obsahuje systémový disk o velikosti přibližně 60 GB:\nNumber  FriendlyName  Size\n0       ...          ~60 GB";
          return "Výpis obsahuje systémový disk o velikosti přibližně 100 GB:\nNumber  FriendlyName  Size\n0       ...          ~100 GB";
        }
      },
      {
        id: "os-edition",
        title: "2. Edice a instalace Windows",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => `
          <div class="params-table-wrapper">
            <table class="params-table">
              <thead>
                <tr>
                  <th>Stroj</th>
                  <th>Edice Windows</th>
                  <th>Typ rozhraní</th>
                  <th>Jazyk média</th>
                </tr>
              </thead>
              <tbody>
                <tr class="${vm === 'SRV1-DC' ? 'active-row' : ''}">
                  <td><strong>SRV1-DC</strong></td>
                  <td>Windows Server 2025 Datacenter</td>
                  <td>Desktop Experience (s GUI)</td>
                  <td>English (United States)</td>
                </tr>
                <tr class="${vm === 'SRV2-FS' ? 'active-row' : ''}">
                  <td><strong>SRV2-FS</strong></td>
                  <td>Windows Server 2025 Datacenter</td>
                  <td>Desktop Experience (s GUI)</td>
                  <td>English (United States)</td>
                </tr>
                <tr class="${vm === 'PC1-WIN' ? 'active-row' : ''}">
                  <td><strong>PC1-WIN</strong></td>
                  <td>Windows 11 Education N</td>
                  <td>Bez multimédií (EU edice)</td>
                  <td>English (United States)</td>
                </tr>
              </tbody>
            </table>
          </div>
        `,
        how: (vm) => {
          if (vm === "PC1-WIN") return "Instalace Windows 11 Education N (jazyk: English - United States).";
          return "Instalace Windows Server 2025 Datacenter (Desktop Experience). Neinstalovat Server Core.";
        },
        verify: (vm) => {
          if (vm === "PC1-WIN") return "Get-ComputerInfo | Select-Object WindowsProductName";
          return "Get-ComputerInfo | Select-Object WindowsProductName, OsServerLevel";
        },
        expected: (vm) => {
          if (vm === "PC1-WIN") return "WindowsProductName : Windows 11 Education N (případně Windows 11 Education)";
          return "WindowsProductName : Windows Server 2025 Datacenter\nOsServerLevel      : FullServer (potvrzuje Desktop Experience, nikoliv ServerCore)";
        }
      },
      {
        id: "hostname",
        title: "3. Jméno počítače (Hostname)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => `Přejmenujte stroj na přesný název "${vm}" a restartujte jej. Jednoznačné jméno je klíčové pro komunikaci v síti a budoucí řadič domény.`,
        how: (vm) => `Rename-Computer -NewName "${vm}" -Restart`,
        verify: () => "hostname",
        expected: (vm) => `Vrátí přesný název stroje:\n${vm}`
      },
      {
        id: "networking",
        title: "4. Nastavení TCP/IPv4",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => {
          const nicBanner = `
            <div class="nic-warning-banner">
              <div class="nic-warning-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <span>DŮLEŽITÉ: Pravidla síťových rozhraní (NIC) a kontrola adaptéru</span>
              </div>
              <div class="nic-list">
                <div class="nic-list-row">
                  <span class="nic-name">NIC 1 (Ethernet0 / Ethernet)</span>
                  <span class="nic-tag-badge danger">NEŠAHAT</span>
                  <span>Ponechat na pokoji. Slouží pro NAT, internetový přístup a management hypervizoru.</span>
                </div>
                <div class="nic-list-row">
                  <span class="nic-name">NIC 2 (Ethernet1 / Ethernet 1)</span>
                  <span class="nic-tag-badge success">INTERNÍ LAB SÍŤ</span>
                  <span><strong>ZDE NASTAVUJETE IP!</strong> Rozhraní musí být <strong>ZAPNUTÉ V HYPERVIZORU (CyLab)</strong>. Propojuje všechny vaše lokální VM (DC, FS, PC). Podsíť: <code>192.168.${workstationX}.0/24</code>.</span>
                </div>
                <div class="nic-list-row">
                  <span class="nic-name">NIC 3 (Ethernet2 / Ethernet 2)</span>
                  <span class="nic-tag-badge info">TŘÍDNÍ SÍŤ</span>
                  <span>Propojení se všemi VM v učebně pro společné úlohy (ponechat dle pokynů lektora).</span>
                </div>
              </div>
              <div class="nic-note">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <div>
                  <strong>DŮLEŽITÉ UPOZORNĚNÍ PRO CYLAB:</strong> Síťový adaptér <strong>NIC 2 musíte mít v rozhraní hypervizoru (CyLab) zapnutý / připojený</strong> u všech svých VM, jinak virtuální stroje nebudou navzájem komunikovat!<br>
                  V CyLabu (VMware) se adaptéry jmenují <strong>Ethernet0</strong> (NIC 1) a <strong>Ethernet1</strong> (NIC 2) <strong>bez mezery</strong>! V níže uvedených příkazech je použit přesný alias <code>Ethernet1</code>. Pokud by se u vás jmenoval s mezerou (<code>Ethernet 1</code>), upravte parametr <code>-InterfaceAlias</code>.
                </div>
              </div>
            </div>
          `;

          if (vm === "SRV1-DC") {
            return `
              ${nicBanner}
              <p>Pro pracoviště <strong>č. ${workstationX}</strong> nastavte na rozhraní <strong>NIC 2 (Ethernet1)</strong> statickou IP adresu <strong>192.168.${workstationX}.10/24</strong>, výchozí bránu <strong>192.168.${workstationX}.1</strong> a preferovaný DNS server <strong>192.168.${workstationX}.10</strong> (sám na sebe pro budoucí roli doménového řadiče a DNS).</p>
            `;
          }
          if (vm === "SRV2-FS") {
            return `
              ${nicBanner}
              <p>Pro pracoviště <strong>č. ${workstationX}</strong> nastavte na rozhraní <strong>NIC 2 (Ethernet1)</strong> statickou IP adresu <strong>192.168.${workstationX}.20/24</strong> (servery mají krok po 10), výchozí bránu <strong>192.168.${workstationX}.1</strong> a preferovaný DNS <strong>192.168.${workstationX}.10</strong> (směřující na SRV1-DC).</p>
            `;
          }

      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTerminalPowerShell(rawCode) {
      if (!rawCode) return "";
      const lines = rawCode.trim().split("\n");
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) {
          return '<div class="t-line empty">&nbsp;</div>';
        }
        if (trimmed.startsWith("#")) {
          return `<div class="t-line t-comment"><span class="t-prefix">#</span> <span class="t-comment-text">${escapeHtml(trimmed.substring(1).trim())}</span></div>`;
        }
        return `<div class="t-line"><span class="t-ps-prompt">PS C:\\&gt;</span> <span class="t-cmd-text">${escapeHtml(line)}</span></div>`;
      }).join("");

      } else if (type === "verify") {
        rawCode = typeof task.verify === "function" ? task.verify(currentVM) : task.verify;
      }
      if (!rawCode) return;

      // Zkopírovat pouze spustitelné příkazy (vynechat komentáře začínající na #)
      const commandLines = rawCode
        .split("\n")
        .filter(line => !line.trim().startsWith("#"))
        .join("\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();

      const textToCopy = commandLines || rawCode.trim();

                  <span class="t-dot green"></span>
                </div>
                <div class="terminal-title-text">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                  <span>Administrator: Windows PowerShell (Test)</span>
                </div>
                <button class="terminal-copy-btn" onclick="copyTaskCode('${currentTask.id}', 'verify', this)">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  <span>Kopírovat test</span>
                </button>
              </div>
              <div class="terminal-body">
                ${formatTerminalPowerShell(verifyText)}
              </div>
            </div>

            <div class="expected-output-box">
              <div class="expected-output-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <span>Správný výstup konzole (musí odpovídat):</span>
              </div>
              <div class="expected-output-content">${escapeHtml(expectedText)}</div>
            </div>
          </div>
        </div>

        <div class="detail-nav-footer">
          <button class="nav-step-btn" ${prevTask ? `onclick="selectTask('${prevTask.id}')"` : "disabled"}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Předchozí úkol
          </button>
          <button class="nav-step-btn" ${nextTask ? `onclick="selectTask('${nextTask.id}')"` : "disabled"}>
            Další úkol
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
