<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrolní seznam přípravy VM - Modul 0</title>
  <link rel="icon" type="image/x-icon" href="img/remielle.jpg">
  <script src="praxe/modules.js"></script>
  <script src="praxe/01/tasks.js"></script>

  <style>
    :root {
      --bg-main: #1a1a1a;
      --bg-sidebar: #222;
      --bg-box: #242424;
      --border-color: #333;
      --text-main: #e0e0e0;
      --text-muted: #888;
      --accent: #ff5555;
      --accent-hover: #ff7777;
      --code-bg: #151515;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: #444 var(--bg-main);
    }
    
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background-color: var(--bg-sidebar);
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      z-index: 100;
      position: sticky;
      top: 0;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .module-selector-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 10px;
    }

    .module-selector-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #58a6ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .module-select {
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .module-select:hover, .module-select:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .doc-link-btn {
      background-color: #202428;
      border: 1px solid #373e47;
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .doc-link-btn:hover {
      background-color: #2b323a;
      color: #58a6ff;
      border-color: #58a6ff;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    }

    .doc-link-btn .external-icon {
      color: #8b949e;
      transition: color 0.2s ease;
      margin-left: 2px;
    }

    .doc-link-btn:hover .external-icon {
      color: #58a6ff;
    }

    .back-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
    }

    .back-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    .reset-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 20px 25px 60px 25px;
      box-sizing: border-box;
      width: 100%;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .vm-tabs {
      display: flex;
      gap: 8px;
    }

    .vm-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .vm-btn:hover {
      background-color: #2a2a2a;
      border-color: #444;
      color: #fff;
    }

    .vm-btn.active {
      background-color: #332222;
      color: var(--accent-hover);
      border-color: var(--accent);
      font-weight: bold;
    }

    .vm-badge {
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .vm-btn.active .vm-badge {
      background: rgba(255, 85, 85, 0.25);
      color: var(--accent-hover);
    }

    .vm-verified-tag {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.45);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.3px;
    }

    .vm-verified-alert {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-left: 4px solid #22c55e;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.86rem;
      color: #bbf7d0;
    }

    .vm-verified-alert svg {
      flex-shrink: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .sidebar {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 75px;
      max-height: calc(100vh - 95px);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .progress-bar-bg {
      background: var(--code-bg);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }

    .task-items {
      overflow-y: auto;
      list-style: none;
      flex: 1;
      padding: 0;
      margin: 0;
      max-height: calc(100vh - 165px);
      scrollbar-width: thin;
      scrollbar-color: #555 #181818;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      gap: 10px;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .task-item:hover {
      background-color: #2a2a2a;
      color: #fff;
    }

    .task-item.selected {
      background-color: #332222;
      border-left: 3px solid var(--accent);
      color: var(--accent-hover);
      font-weight: 600;
    }

    /* Vlastní stylování checkboxů */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #555;
      border-radius: 4px;
      background-color: #181818;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .custom-checkbox:hover {
      border-color: var(--accent);
      background-color: #222;
      box-shadow: 0 0 6px rgba(255, 85, 85, 0.3);
    }

    .custom-checkbox:checked {
      background-color: var(--accent);
      border-color: var(--accent);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2.5-2.5a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3E%3C/svg%3E");
      background-size: 13px 13px;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 0 8px rgba(255, 85, 85, 0.45);
    }

    .custom-checkbox:active {
      transform: scale(0.9);
    }

    /* Moderní přepínač stavu v detailu úkolu */
    .status-toggle {
      font-size: 0.82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      user-select: none;
      color: var(--text-muted);
    }

    .status-toggle:hover {
      background: #252525;
      border-color: #555;
      color: var(--text-main);
    }

    .status-toggle.is-done {
      background: rgba(255, 85, 85, 0.12);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    /* Navigace mezi úkoly v patce detailu */
    .detail-nav-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .nav-step-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-step-btn:hover:not(:disabled) {
      background-color: #2a2a2a;
      border-color: var(--accent);
      color: #fff;
    }

    .nav-step-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--border-color);
    }

    .task-label {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-label.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .detail-pane {
      background: var(--bg-box);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px 28px 40px 28px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      min-width: 0;
      min-height: 400px;
    }

    .task-items::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    .task-items::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    .task-items::-webkit-scrollbar-thumb {
      background: #383838;
      border-radius: 4px;
    }
    .task-items::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .detail-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .vm-tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--accent-hover);
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-family: ui-monospace, monospace;
    }

    /* 3-krokové karty pro hlavní okno */
    .step-card {
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .step-card.step-goal {
      border-left: 4px solid #6b7280;
    }

    .step-card.step-action {
      border-left: 4px solid var(--accent);
      border-color: #3d2a2c;
    }

    .step-card.step-verify {
      border-left: 4px solid #3b82f6;
      border-color: #1e2c3f;
    }

    .step-card-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .step-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-goal .step-card-header {
      background: #222222;
      color: #9ca3af;
      border-bottom-color: #2e2e2e;
    }

    .step-action .step-card-header {
      background: #251c1d;
      color: var(--accent-hover);
      border-bottom-color: #382424;
    }

    .step-verify .step-card-header {
      background: #16202e;
      color: #60a5fa;
      border-bottom-color: #1e2d42;
    }

    .step-card-body {
      padding: 14px 16px;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    pre.action-code {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      color: #ffc9c2;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--code-bg);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #382424;
      margin: 0;
    }

    pre.verify-code {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      color: #bfdbfe;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--code-bg);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      margin: 0;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 4px;
      padding: 5px 11px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn-action {
      background: rgba(255, 85, 85, 0.18);
      border: 1px solid rgba(255, 85, 85, 0.45);
      color: #fff;
    }

    .copy-btn-action:hover {
      background: rgba(255, 85, 85, 0.35);
      border-color: var(--accent);
      color: #fff;
    }

    .copy-btn-verify {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #fff;
    }

    .copy-btn-verify:hover {
      background: rgba(59, 130, 246, 0.35);
      border-color: #60a5fa;
      color: #fff;
    }

    /* Očekávaný výstup ověření */
    .expected-output-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: #101712;
      border: 1px solid #1c3222;
      border-left: 3px solid #22c55e;
      border-radius: 6px;
    }

    .expected-output-header {
      font-size: 0.76rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: #4ade80;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .expected-output-content {
      font-size: 0.84rem;
      color: #d1fae5;
      line-height: 1.55;
      white-space: pre-line;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      background: #090e0b;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #162a1c;
      overflow-x: auto;
    }

    /* Přehledná tabulka parametrů */
    .params-table-wrapper {
      overflow-x: auto;
      width: 100%;
      margin: 4px 0 8px 0;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .params-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: #181818;
      text-align: left;
    }

    .params-table th, .params-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #282828;
      border-right: 1px solid #242424;
      white-space: nowrap;
    }

    .params-table th:last-child, .params-table td:last-child {
      border-right: none;
    }

    .params-table th {
      background-color: #222;
      color: #fff;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .params-table tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .params-table .active-col {
      background-color: rgba(255, 85, 85, 0.1);
      color: #fff;
      font-weight: 600;
      border-left: 1px solid rgba(255, 85, 85, 0.35);
      border-right: 1px solid rgba(255, 85, 85, 0.35);
    }

    .params-table th.active-col {
      background-color: rgba(255, 85, 85, 0.22);
      color: var(--accent-hover);
      border-bottom: 2px solid var(--accent);
    }

    .params-table tr.active-row {
      background-color: rgba(255, 85, 85, 0.1);
      font-weight: 600;
    }

    .params-table tr.active-row td {
      color: #fff;
      border-top: 1px solid rgba(255, 85, 85, 0.35);
      border-bottom: 1px solid rgba(255, 85, 85, 0.35);
    }

    /* Ovládání čísla pracoviště X */
    .workstation-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .ws-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-weight: 600;
    }

    .ws-stepper {
      display: inline-flex;
      align-items: center;
      background: #141414;
      border: 1px solid #444;
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .ws-stepper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(255, 85, 85, 0.4);
    }

    .ws-step-btn {
      width: 28px;
      height: 28px;
      background: #252525;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
      outline: none;
      padding: 0;
    }

    .ws-step-btn:hover {
      background: #353535;
      color: #fff;
    }

    .ws-step-btn:active {
      background: var(--accent);
      color: #fff;
      transform: scale(0.92);
    }

    .ws-number-input {
      width: 44px;
      height: 28px;
      background: transparent;
      border: none;
      border-left: 1px solid #333;
      border-right: 1px solid #333;
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
      font-family: ui-monospace, monospace;
      padding: 0;
      margin: 0;
    }

    .ws-number-input::-webkit-outer-spin-button,
    .ws-number-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .ws-info-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .ws-info-pill strong {
      color: var(--accent-hover);
      font-family: ui-monospace, monospace;
    }

    .ws-sep {
      color: #555;
    }

    /* Sjednocený varovný blok pro síťová rozhraní NIC 1 / 2 / 3 */
    .nic-warning-banner {
      background: #20170d;
      border: 1px solid #5a3a14;
      border-left: 5px solid #f59e0b;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .nic-warning-header {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fbbf24;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
    }

    .nic-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .nic-list-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 10px;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #e5e7eb;
    }

    .nic-name {
      font-weight: 700;
      color: #fff;
      min-width: 130px;
    }

    .nic-tag-badge {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: ui-monospace, monospace;
      flex-shrink: 0;
    }

    .nic-tag-badge.danger {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .nic-tag-badge.success {
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.5);
    }

    .nic-tag-badge.info {
      background: rgba(59, 130, 246, 0.25);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.5);
    }

    .nic-note {
      font-size: 0.82rem;
      color: #fde68a;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.2);
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .nic-note svg {
      flex-shrink: 0;
      margin-top: 3px;
      color: #f59e0b;
    }

    .nic-note code, .nic-list-row code {
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Terminal Console Styling */
    .terminal-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    .terminal-header {
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .terminal-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .t-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .t-dot.red { background: #ff5f56; }
    .t-dot.yellow { background: #ffbd2e; }
    .t-dot.green { background: #27c93f; }

    .terminal-title-text {
      color: #8b949e;
      font-size: 0.78rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.3px;
    }

    .terminal-copy-btn {
      background: #21262d;
      border: 1px solid #363b42;
      color: #c9d1d9;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .terminal-copy-btn:hover {
      background: #30363d;
      color: #fff;
      border-color: #58a6ff;
    }

    .terminal-body {
      padding: 14px 16px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #e6edf3;
      overflow-x: auto;
      overflow-y: visible;
    }

    .terminal-body::-webkit-scrollbar {
      height: 6px;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background: #383838;
      border-radius: 3px;
    }

    .t-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      white-space: pre;
    }

    .t-line.empty {
      height: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .t-ps-prompt {
      color: #58a6ff;
      font-weight: 700;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      flex-shrink: 0;
    }

    .t-cmd-text {
      color: #e6edf3;
      user-select: text;
      -webkit-user-select: text;
    }

    .t-line.t-comment,
    .t-comment-text {
      color: #8b949e;
      font-style: italic;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      cursor: default;
    }

    .t-prefix {
      color: #6e7681;
      font-weight: 700;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      flex-shrink: 0;
    }

    @media screen and (max-width: 900px) {
      .main-content {
        padding: 14px 14px 40px 14px;
      }
      .top-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .workstation-card {
        justify-content: space-between;
      }
      .workspace {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .sidebar {
        position: static;
        max-height: 280px;
      }
      .task-items {
        max-height: 200px;
      }
      .detail-pane {
        padding: 18px 18px 30px 18px;
      }
      .header-actions {
        flex-direction: row;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="module-selector-wrapper">
        <label for="module-select" class="module-selector-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>Zadání:</span>
        </label>
        <select id="module-select" class="module-select" onchange="switchModule(this.value)">
          <!-- Naplněno dynamicky z registru OPS_MODULES -->
        </select>
      </div>
      <h1 id="page-title">Konfigurace zkurvených VM</h1>
    </div>
    <div class="header-actions">
      <a href="praxe/01/__zadani.html" target="_blank" rel="noopener noreferrer" class="doc-link-btn" id="btn-doc-zadani" title="Otevřít zformátované zadání (_zadani.md) v nové záložce">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>_zadani.md</span>
        <svg class="external-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <a href="praxe/01/__reseni.html" target="_blank" rel="noopener noreferrer" class="doc-link-btn" id="btn-doc-reseni" title="Otevřít zformátované řešení (__reseni.md) v nové záložce">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        <span>__reseni.md</span>
        <svg class="external-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <button class="reset-btn" onclick="resetCurrentVM()">Resetovat stav VM</button>
      <a href="index.html" class="back-btn">Chcu zpět</a>
    </div>
  </header>

  <div class="main-content">
    <div class="top-controls">
      <div class="vm-tabs" id="vm-tabs-container">
        <!-- Renderováno dynamicky podle konfigurace vybraného modulu a verified.json -->
      </div>

      <div class="workstation-card">
        <div class="ws-header">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
          <span class="ws-title">Pracoviště X:</span>
          <div class="ws-stepper">
            <button type="button" class="ws-step-btn" onclick="stepWorkstation(-1)" title="Snížit číslo pracoviště">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <input type="number" id="workstation-input" class="ws-number-input" min="1" max="254" value="2" oninput="changeWorkstation(this.value)">
            <button type="button" class="ws-step-btn" onclick="stepWorkstation(1)" title="Zvýšit číslo pracoviště">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
        <div class="ws-info-pill" id="ws-info-text">
          <span>Podsíť: <strong>192.168.2.0/24</strong></span>
          <span class="ws-sep">•</span>
          <span>GW: <strong>192.168.2.1</strong></span>
          <span class="ws-sep">•</span>
          <span>DC: <strong>.10</strong> | FS: <strong>.20</strong></span>
        </div>
      </div>
    </div>

    <div class="workspace">
      <div class="sidebar">
        <div class="sidebar-header">
          <div style="display:flex; justify-content:space-between; font-size: 0.8rem; color: var(--text-muted);">
            <span>Dokončeno</span>
            <span id="progress-text">0 %</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
        </div>
        <ul class="task-items" id="task-list"></ul>
      </div>

      <div class="detail-pane" id="detail-pane"></div>
    </div>
  </div>

  <script>
    let currentModuleId = "01";
    let currentModuleConfig = null;
    let currentVerifiedConfig = {};
    let taskDefinitions = [];
    let currentVM = "SRV1-DC";
    let selectedTaskId = "";
    let workstationX = parseInt(localStorage.getItem('lab_workstation_x') || '2', 10);
    if (isNaN(workstationX) || workstationX < 1 || workstationX > 254) {
      workstationX = 2;
    }

    function initModuleFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      let mod = urlParams.get('modul') || urlParams.get('module');
      if (!mod && window.location.hash) {
        mod = window.location.hash.replace('#', '').trim();
      }
      const modules = window.OPS_MODULES || [];
      if (mod && modules.find(m => m.id === mod)) {
        return mod;
      }
      return modules.length > 0 ? modules[0].id : "01";
    }

    function initModuleSelect() {
      const select = document.getElementById("module-select");
      if (!select) return;
      const modules = window.OPS_MODULES || [];
      select.innerHTML = modules.map(m => `
        <option value="${m.id}" ${m.id === currentModuleId ? 'selected' : ''}>
          ${m.title}
        </option>
      `).join('');
    }

    function switchModule(modId) {
      if (modId === currentModuleId) return;
      const url = new URL(window.location.href);
      url.searchParams.set('modul', modId);
      window.history.replaceState({}, '', url.toString());
      loadModule(modId);
    }

    function updateDocLinks() {
      const zadaniBtn = document.getElementById("btn-doc-zadani");
      const reseniBtn = document.getElementById("btn-doc-reseni");
      const pageTitle = document.getElementById("page-title");
      const folder = (currentModuleConfig && currentModuleConfig.folder) || `praxe/${currentModuleId}`;
      const title = (currentModuleConfig && (currentModuleConfig.shortTitle || currentModuleConfig.title)) || `Modul ${currentModuleId}`;
      
      if (zadaniBtn) {
        zadaniBtn.href = `${folder}/__zadani.html`;
        zadaniBtn.title = `Otevřít zformátované zadání (__zadani.md) pro ${title} v nové záložce`;
      }
      if (reseniBtn) {
        reseniBtn.href = `${folder}/__reseni.html`;
        reseniBtn.title = `Otevřít zformátované řešení (__reseni.md) pro ${title} v nové záložce`;
      }
      if (pageTitle && currentModuleConfig && currentModuleConfig.title) {
        pageTitle.textContent = currentModuleConfig.title;
      }
    }

    function loadScript(src) {
      return new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => resolve(true);
        script.onerror = () => {
          console.warn(`Nepodařilo se načíst skript ${src}`);
          resolve(false);
        };
        document.head.appendChild(script);
      });
    }

    async function loadVerifiedConfig(moduleId) {
      try {
        const res = await fetch(`praxe/${moduleId}/verified.json?t=${Date.now()}`);
        if (res.ok) {
          return await res.json();
        }
      } catch (e) {
        console.warn(`Nepodařilo se načíst praxe/${moduleId}/verified.json přes fetch. Používám záložní stav.`, e);
      }
      if (window.OPS_MODULE_VERIFIED && window.OPS_MODULE_VERIFIED[moduleId]) {
        return window.OPS_MODULE_VERIFIED[moduleId];
      }
      return {};
    }

    function getStorageKey(vm, taskId) {
      return `ops_done_${currentModuleId}_${vm}_${taskId}`;
    }

    function isTaskDone(vm, taskId) {
      const key = getStorageKey(vm, taskId);
      const val = localStorage.getItem(key);
      if (val !== null) return val === "1";
      if (currentModuleId === "01") {
        return localStorage.getItem(`vm_task_${vm}_${taskId}`) === "1" || localStorage.getItem(`lab_${vm}_${taskId}`) === "1";
      }
      return false;
    }

    function setTaskDone(vm, taskId, done) {
      const key = getStorageKey(vm, taskId);
      if (done) {
        localStorage.setItem(key, "1");
      } else {
        localStorage.removeItem(key);
      }
      if (currentModuleId === "01") {
        if (done) {
          localStorage.setItem(`vm_task_${vm}_${taskId}`, "1");
        } else {
          localStorage.removeItem(`vm_task_${vm}_${taskId}`);
        }
      }
    }

    function autoCheckVerifiedTasks() {
      const vms = (currentModuleConfig && currentModuleConfig.vms) || ["SRV1-DC", "SRV2-FS", "PC1-WIN"];
      vms.forEach(vm => {
        if (currentVerifiedConfig[vm] === true) {
          const initKey = `ops_verified_autodone_${currentModuleId}_${vm}_v2`;
          if (!localStorage.getItem(initKey)) {
            taskDefinitions
              .filter(t => t.forVMs.includes(vm))
              .forEach(t => setTaskDone(vm, t.id, true));
            localStorage.setItem(initKey, "1");
          }
        }
      });
    }

    function changeWorkstation(val) {
      let num = parseInt(val, 10);
      if (isNaN(num) || num < 1 || num > 254) {
        num = 2;
      }
      workstationX = num;
      localStorage.setItem('lab_workstation_x', workstationX.toString());
      updateWorkstationUI();
      render();
    }

    function stepWorkstation(delta) {
      let num = workstationX + delta;
      if (num < 1) num = 1;
      if (num > 254) num = 254;
      changeWorkstation(num);
    }

    function updateWorkstationUI() {
      const inputEl = document.getElementById("workstation-input");
      if (inputEl && inputEl.value !== workstationX.toString()) {
        inputEl.value = workstationX;
      }
      const infoEl = document.getElementById("ws-info-text");
      if (infoEl) {
        infoEl.innerHTML = `
          <span>Podsíť: <strong>192.168.${workstationX}.0/24</strong></span>
          <span class="ws-sep">•</span>
          <span>GW: <strong>192.168.${workstationX}.1</strong></span>
          <span class="ws-sep">•</span>
          <span>DC: <strong>.10</strong> | FS: <strong>.20</strong></span>
        `;
      }
    }

    function switchVM(vm) {
      currentVM = vm;
      document.querySelectorAll('.vm-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${vm}`);
      if (activeBtn) activeBtn.classList.add('active');

      const relevant = taskDefinitions.filter(t => t.forVMs.includes(currentVM));
      if (!relevant.find(t => t.id === selectedTaskId)) {
        selectedTaskId = relevant.length > 0 ? relevant[0].id : "";
      }
      render();
    }

    function toggleTask(taskId, checked, ev) {
      if (ev) ev.stopPropagation();
      setTaskDone(currentVM, taskId, checked);
      render();
    }

    function selectTask(taskId) {
      selectedTaskId = taskId;
      render();
      const detailEl = document.getElementById("detail-pane");
      if (detailEl) {
        const topPos = detailEl.getBoundingClientRect().top + window.pageYOffset - 75;
        if (window.pageYOffset > topPos || window.innerHeight + window.pageYOffset < topPos) {
          window.scrollTo({ top: Math.max(0, topPos), behavior: "smooth" });
        }
      }
    }

    function resetCurrentVM() {
      const title = (currentModuleConfig && (currentModuleConfig.shortTitle || currentModuleConfig.title)) || `Modul ${currentModuleId}`;
      if (confirm(`Resetovat záznamy pro ${currentVM} v ${title}?`)) {
        taskDefinitions.forEach(t => setTaskDone(currentVM, t.id, false));
        render();
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTerminalPowerShell(rawCode) {
      if (!rawCode) return "";
      const lines = rawCode.trim().split("\n");
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) {
          return '<div class="t-line empty">&nbsp;</div>';
        }
        if (trimmed.startsWith("#")) {
          return `<div class="t-line t-comment"><span class="t-prefix">#</span> <span class="t-comment-text">${escapeHtml(trimmed.substring(1).trim())}</span></div>`;
        }
        return `<div class="t-line"><span class="t-ps-prompt">PS C:\\&gt;</span> <span class="t-cmd-text">${escapeHtml(line)}</span></div>`;
      }).join("");
    }

    function copyTaskCode(taskId, type, btn) {
      const task = taskDefinitions.find(t => t.id === taskId);
      if (!task) return;
      let rawCode = "";
      if (type === "how") {
        rawCode = typeof task.how === "function" ? task.how(currentVM, workstationX) : task.how;
      } else if (type === "verify") {
        rawCode = typeof task.verify === "function" ? task.verify(currentVM, workstationX) : task.verify;
      }
      if (!rawCode) return;

      const commandLines = rawCode
        .split("\n")
        .filter(line => !line.trim().startsWith("#"))
        .join("\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();

      const textToCopy = commandLines || rawCode.trim();

      navigator.clipboard.writeText(textToCopy).then(() => {
        const origHtml = btn.innerHTML;
        btn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>Zkopírováno</span>
        `;
        setTimeout(() => { btn.innerHTML = origHtml; }, 1400);
      });
    }

    function renderVMTabs() {
      const container = document.getElementById("vm-tabs-container");
      if (!container) return;
      const vms = (currentModuleConfig && currentModuleConfig.vms) || ["SRV1-DC", "SRV2-FS", "PC1-WIN"];
      container.innerHTML = vms.map(vm => {
        const isVerified = currentVerifiedConfig[vm] === true;
        const isActive = currentVM === vm;
        return `
          <button class="vm-btn ${isActive ? 'active' : ''}" id="btn-${vm}" onclick="switchVM('${vm}')">
            ${vm} <span class="vm-badge" id="badge-${vm}">0/0</span>
            ${isVerified ? `
              <span class="vm-verified-tag" title="Všechny příkazy a konfigurace na ${vm} byly v praxi otestovány a ověřeny jako 100% funkční!">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Ověřeno OK
              </span>
            ` : ''}
          </button>
        `;
      }).join('');
    }

    function updateBadges() {
      const vms = (currentModuleConfig && currentModuleConfig.vms) || ["SRV1-DC", "SRV2-FS", "PC1-WIN"];
      vms.forEach(vm => {
        const tasks = taskDefinitions.filter(t => t.forVMs.includes(vm));
        const done = tasks.filter(t => isTaskDone(vm, t.id)).length;
        const badge = document.getElementById(`badge-${vm}`);
        if (badge) {
          badge.innerText = `${done}/${tasks.length}`;
        }
      });
    }

    function render() {
      renderVMTabs();
      updateBadges();
      updateWorkstationUI();

      const relevantTasks = taskDefinitions.filter(t => t.forVMs.includes(currentVM));
      const listEl = document.getElementById("task-list");
      listEl.innerHTML = "";

      let doneCount = 0;

      relevantTasks.forEach(t => {
        const isDone = isTaskDone(currentVM, t.id);
        if (isDone) doneCount++;

        const li = document.createElement("li");
        li.className = `task-item ${t.id === selectedTaskId ? 'selected' : ''}`;
        li.onclick = () => selectTask(t.id);

        li.innerHTML = `
          <input type="checkbox" class="custom-checkbox" ${isDone ? "checked" : ""} onclick="toggleTask('${t.id}', this.checked, event)">
          <span class="task-label ${isDone ? 'done' : ''}">${t.title}</span>
        `;
        listEl.appendChild(li);
      });

      const total = relevantTasks.length || 1;
      const pct = Math.round((doneCount / total) * 100);
      document.getElementById("progress-bar").style.width = `${pct}%`;
      document.getElementById("progress-text").innerText = `${pct} %`;

      const currentTask = relevantTasks.find(t => t.id === selectedTaskId) || relevantTasks[0];
      const detailEl = document.getElementById("detail-pane");

      if (!currentTask) {
        detailEl.innerHTML = `<div style="padding: 30px; color: var(--text-muted);">Pro tento stroj nejsou definovány žádné úkoly.</div>`;
        return;
      }

      const isDone = isTaskDone(currentVM, currentTask.id);
      const whatText = typeof currentTask.what === "function" ? currentTask.what(currentVM, workstationX) : (currentTask.what || currentTask.why);
      const howText = typeof currentTask.how === "function" ? currentTask.how(currentVM, workstationX) : currentTask.how;
      const verifyText = typeof currentTask.verify === "function" ? currentTask.verify(currentVM, workstationX) : currentTask.verify;
      const expectedText = typeof currentTask.expected === "function" ? currentTask.expected(currentVM, workstationX) : currentTask.expected;

      const currentIndex = relevantTasks.findIndex(t => t.id === currentTask.id);
      const prevTask = currentIndex > 0 ? relevantTasks[currentIndex - 1] : null;
      const nextTask = currentIndex < relevantTasks.length - 1 ? relevantTasks[currentIndex + 1] : null;

      const isVerified = currentVerifiedConfig[currentVM] === true;
      const verifiedBanner = isVerified ? `
        <div class="vm-verified-alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <div>
            <strong>${currentVM} je ověřený v labu:</strong> Všechny PowerShell příkazy a konfigurace byly na stroji ${currentVM} v praxi otestovány a jsou 100% OK!
          </div>
        </div>
      ` : '';

      detailEl.innerHTML = `
        <div class="detail-title">
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="vm-tag">${currentVM}</span>
            <span>${currentTask.title}</span>
          </div>
          <label class="status-toggle ${isDone ? 'is-done' : ''}">
            <input type="checkbox" class="custom-checkbox" ${isDone ? "checked" : ""} onchange="toggleTask('${currentTask.id}', this.checked)">
            <span>${isDone ? 'Hotovo' : 'Označit jako hotové'}</span>
          </label>
        </div>

        ${verifiedBanner}

        <!-- 1. CÍL ÚKOLU -->
        <div class="step-card step-goal">
          <div class="step-card-header">
            <div class="step-header-left">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
              <span>Cíl úkolu</span>
            </div>
          </div>
          <div class="step-card-body">${whatText}</div>
        </div>

        <!-- 2. PŘÍKAZ K PROVEDENÍ (TERMINÁL) -->
        <div class="step-card step-action">
          <div class="step-card-header">
            <div class="step-header-left">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
              <span>1. Příkaz k provedení</span>
            </div>
          </div>
          <div class="step-card-body">
            <div class="terminal-box">
              <div class="terminal-header">
                <div class="terminal-controls">
                  <span class="t-dot red"></span>
                  <span class="t-dot yellow"></span>
                  <span class="t-dot green"></span>
                </div>
                <div class="terminal-title-text">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                  <span>Administrator: Windows PowerShell</span>
                </div>
                <button class="terminal-copy-btn" onclick="copyTaskCode('${currentTask.id}', 'how', this)">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  <span>Kopírovat příkaz</span>
                </button>
              </div>
              <div class="terminal-body">
                ${formatTerminalPowerShell(howText)}
              </div>
            </div>
          </div>
        </div>

        <!-- 3. KONTROLA VÝSLEDKU (TERMINÁL + OČEKÁVANÝ VÝSTUP) -->
        <div class="step-card step-verify">
          <div class="step-card-header">
            <div class="step-header-left">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <span>2. Kontrola výsledku</span>
            </div>
          </div>
          <div class="step-card-body">
            <div class="terminal-box">
              <div class="terminal-header">
                <div class="terminal-controls">
                  <span class="t-dot red"></span>
                  <span class="t-dot yellow"></span>
                  <span class="t-dot green"></span>
                </div>
                <div class="terminal-title-text">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                  <span>Administrator: Windows PowerShell (Test)</span>
                </div>
                <button class="terminal-copy-btn" onclick="copyTaskCode('${currentTask.id}', 'verify', this)">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  <span>Kopírovat test</span>
                </button>
              </div>
              <div class="terminal-body">
                ${formatTerminalPowerShell(verifyText)}
              </div>
            </div>

            <div class="expected-output-box">
              <div class="expected-output-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <span>Správný výstup konzole (musí odpovídat):</span>
              </div>
              <div class="expected-output-content">${escapeHtml(expectedText)}</div>
            </div>
          </div>
        </div>

        <div class="detail-nav-footer">
          <button class="nav-step-btn" ${prevTask ? `onclick="selectTask('${prevTask.id}')"` : "disabled"}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Předchozí úkol
          </button>
          <button class="nav-step-btn" ${nextTask ? `onclick="selectTask('${nextTask.id}')"` : "disabled"}>
            Další úkol
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>
      `;
    }

    async function loadModule(moduleId) {
      const modules = window.OPS_MODULES || [];
      const config = modules.find(m => m.id === moduleId) || modules[0] || {
        id: "01",
        code: "M01",
        title: "Modul 01: Příprava a instalace OS",
        folder: "praxe/01",
        vms: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        defaultVM: "SRV1-DC"
      };

      currentModuleId = config.id;
      currentModuleConfig = config;

      // Načíst úkoly, pokud ještě nejsou v paměti
      if (!window.OPS_MODULE_TASKS || !window.OPS_MODULE_TASKS[currentModuleId]) {
        await loadScript(config.tasksFile || `praxe/${currentModuleId}/tasks.js`);
      }
      taskDefinitions = (window.OPS_MODULE_TASKS && window.OPS_MODULE_TASKS[currentModuleId]) || [];

      // Načíst stav ověření strojů
      currentVerifiedConfig = await loadVerifiedConfig(currentModuleId);

      // Aktualizovat select a horní odkazy
      initModuleSelect();
      updateDocLinks();

      // Zkontrolovat platnost vybraného stroje
      const availableVMs = config.vms || ["SRV1-DC", "SRV2-FS", "PC1-WIN"];
      if (!availableVMs.includes(currentVM)) {
        currentVM = config.defaultVM || availableVMs[0];
      }

      // Automaticky označit hotové u ověřených strojů
      autoCheckVerifiedTasks();

      // Nastavit výchozí úkol
      const relevant = taskDefinitions.filter(t => t.forVMs.includes(currentVM));
      if (!relevant.find(t => t.id === selectedTaskId)) {
        selectedTaskId = relevant.length > 0 ? relevant[0].id : "";
      }

      render();
    }

    // Inicializace aplikace
    window.addEventListener("DOMContentLoaded", () => {
      const initialModId = initModuleFromURL();
      loadModule(initialModId);
    });
  </script>
</body>
</html>
