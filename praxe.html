<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrolní seznam přípravy VM - Modul 0</title>
  <link rel="icon" type="image/x-icon" href="img/remielle.jpg">

  <style>
    :root {
      --bg-main: #1a1a1a;
      --bg-sidebar: #222;
      --bg-box: #242424;
      --border-color: #333;
      --text-main: #e0e0e0;
      --text-muted: #888;
      --accent: #ff5555;
      --accent-hover: #ff7777;
      --code-bg: #151515;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    header {
      width: 100%;
      background-color: var(--bg-sidebar);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      z-index: 10;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
    }

    .back-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    .reset-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 25px;
      overflow: hidden;
      min-height: 0;
      box-sizing: border-box;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .vm-tabs {
      display: flex;
      gap: 8px;
    }

    .vm-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .vm-btn:hover {
      background-color: #2a2a2a;
      border-color: #444;
      color: #fff;
    }

    .vm-btn.active {
      background-color: #332222;
      color: var(--accent-hover);
      border-color: var(--accent);
      font-weight: bold;
    }

    .vm-badge {
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .vm-btn.active .vm-badge {
      background: rgba(255, 85, 85, 0.25);
      color: var(--accent-hover);
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: minmax(0, 1fr);
      gap: 18px;
      flex: 1;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .sidebar {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      height: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
    }

    .progress-bar-bg {
      background: var(--code-bg);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }

    .task-items {
      overflow-y: auto;
      list-style: none;
      flex: 1;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      gap: 10px;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .task-item:hover {
      background-color: #2a2a2a;
      color: #fff;
    }

    .task-item.selected {
      background-color: #332222;
      border-left: 3px solid var(--accent);
      color: var(--accent-hover);
      font-weight: 600;
    }

    /* Vlastní stylování checkboxů */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #555;
      border-radius: 4px;
      background-color: #181818;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .custom-checkbox:hover {
      border-color: var(--accent);
      background-color: #222;
      box-shadow: 0 0 6px rgba(255, 85, 85, 0.3);
    }

    .custom-checkbox:checked {
      background-color: var(--accent);
      border-color: var(--accent);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2.5-2.5a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3E%3C/svg%3E");
      background-size: 13px 13px;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 0 8px rgba(255, 85, 85, 0.45);
    }

    .custom-checkbox:active {
      transform: scale(0.9);
    }

    /* Moderní přepínač stavu v detailu úkolu */
    .status-toggle {
      font-size: 0.82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      user-select: none;
      color: var(--text-muted);
    }

    .status-toggle:hover {
      background: #252525;
      border-color: #555;
      color: var(--text-main);
    }

    .status-toggle.is-done {
      background: rgba(255, 85, 85, 0.12);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    /* Navigace mezi úkoly v patce detailu */
    .detail-nav-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .nav-step-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-step-btn:hover:not(:disabled) {
      background-color: #2a2a2a;
      border-color: var(--accent);
      color: #fff;
    }

    .nav-step-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--border-color);
    }

    .task-label {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-label.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .detail-pane {
      background: var(--bg-box);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 22px 25px 35px 25px;
      overflow-y: auto;
      min-height: 0;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .detail-pane::-webkit-scrollbar, .task-items::-webkit-scrollbar, .terminal-body::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    .detail-pane::-webkit-scrollbar-track, .task-items::-webkit-scrollbar-track, .terminal-body::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    .detail-pane::-webkit-scrollbar-thumb, .task-items::-webkit-scrollbar-thumb, .terminal-body::-webkit-scrollbar-thumb {
      background: #383838;
      border-radius: 4px;
    }
    .detail-pane::-webkit-scrollbar-thumb:hover, .task-items::-webkit-scrollbar-thumb:hover, .terminal-body::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .detail-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .vm-tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--accent-hover);
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-family: ui-monospace, monospace;
    }

    /* 3-krokové karty pro hlavní okno */
    .step-card {
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .step-card.step-goal {
      border-left: 4px solid #6b7280;
    }

    .step-card.step-action {
      border-left: 4px solid var(--accent);
      border-color: #3d2a2c;
    }

    .step-card.step-verify {
      border-left: 4px solid #3b82f6;
      border-color: #1e2c3f;
    }

    .step-card-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .step-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-goal .step-card-header {
      background: #222222;
      color: #9ca3af;
      border-bottom-color: #2e2e2e;
    }

    .step-action .step-card-header {
      background: #251c1d;
      color: var(--accent-hover);
      border-bottom-color: #382424;
    }

    .step-verify .step-card-header {
      background: #16202e;
      color: #60a5fa;
      border-bottom-color: #1e2d42;
    }

    .step-card-body {
      padding: 14px 16px;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    pre.action-code {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      color: #ffc9c2;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--code-bg);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #382424;
      margin: 0;
    }

    pre.verify-code {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      color: #bfdbfe;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--code-bg);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      margin: 0;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 4px;
      padding: 5px 11px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn-action {
      background: rgba(255, 85, 85, 0.18);
      border: 1px solid rgba(255, 85, 85, 0.45);
      color: #fff;
    }

    .copy-btn-action:hover {
      background: rgba(255, 85, 85, 0.35);
      border-color: var(--accent);
      color: #fff;
    }

    .copy-btn-verify {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #fff;
    }

    .copy-btn-verify:hover {
      background: rgba(59, 130, 246, 0.35);
      border-color: #60a5fa;
      color: #fff;
    }

    /* Očekávaný výstup ověření */
    .expected-output-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: #101712;
      border: 1px solid #1c3222;
      border-left: 3px solid #22c55e;
      border-radius: 6px;
    }

    .expected-output-header {
      font-size: 0.76rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: #4ade80;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .expected-output-content {
      font-size: 0.84rem;
      color: #d1fae5;
      line-height: 1.55;
      white-space: pre-line;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      background: #090e0b;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #162a1c;
      overflow-x: auto;
    }

    /* Přehledná tabulka parametrů */
    .params-table-wrapper {
      overflow-x: auto;
      width: 100%;
      margin: 4px 0 8px 0;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .params-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: #181818;
      text-align: left;
    }

    .params-table th, .params-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #282828;
      border-right: 1px solid #242424;
      white-space: nowrap;
    }

    .params-table th:last-child, .params-table td:last-child {
      border-right: none;
    }

    .params-table th {
      background-color: #222;
      color: #fff;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .params-table tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .params-table .active-col {
      background-color: rgba(255, 85, 85, 0.1);
      color: #fff;
      font-weight: 600;
      border-left: 1px solid rgba(255, 85, 85, 0.35);
      border-right: 1px solid rgba(255, 85, 85, 0.35);
    }

    .params-table th.active-col {
      background-color: rgba(255, 85, 85, 0.22);
      color: var(--accent-hover);
      border-bottom: 2px solid var(--accent);
    }

    .params-table tr.active-row {
      background-color: rgba(255, 85, 85, 0.1);
      font-weight: 600;
    }

    .params-table tr.active-row td {
      color: #fff;
      border-top: 1px solid rgba(255, 85, 85, 0.35);
      border-bottom: 1px solid rgba(255, 85, 85, 0.35);
    }

    /* Ovládání čísla pracoviště X */
    .workstation-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .ws-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-weight: 600;
    }

    .ws-number-input {
      width: 52px;
      background: #141414;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 4px 6px;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .ws-number-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 6px rgba(255, 85, 85, 0.4);
      background: #1d1717;
    }

    .ws-info-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .ws-info-pill strong {
      color: var(--accent-hover);
      font-family: ui-monospace, monospace;
    }

    .ws-sep {
      color: #555;
    }

    /* Varovný a navigační banner pro síťová rozhraní NIC 1 / 2 / 3 */
    .nic-warning-banner {
      background: #1a1612;
      border: 1px solid #452b12;
      border-left: 4px solid #f59e0b;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .nic-warning-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fbbf24;
      font-weight: 700;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }

    .nic-roles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .nic-role-item {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nic-role-item.nic-locked {
      border-color: #552525;
      background: rgba(45, 15, 15, 0.3);
    }

    .nic-role-item.nic-active {
      border-color: #1e4a2a;
      background: rgba(16, 45, 24, 0.35);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.08);
    }

    .nic-role-item.nic-class {
      border-color: #1d334e;
      background: rgba(15, 30, 48, 0.3);
    }

    .nic-role-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nic-badge {
      font-size: 0.75rem;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .nic-badge.danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .nic-badge.success {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.5);
    }

    .nic-badge.info {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .nic-tag {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .nic-tag.active {
      color: #4ade80;
    }

    .nic-role-desc {
      font-size: 0.8rem;
      color: #d1d5db;
      line-height: 1.45;
    }

    .nic-role-desc code {
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 4px;
      border-radius: 3px;
      color: #fef08a;
      font-family: ui-monospace, monospace;
    }

    .nic-alert-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.78rem;
      color: #fde68a;
      background: rgba(245, 158, 11, 0.1);
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid rgba(245, 158, 11, 0.25);
      line-height: 1.45;
    }

    .nic-alert-note svg {
      flex-shrink: 0;
      margin-top: 2px;
      color: #f59e0b;
    }

    .nic-alert-note code {
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: ui-monospace, monospace;
    }

    /* Terminal Console Styling */
    .terminal-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    .terminal-header {
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .terminal-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .t-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .t-dot.red { background: #ff5f56; }
    .t-dot.yellow { background: #ffbd2e; }
    .t-dot.green { background: #27c93f; }

    .terminal-title-text {
      color: #8b949e;
      font-size: 0.78rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.3px;
    }

    .terminal-copy-btn {
      background: #21262d;
      border: 1px solid #363b42;
      color: #c9d1d9;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .terminal-copy-btn:hover {
      background: #30363d;
      color: #fff;
      border-color: #58a6ff;
    }

    .terminal-body {
      padding: 14px 16px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #e6edf3;
      overflow-x: auto;
      max-height: 380px;
      overflow-y: auto;
    }

    .t-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      word-break: break-all;
    }

    .t-line.empty {
      height: 8px;
    }

    .t-ps-prompt {
      color: #58a6ff;
      font-weight: 700;
      user-select: none;
      flex-shrink: 0;
    }

    .t-cmd-text {
      color: #e6edf3;
    }

    .t-line.t-comment {
      color: #8b949e;
      font-style: italic;
    }

    .t-prefix {
      color: #6e7681;
      font-weight: 700;
      user-select: none;
      flex-shrink: 0;
    }

    .t-comment-text {
      color: #8b949e;
    }

    @media screen and (max-width: 860px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      .main-content {
        padding: 14px;
        overflow: visible;
        height: auto;
      }
      .top-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .workstation-card {
        justify-content: space-between;
      }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        overflow: visible;
        height: auto;
      }
      .sidebar {
        max-height: 260px;
        height: auto;
      }
      .detail-pane {
        height: auto;
        overflow: visible;
        padding-bottom: 25px;
      }
      .header-actions {
        flex-direction: row;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Konfigurace zkurvených VM</h1>
    <div class="header-actions">
      <button class="reset-btn" onclick="resetCurrentVM()">Resetovat stav VM</button>
      <a href="index.html" class="back-btn">Chcu zpět</a>
    </div>
  </header>

  <div class="main-content">
    <div class="top-controls">
      <div class="vm-tabs">
        <button class="vm-btn active" id="btn-SRV1-DC" onclick="switchVM('SRV1-DC')">
          SRV1-DC <span class="vm-badge" id="badge-SRV1-DC">0/11</span>
        </button>
        <button class="vm-btn" id="btn-SRV2-FS" onclick="switchVM('SRV2-FS')">
          SRV2-FS <span class="vm-badge" id="badge-SRV2-FS">0/11</span>
        </button>
        <button class="vm-btn" id="btn-PC1-WIN" onclick="switchVM('PC1-WIN')">
          PC1-WIN <span class="vm-badge" id="badge-PC1-WIN">0/12</span>
        </button>
      </div>

      <div class="workstation-card">
        <div class="ws-header">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
          <span class="ws-title">Pracoviště X:</span>
          <input type="number" id="workstation-input" class="ws-number-input" min="1" max="254" value="2" oninput="changeWorkstation(this.value)">
        </div>
        <div class="ws-info-pill" id="ws-info-text">
          <span>Podsíť: <strong>192.168.2.0/24</strong></span>
          <span class="ws-sep">•</span>
          <span>GW: <strong>192.168.2.1</strong></span>
          <span class="ws-sep">•</span>
          <span>DC: <strong>.10</strong> | FS: <strong>.20</strong></span>
        </div>
      </div>
    </div>

    <div class="workspace">
      <div class="sidebar">
        <div class="sidebar-header">
          <div style="display:flex; justify-content:space-between; font-size: 0.8rem; color: var(--text-muted);">
            <span>Dokončeno</span>
            <span id="progress-text">0 %</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
        </div>
        <ul class="task-items" id="task-list"></ul>
      </div>

      <div class="detail-pane" id="detail-pane"></div>
    </div>
  </div>

  <script>
    const taskDefinitions = [
      {
        id: "vm-specs",
        title: "1. Parametry virtuálního stroje",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => `
          <div class="params-table-wrapper">
            <table class="params-table">
              <thead>
                <tr>
                  <th>Parametr</th>
                  <th class="${vm === 'SRV1-DC' ? 'active-col' : ''}">SRV1-DC</th>
                  <th class="${vm === 'SRV2-FS' ? 'active-col' : ''}">SRV2-FS</th>
                  <th class="${vm === 'PC1-WIN' ? 'active-col' : ''}">PC1-WIN</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>vCPU</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">2 jádra</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}">2 jádra</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">2 jádra</td>
                </tr>
                <tr>
                  <td><strong>RAM</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">8 GB</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}">8 GB</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">8 GB</td>
                </tr>
                <tr>
                  <td><strong>Systémový disk</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">100 GB</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}">100 GB</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">60 GB</td>
                </tr>
                <tr>
                  <td><strong>Další disky</strong></td>
                  <td class="${vm === 'SRV1-DC' ? 'active-col' : ''}">—</td>
                  <td class="${vm === 'SRV2-FS' ? 'active-col' : ''}"><strong>5× 10 GB</strong> (Storage Pool)</td>
                  <td class="${vm === 'PC1-WIN' ? 'active-col' : ''}">—</td>
                </tr>
              </tbody>
            </table>
          </div>
        `,
        how: (vm) => {
          if (vm === "PC1-WIN") return "V hypervizoru: 2 vCPU, 8 GB RAM, 60 GB systémový disk.";
          if (vm === "SRV2-FS") return "V hypervizoru: 2 vCPU, 8 GB RAM, 100 GB systémový disk + 5x virtuální disk o velikosti 10 GB.";
          return "V hypervizoru: 2 vCPU, 8 GB RAM, 100 GB systémový disk.";
        },
        verify: (vm) => {
          if (vm === "SRV2-FS") return "Get-Disk | Select-Object Number, FriendlyName, Size, PartitionStyle\n# Ověřte systémový disk (~100 GB) a 5x RAW disků (~10 GB)";
          return "Get-Disk | Select-Object Number, FriendlyName, Size";
        },
        expected: (vm) => {
          if (vm === "SRV2-FS") return "Výpis obsahuje systémový disk (~100 GB) a 5x neinicializovaných disků (~10 GB) ve stavu RAW:\nNumber  FriendlyName            Size  PartitionStyle\n------  ------------            ----  --------------\n0       ... (Systémový disk)  ~100 GB  GPT/MBR\n1-5     ... (5x datový disk)   ~10 GB  RAW";
          if (vm === "PC1-WIN") return "Výpis obsahuje systémový disk o velikosti přibližně 60 GB:\nNumber  FriendlyName  Size\n0       ...          ~60 GB";
          return "Výpis obsahuje systémový disk o velikosti přibližně 100 GB:\nNumber  FriendlyName  Size\n0       ...          ~100 GB";
        }
      },
      {
        id: "os-edition",
        title: "2. Edice a instalace Windows",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => `
          <div class="params-table-wrapper">
            <table class="params-table">
              <thead>
                <tr>
                  <th>Stroj</th>
                  <th>Edice Windows</th>
                  <th>Typ rozhraní</th>
                  <th>Jazyk média</th>
                </tr>
              </thead>
              <tbody>
                <tr class="${vm === 'SRV1-DC' ? 'active-row' : ''}">
                  <td><strong>SRV1-DC</strong></td>
                  <td>Windows Server 2025 Datacenter</td>
                  <td>Desktop Experience (s GUI)</td>
                  <td>English (United States)</td>
                </tr>
                <tr class="${vm === 'SRV2-FS' ? 'active-row' : ''}">
                  <td><strong>SRV2-FS</strong></td>
                  <td>Windows Server 2025 Datacenter</td>
                  <td>Desktop Experience (s GUI)</td>
                  <td>English (United States)</td>
                </tr>
                <tr class="${vm === 'PC1-WIN' ? 'active-row' : ''}">
                  <td><strong>PC1-WIN</strong></td>
                  <td>Windows 11 Education N</td>
                  <td>Bez multimédií (EU edice)</td>
                  <td>English (United States)</td>
                </tr>
              </tbody>
            </table>
          </div>
        `,
        how: (vm) => {
          if (vm === "PC1-WIN") return "Instalace Windows 11 Education N (jazyk: English - United States).";
          return "Instalace Windows Server 2025 Datacenter (Desktop Experience). Neinstalovat Server Core.";
        },
        verify: (vm) => {
          if (vm === "PC1-WIN") return "Get-ComputerInfo | Select-Object WindowsProductName";
          return "Get-ComputerInfo | Select-Object WindowsProductName, OsServerLevel";
        },
        expected: (vm) => {
          if (vm === "PC1-WIN") return "WindowsProductName : Windows 11 Education N (případně Windows 11 Education)";
          return "WindowsProductName : Windows Server 2025 Datacenter\nOsServerLevel      : FullServer (potvrzuje Desktop Experience, nikoliv ServerCore)";
        }
      },
      {
        id: "hostname",
        title: "3. Jméno počítače (Hostname)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => `Přejmenujte stroj na přesný název "${vm}" a restartujte jej. Jednoznačné jméno je klíčové pro komunikaci v síti a budoucí řadič domény.`,
        how: (vm) => `Rename-Computer -NewName "${vm}" -Restart`,
        verify: () => "hostname",
        expected: (vm) => `Vrátí přesný název stroje:\n${vm}`
      },
      {
        id: "networking",
        title: "4. Nastavení TCP/IPv4",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => {
          const nicBanner = `
            <div class="nic-warning-banner">
              <div class="nic-warning-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <span>DŮLEŽITÉ: Pravidla síťových rozhraní (NIC) a kontrola adaptéru</span>
              </div>
              <div class="nic-roles">
                <div class="nic-role-item nic-locked">
                  <div class="nic-role-top">
                    <span class="nic-badge danger">NIC 1 (Ethernet)</span>
                    <span class="nic-tag">NEŠAHAT</span>
                  </div>
                  <div class="nic-role-desc">Ponechat na pokoji. Slouží pro NAT, internetový přístup a management hypervizoru.</div>
                </div>
                <div class="nic-role-item nic-active">
                  <div class="nic-role-top">
                    <span class="nic-badge success">NIC 2 (Ethernet 1)</span>
                    <span class="nic-tag active">INTERNÍ LAB SÍŤ</span>
                  </div>
                  <div class="nic-role-desc"><strong>ZDE NASTAVUJETE IP!</strong> Propojuje všechny vaše lokální VM (DC, FS, PC). Podsíť: <code>192.168.${workstationX}.0/24</code>.</div>
                </div>
                <div class="nic-role-item nic-class">
                  <div class="nic-role-top">
                    <span class="nic-badge info">NIC 3 (Ethernet 2)</span>
                    <span class="nic-tag">TŘÍDNÍ SÍŤ</span>
                  </div>
                  <div class="nic-role-desc">Propojení se všemi VM v učebně pro společné úlohy (ponechat dle pokynů lektora).</div>
                </div>
              </div>
              <div class="nic-alert-note">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>Před spuštěním ověřte příkazem <code>Get-NetAdapter</code> název NIC 2 adaptéru. V příkazu je použit obvyklý alias <code>Ethernet 1</code>. Pokud se u vás jmenuje např. <code>Ethernet 2</code> nebo <code>vEthernet</code>, upravte parametr <code>-InterfaceAlias</code>.</span>
              </div>
            </div>
          `;

          if (vm === "SRV1-DC") {
            return `
              ${nicBanner}
              <p>Pro pracoviště <strong>č. ${workstationX}</strong> nastavte na rozhraní <strong>NIC 2 (Ethernet 1)</strong> statickou IP adresu <strong>192.168.${workstationX}.10/24</strong>, výchozí bránu <strong>192.168.${workstationX}.1</strong> a preferovaný DNS server <strong>192.168.${workstationX}.10</strong> (sám na sebe pro budoucí roli doménového řadiče a DNS).</p>
            `;
          }
          if (vm === "SRV2-FS") {
            return `
              ${nicBanner}
              <p>Pro pracoviště <strong>č. ${workstationX}</strong> nastavte na rozhraní <strong>NIC 2 (Ethernet 1)</strong> statickou IP adresu <strong>192.168.${workstationX}.20/24</strong> (servery mají krok po 10), výchozí bránu <strong>192.168.${workstationX}.1</strong> a preferovaný DNS <strong>192.168.${workstationX}.10</strong> (směřující na SRV1-DC).</p>
            `;
          }
          return `
            ${nicBanner}
            <p>Pro klientskou stanici <strong>PC1-WIN</strong> ponechte síťové rozhraní NIC 2 ve výchozím nastavení <strong>DHCP</strong> (automatické přidělení adresy). Klient obdrží IP z dynamického rozsahu <strong>192.168.${workstationX}.100 – 192.168.${workstationX}.200</strong> v Modulu 2 po spuštění a autorizaci DHCP serveru na SRV1-DC.</p>
          `;
        },
        how: (vm) => {
          if (vm === "SRV1-DC") {
            return `# 1. Zkontrolujte adaptéry (hledáme NIC 2 pro interní propojení labu):\nGet-NetAdapter\n\n# 2. Nastavte statickou IP a bránu na NIC 2:\nNew-NetIPAddress -InterfaceAlias "Ethernet 1" -IPAddress "192.168.${workstationX}.10" -PrefixLength 24 -DefaultGateway "192.168.${workstationX}.1"\n\n# 3. Nastavte DNS na adresu budoucího řadiče (sám na sebe):\nSet-DnsClientServerAddress -InterfaceAlias "Ethernet 1" -ServerAddresses ("192.168.${workstationX}.10")`;
          }
          if (vm === "SRV2-FS") {
            return `# 1. Zkontrolujte adaptéry (hledáme NIC 2 pro interní propojení labu):\nGet-NetAdapter\n\n# 2. Nastavte statickou IP a bránu na NIC 2:\nNew-NetIPAddress -InterfaceAlias "Ethernet 1" -IPAddress "192.168.${workstationX}.20" -PrefixLength 24 -DefaultGateway "192.168.${workstationX}.1"\n\n# 3. Nastavte DNS směřující na SRV1-DC:\nSet-DnsClientServerAddress -InterfaceAlias "Ethernet 1" -ServerAddresses ("192.168.${workstationX}.10")`;
          }
          return `# Ověřte, že NIC 2 je nakonfigurován pro automatické DHCP:\nSet-NetIPInterface -InterfaceAlias "Ethernet 1" -Dhcp Enabled\nSet-DnsClientServerAddress -InterfaceAlias "Ethernet 1" -ResetServerAddresses`;
        },
        verify: (vm) => {
          if (vm === "PC1-WIN") {
            return `Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias "Ethernet 1" | Select-Object IPAddress, PrefixOrigin\nGet-NetIPInterface -InterfaceAlias "Ethernet 1" -AddressFamily IPv4 | Select-Object InterfaceAlias, Dhcp`;
          }
          return `Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias "Ethernet 1" | Select-Object IPAddress, PrefixLength, PrefixOrigin\nGet-NetIPConfiguration -InterfaceAlias "Ethernet 1" | Select-Object -ExpandProperty IPv4DefaultGateway\nGet-DnsClientServerAddress -InterfaceAlias "Ethernet 1" -AddressFamily IPv4 | Select-Object InterfaceAlias, ServerAddresses`;
        },
        expected: (vm) => {
          if (vm === "SRV1-DC") {
            return `IPAddress       : 192.168.${workstationX}.10\nPrefixLength    : 24\nPrefixOrigin    : Manual (statická adresa, nikoliv DHCP)\nNextHop (GW)    : 192.168.${workstationX}.1\nServerAddresses : {192.168.${workstationX}.10}`;
          }
          if (vm === "SRV2-FS") {
            return `IPAddress       : 192.168.${workstationX}.20\nPrefixLength    : 24\nPrefixOrigin    : Manual (statická adresa, nikoliv DHCP)\nNextHop (GW)    : 192.168.${workstationX}.1\nServerAddresses : {192.168.${workstationX}.10}`;
          }
          return `Dhcp         : Enabled\nPrefixOrigin : Dhcp (případně AutoConfiguration před spuštěním DHCP serveru v Modulu 2)\nU klientského PC nesmí být zadána ruční statická adresa (Manual).`;
        }
      },
      {
        id: "admin-account",
        title: "5. Účet administrátora a heslo",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => {
          if (vm === "PC1-WIN") return "U Windows 11 je vestavěný účet Administrator vypnutý. Povolte jej, nastavte standardizované heslo Pa55w.rd, přihlaste se pod ním a odstraňte dočasný instalační účet.";
          return "Zajistěte funkční vestavěný účet Administrator s heslem Pa55w.rd. Žádný jiný/personalizovaný administrátorský účet se nevytváří.";
        },
        how: (vm) => {
          if (vm === "PC1-WIN") return `Enable-LocalUser -Name "Administrator"\nSet-LocalUser -Name "Administrator" -Password ("Pa55w.rd" | ConvertTo-SecureString -AsPlainText -Force)\n# Odhlásit se, přihlásit pod Administrator a odstranit dočasný účet.`;
          return "Při instalaci nastavit heslo účtu Administrator na: Pa55w.rd";
        },
        verify: () => "Get-LocalUser | Select-Object Name, Enabled",
        expected: (vm) => {
          if (vm === "PC1-WIN") return "Name          Enabled\n----          -------\nAdministrator True\n(Dočasný instalační účet Setup/User byl odstraněn, přihlášení s heslem Pa55w.rd funguje lokálně)";
          return "Name          Enabled\n----          -------\nAdministrator True\n(Přihlášení s heslem Pa55w.rd funguje lokálně)";
        }
      },
      {
        id: "locale",
        title: "6. Jazyk, region a formáty (cs-CZ)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Nastavte regionální konvence a polohu na Česko (cs-CZ, GeoId 0x3d), přičemž jazyk rozhraní systému zůstane v angličtině (English US) kvůli odborné terminologii.",
        how: () => `Set-Culture cs-CZ\nSet-WinSystemLocale cs-CZ\nSet-WinHomeLocation -GeoId 0x3d`,
        verify: () => `Get-Culture | Select-Object Name, DisplayName\nGet-WinSystemLocale\nGet-WinHomeLocation\nGet-WinUILanguageOverride`,
        expected: () => "Name : cs-CZ, DisplayName : Czech (Czechia)\nGet-WinSystemLocale: cs-CZ\nHomeLocation: 61 / Czech Republic\nGet-WinUILanguageOverride: prázdné nebo en-US (UI rozhraní zůstává anglicky)"
      },
      {
        id: "datetime-format",
        title: "7. Formáty data, času a měny",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Ověřte a nastavte správné české formátování: datum d.M.yyyy, 24hodinový čas H:mm:ss a symbol měny Kč.",
        how: () => `Settings -> Time & language -> Language & region -> Regional format: Czech (Czechia)`,
        verify: () => `Get-Date -Format "d.M.yyyy H:mm:ss"\n(12345.67).ToString("C")`,
        expected: () => "Get-Date : vypíše datum a čas ve tvaru např. 20.9.2026 13:45:02\nToString : vypíše 12 345,67 Kč (s mezerou jako oddělovačem tisíců a symbolem Kč)"
      },
      {
        id: "timezone",
        title: "8. Časové pásmo (Praha)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Nastavte časové pásmo na Praha / Bratislava (Central Europe Standard Time, UTC+1). Synchronizace času je nezbytná pro autentizaci Kerberos v Active Directory.",
        how: () => `Set-TimeZone -Id "Central Europe Standard Time"`,
        verify: () => "Get-TimeZone",
        expected: () => "Id                         : Central Europe Standard Time\nDisplayName                : (UTC+01:00) Belgrade, Bratislava, Budapest, Ljubljana, Prague\nBaseUtcOffset              : 01:00:00\nSupportsDaylightSavingTime : True"
      },
      {
        id: "keyboards",
        title: "9. Klávesnice US a Czech (QWERTZ)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Nakonfigurujte dvě klávesnice: US jako primární/výchozí (snadné psaní příkazů v PowerShellu) a Czech QWERTZ jako sekundární s přepínáním přes Win + mezerník.",
        how: () => `$List = New-WinUserLanguageList "en-US"\n$List.Add("cs-CZ")\nSet-WinUserLanguageList $List -Force`,
        verify: () => "Get-WinUserLanguageList | Select-Object LanguageTag, InputMethodTips",
        expected: () => "LanguageTag InputMethodTips\n----------- ---------------\nen-US       {0409:00000409}\ncs-CZ       {0405:00000405}\n(Na hlavním panelu u hodin je dostupný přepínač ENG / CES)"
      },
      {
        id: "privacy",
        title: "10. Telemetrie a diagnostika na minimum",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Omezte síťový provoz na pozadí: nastavte telemetrii na minimální úroveň (Required data), vypněte lokalizační služby (Location) a zakažte reklamní ID.",
        how: () => `reg add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection" /v AllowTelemetry /t REG_DWORD /d 1 /f\nreg add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\LocationAndSensors" /v DisableLocation /t REG_DWORD /d 1 /f\nreg add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\AdvertisingInfo" /v DisabledByGroupPolicy /t REG_DWORD /d 1 /f`,
        verify: () => `Get-ItemProperty -Path "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection" -Name AllowTelemetry\nGet-ItemProperty -Path "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\LocationAndSensors" -Name DisableLocation\nGet-ItemProperty -Path "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\AdvertisingInfo" -Name DisabledByGroupPolicy`,
        expected: () => "AllowTelemetry         : 1 (Required diagnostic data)\nDisableLocation        : 1 (poloha vypnuta)\nDisabledByGroupPolicy  : 1 (reklamní ID vypnuto)"
      },
      {
        id: "activation",
        title: "11. Aktivace Windows (LAB KEY)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Aktivujte systém pomocí školního produktového klíče LAB KEY (placeholder XXXXX-XXXXX-XXXXX-XXXXX-XXXXX). Cílem je odstranit časové omezení zkušební verze a vodoznak.",
        how: () => `slmgr.vbs /ipk XXXXX-XXXXX-XXXXX-XXXXX-XXXXX\nslmgr.vbs /ato`,
        verify: () => "slmgr.vbs /xpr",
        expected: () => "Dialogové okno Windows Script Host oznámí:\n\"The machine is permanently activated\"\n(nebo datum příští kontroly licence u KMS multilicence).\nV Settings -> System -> Activation svítí \"Windows is activated\"."
      },
      {
        id: "local-user-only",
        title: "12. Pouze lokální účet (bez Microsoft Account)",
        forVMs: ["PC1-WIN"],
        what: () => "Zajistěte, že klientský počítač PC1-WIN nepoužívá cloudový Microsoft účet, ale je provozován výhradně pod lokálním účtem Administrator.",
        how: () => "V instalačním rozhraní OOBE nepoužívat Microsoft účet. Účet musí mít typ Local account.",
        verify: () => "Get-LocalUser | Select-Object Name, Enabled",
        expected: () => "Name          Enabled\n----          -------\nAdministrator True\n(V Settings -> Accounts -> Your info je uveden typ \"Local account\", nikoliv e-mailová adresa Microsoft účtu.)"
      }
    ];

    let currentVM = "SRV1-DC";
    let selectedTaskId = "vm-specs";
    let workstationX = parseInt(localStorage.getItem('lab_workstation_x') || '2', 10);
    if (isNaN(workstationX) || workstationX < 1 || workstationX > 254) {
      workstationX = 2;
    }

    function changeWorkstation(val) {
      let num = parseInt(val, 10);
      if (isNaN(num) || num < 1 || num > 254) {
        num = 2;
      }
      workstationX = num;
      localStorage.setItem('lab_workstation_x', workstationX.toString());
      updateWorkstationUI();
      render();
    }

    function updateWorkstationUI() {
      const inputEl = document.getElementById("workstation-input");
      if (inputEl && inputEl.value !== workstationX.toString()) {
        inputEl.value = workstationX;
      }
      const infoEl = document.getElementById("ws-info-text");
      if (infoEl) {
        infoEl.innerHTML = `
          <span>Podsíť: <strong>192.168.${workstationX}.0/24</strong></span>
          <span class="ws-sep">•</span>
          <span>GW: <strong>192.168.${workstationX}.1</strong></span>
          <span class="ws-sep">•</span>
          <span>DC: <strong>.10</strong> | FS: <strong>.20</strong></span>
        `;
      }
    }

    function getStorageKey(vm, taskId) {
      return `vm_task_${vm}_${taskId}`;
    }

    function switchVM(vm) {
      currentVM = vm;
      document.querySelectorAll('.vm-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${vm}`).classList.add('active');
      
      const relevant = taskDefinitions.filter(t => t.forVMs.includes(currentVM));
      if (!relevant.find(t => t.id === selectedTaskId)) {
        selectedTaskId = relevant[0].id;
      }
      render();
    }

    function toggleTask(taskId, checked, ev) {
      if (ev) ev.stopPropagation();
      localStorage.setItem(getStorageKey(currentVM, taskId), checked ? "1" : "0");
      render();
    }

    function selectTask(taskId) {
      selectedTaskId = taskId;
      render();
    }

    function resetCurrentVM() {
      if (confirm(`Resetovat záznamy pro ${currentVM}?`)) {
        taskDefinitions.forEach(t => localStorage.removeItem(getStorageKey(currentVM, t.id)));
        render();
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTerminalPowerShell(rawCode) {
      if (!rawCode) return "";
      const lines = rawCode.trim().split("\n");
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) {
          return '<div class="t-line empty">&nbsp;</div>';
        }
        if (trimmed.startsWith("#")) {
          return `<div class="t-line t-comment"><span class="t-prefix">#</span> <span class="t-comment-text">${escapeHtml(trimmed.substring(1).trim())}</span></div>`;
        }
        return `<div class="t-line"><span class="t-ps-prompt">PS C:\\&gt;</span> <span class="t-cmd-text">${escapeHtml(line)}</span></div>`;
      }).join("");
    }

    function copyTaskCode(taskId, type, btn) {
      const task = taskDefinitions.find(t => t.id === taskId);
      if (!task) return;
      let code = "";
      if (type === "how") {
        code = typeof task.how === "function" ? task.how(currentVM) : task.how;
      } else if (type === "verify") {
        code = typeof task.verify === "function" ? task.verify(currentVM) : task.verify;
      }
      navigator.clipboard.writeText(code).then(() => {
        const origHtml = btn.innerHTML;
        btn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>Zkopírováno</span>
        `;
        setTimeout(() => { btn.innerHTML = origHtml; }, 1400);
      });
    }

    function updateBadges() {
      ["SRV1-DC", "SRV2-FS", "PC1-WIN"].forEach(vm => {
        const tasks = taskDefinitions.filter(t => t.forVMs.includes(vm));
        const done = tasks.filter(t => localStorage.getItem(getStorageKey(vm, t.id)) === "1").length;
        document.getElementById(`badge-${vm}`).innerText = `${done}/${tasks.length}`;
      });
    }

    function render() {
      updateBadges();
      updateWorkstationUI();

      const relevantTasks = taskDefinitions.filter(t => t.forVMs.includes(currentVM));
      const listEl = document.getElementById("task-list");
      listEl.innerHTML = "";

      let doneCount = 0;

      relevantTasks.forEach(t => {
        const isDone = localStorage.getItem(getStorageKey(currentVM, t.id)) === "1";
        if (isDone) doneCount++;

        const li = document.createElement("li");
        li.className = `task-item ${t.id === selectedTaskId ? 'selected' : ''}`;
        li.onclick = () => selectTask(t.id);

        li.innerHTML = `
          <input type="checkbox" class="custom-checkbox" ${isDone ? "checked" : ""} onclick="toggleTask('${t.id}', this.checked, event)">
          <span class="task-label ${isDone ? 'done' : ''}">${t.title}</span>
        `;
        listEl.appendChild(li);
      });

      const pct = Math.round((doneCount / relevantTasks.length) * 100);
      document.getElementById("progress-bar").style.width = `${pct}%`;
      document.getElementById("progress-text").innerText = `${pct} %`;

      const currentTask = relevantTasks.find(t => t.id === selectedTaskId) || relevantTasks[0];
      const isDone = localStorage.getItem(getStorageKey(currentVM, currentTask.id)) === "1";
      const whatText = typeof currentTask.what === "function" ? currentTask.what(currentVM) : (currentTask.what || currentTask.why);
      const howText = typeof currentTask.how === "function" ? currentTask.how(currentVM) : currentTask.how;
      const verifyText = typeof currentTask.verify === "function" ? currentTask.verify(currentVM) : currentTask.verify;
      const expectedText = typeof currentTask.expected === "function" ? currentTask.expected(currentVM) : currentTask.expected;

      const currentIndex = relevantTasks.findIndex(t => t.id === currentTask.id);
      const prevTask = currentIndex > 0 ? relevantTasks[currentIndex - 1] : null;
      const nextTask = currentIndex < relevantTasks.length - 1 ? relevantTasks[currentIndex + 1] : null;

      const detailEl = document.getElementById("detail-pane");
      detailEl.innerHTML = `
        <div class="detail-title">
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="vm-tag">${currentVM}</span>
            <span>${currentTask.title}</span>
          </div>
          <label class="status-toggle ${isDone ? 'is-done' : ''}">
            <input type="checkbox" class="custom-checkbox" ${isDone ? "checked" : ""} onchange="toggleTask('${currentTask.id}', this.checked)">
            <span>${isDone ? 'Hotovo' : 'Označit jako hotové'}</span>
          </label>
        </div>

        <!-- 1. CÍL ÚKOLU -->
        <div class="step-card step-goal">
          <div class="step-card-header">
            <div class="step-header-left">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
              <span>Cíl úkolu</span>
            </div>
          </div>
          <div class="step-card-body">${whatText}</div>
        </div>

        <!-- 2. PŘÍKAZ K PROVEDENÍ (TERMINÁL) -->
        <div class="step-card step-action">
          <div class="step-card-header">
            <div class="step-header-left">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
              <span>1. Příkaz k provedení</span>
            </div>
          </div>
          <div class="step-card-body">
            <div class="terminal-box">
              <div class="terminal-header">
                <div class="terminal-controls">
                  <span class="t-dot red"></span>
                  <span class="t-dot yellow"></span>
                  <span class="t-dot green"></span>
                </div>
                <div class="terminal-title-text">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                  <span>Administrator: Windows PowerShell</span>
                </div>
                <button class="terminal-copy-btn" onclick="copyTaskCode('${currentTask.id}', 'how', this)">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  <span>Kopírovat příkaz</span>
                </button>
              </div>
              <div class="terminal-body">
                ${formatTerminalPowerShell(howText)}
              </div>
            </div>
          </div>
        </div>

        <!-- 3. KONTROLA VÝSLEDKU (TERMINÁL + OČEKÁVANÝ VÝSTUP) -->
        <div class="step-card step-verify">
          <div class="step-card-header">
            <div class="step-header-left">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <span>2. Kontrola výsledku</span>
            </div>
          </div>
          <div class="step-card-body">
            <div class="terminal-box">
              <div class="terminal-header">
                <div class="terminal-controls">
                  <span class="t-dot red"></span>
                  <span class="t-dot yellow"></span>
                  <span class="t-dot green"></span>
                </div>
                <div class="terminal-title-text">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                  <span>Administrator: Windows PowerShell (Test)</span>
                </div>
                <button class="terminal-copy-btn" onclick="copyTaskCode('${currentTask.id}', 'verify', this)">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  <span>Kopírovat test</span>
                </button>
              </div>
              <div class="terminal-body">
                ${formatTerminalPowerShell(verifyText)}
              </div>
            </div>

            <div class="expected-output-box">
              <div class="expected-output-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <span>Správný výstup konzole (musí odpovídat):</span>
              </div>
              <div class="expected-output-content">${escapeHtml(expectedText)}</div>
            </div>
          </div>
        </div>

        <div class="detail-nav-footer">
          <button class="nav-step-btn" ${prevTask ? `onclick="selectTask('${prevTask.id}')"` : "disabled"}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Předchozí úkol
          </button>
          <button class="nav-step-btn" ${nextTask ? `onclick="selectTask('${nextTask.id}')"` : "disabled"}>
            Další úkol
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
