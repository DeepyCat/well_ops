<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrolní seznam přípravy VM - Modul 0</title>
  <style>
    :root {
      --bg-main: #1a1a1a;
      --bg-sidebar: #222;
      --bg-box: #242424;
      --border-color: #333;
      --text-main: #e0e0e0;
      --text-muted: #888;
      --accent: #ff5555;
      --accent-hover: #ff7777;
      --code-bg: #151515;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    header {
      width: 100%;
      background-color: var(--bg-sidebar);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      z-index: 10;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
    }

    .back-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    .reset-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 25px;
      overflow: hidden;
      min-height: 0;
      box-sizing: border-box;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .vm-tabs {
      display: flex;
      gap: 8px;
    }

    .vm-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .vm-btn:hover {
      background-color: #2a2a2a;
      border-color: #444;
      color: #fff;
    }

    .vm-btn.active {
      background-color: #332222;
      color: var(--accent-hover);
      border-color: var(--accent);
      font-weight: bold;
    }

    .vm-badge {
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .vm-btn.active .vm-badge {
      background: rgba(255, 85, 85, 0.25);
      color: var(--accent-hover);
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
    }

    .progress-bar-bg {
      background: var(--code-bg);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }

    .task-items {
      overflow-y: auto;
      list-style: none;
      flex: 1;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      gap: 10px;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .task-item:hover {
      background-color: #2a2a2a;
      color: #fff;
    }

    .task-item.selected {
      background-color: #332222;
      border-left: 3px solid var(--accent);
      color: var(--accent-hover);
      font-weight: 600;
    }

    /* Vlastní stylování checkboxů */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #555;
      border-radius: 4px;
      background-color: #181818;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .custom-checkbox:hover {
      border-color: var(--accent);
      background-color: #222;
      box-shadow: 0 0 6px rgba(255, 85, 85, 0.3);
    }

    .custom-checkbox:checked {
      background-color: var(--accent);
      border-color: var(--accent);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2.5-2.5a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3E%3C/svg%3E");
      background-size: 13px 13px;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 0 8px rgba(255, 85, 85, 0.45);
    }

    .custom-checkbox:active {
      transform: scale(0.9);
    }

    /* Moderní přepínač stavu v detailu úkolu */
    .status-toggle {
      font-size: 0.82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      user-select: none;
      color: var(--text-muted);
    }

    .status-toggle:hover {
      background: #252525;
      border-color: #555;
      color: var(--text-main);
    }

    .status-toggle.is-done {
      background: rgba(255, 85, 85, 0.12);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    /* Navigace mezi úkoly v patce detailu */
    .detail-nav-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .nav-step-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-step-btn:hover:not(:disabled) {
      background-color: #2a2a2a;
      border-color: var(--accent);
      color: #fff;
    }

    .nav-step-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--border-color);
    }

    .task-label {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-label.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .detail-pane {
      background: var(--bg-box);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .detail-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .box {
      background: #1e1e1e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .box-header {
      padding: 8px 14px;
      background: #262626;
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .box-content {
      padding: 14px;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    pre {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #e6edf3;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--code-bg);
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .copy-btn {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-main);
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background-color: #333;
      color: #fff;
      border-color: var(--accent);
    }

    /* Očekávaný výstup ověření */
    .expected-output-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: #141414;
      border: 1px solid var(--border-color);
      border-left: 3px solid #22c55e;
      border-radius: 4px;
    }

    .expected-output-header {
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.8px;
      color: #4ade80;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .expected-output-content {
      font-size: 0.84rem;
      color: #d1d5db;
      line-height: 1.55;
      white-space: pre-line;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      background: #0d0d0d;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #262626;
      overflow-x: auto;
    }

    @media screen and (max-width: 768px) {
      body {
        height: auto;
        overflow-y: auto;
      }
      .main-content {
        padding: 15px;
        overflow: visible;
      }
      .workspace {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .sidebar {
        max-height: 280px;
      }
      .header-actions {
        flex-direction: row;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Konfigurace zkurvených VM</h1>
    <div class="header-actions">
      <button class="reset-btn" onclick="resetCurrentVM()">Resetovat stav VM</button>
      <a href="index.html" class="back-btn">Chcu zpět</a>
    </div>
  </header>

  <div class="main-content">
    <div class="top-controls">
      <div class="vm-tabs">
        <button class="vm-btn active" id="btn-SRV1-DC" onclick="switchVM('SRV1-DC')">
          SRV1-DC <span class="vm-badge" id="badge-SRV1-DC">0/11</span>
        </button>
        <button class="vm-btn" id="btn-SRV2-FS" onclick="switchVM('SRV2-FS')">
          SRV2-FS <span class="vm-badge" id="badge-SRV2-FS">0/11</span>
        </button>
        <button class="vm-btn" id="btn-PC1-WIN" onclick="switchVM('PC1-WIN')">
          PC1-WIN <span class="vm-badge" id="badge-PC1-WIN">0/12</span>
        </button>
      </div>
    </div>

    <div class="workspace">
      <div class="sidebar">
        <div class="sidebar-header">
          <div style="display:flex; justify-content:space-between; font-size: 0.8rem; color: var(--text-muted);">
            <span>Dokončeno</span>
            <span id="progress-text">0 %</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
        </div>
        <ul class="task-items" id="task-list"></ul>
      </div>

      <div class="detail-pane" id="detail-pane"></div>
    </div>
  </div>

  <script>
    const taskDefinitions = [
      {
        id: "vm-specs",
        title: "1. Parametry virtuálního stroje",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => {
          if (vm === "PC1-WIN") return "Vytvořte virtuální stroj se 2 vCPU, 8 GB RAM a 60 GB systémovým diskem. Slouží jako klientská stanice pro ověřování doménových a síťových služeb.";
          if (vm === "SRV2-FS") return "Vytvořte virtuální stroj se 2 vCPU, 8 GB RAM, 100 GB systémovým diskem a přidejte 5× virtuální disk o velikosti 10 GB. Těchto 5 disků bude v Modulu 6 sloužit pro Storage Pool a simulaci výpadku disku.";
          return "Vytvořte virtuální stroj se 2 vCPU, 8 GB RAM a 100 GB systémovým diskem. Připravuje se čistý základ pro primární doménový řadič.";
        },
        how: (vm) => {
          if (vm === "PC1-WIN") return "V hypervizoru: 2 vCPU, 8 GB RAM, 60 GB systémový disk.";
          if (vm === "SRV2-FS") return "V hypervizoru: 2 vCPU, 8 GB RAM, 100 GB systémový disk + 5x virtuální disk o velikosti 10 GB.";
          return "V hypervizoru: 2 vCPU, 8 GB RAM, 100 GB systémový disk.";
        },
        verify: (vm) => {
          if (vm === "SRV2-FS") return "Get-Disk | Select-Object Number, FriendlyName, Size, PartitionStyle\n# Ověřte systémový disk (~100 GB) a 5x RAW disků (~10 GB)";
          return "Get-Disk | Select-Object Number, FriendlyName, Size";
        },
        expected: (vm) => {
          if (vm === "SRV2-FS") return "Výpis obsahuje systémový disk (~100 GB) a 5x neinicializovaných disků (~10 GB) ve stavu RAW:\nNumber  FriendlyName            Size  PartitionStyle\n------  ------------            ----  --------------\n0       ... (Systémový disk)  ~100 GB  GPT/MBR\n1-5     ... (5x datový disk)   ~10 GB  RAW";
          if (vm === "PC1-WIN") return "Výpis obsahuje systémový disk o velikosti přibližně 60 GB:\nNumber  FriendlyName  Size\n0       ...          ~60 GB";
          return "Výpis obsahuje systémový disk o velikosti přibližně 100 GB:\nNumber  FriendlyName  Size\n0       ...          ~100 GB";
        }
      },
      {
        id: "os-edition",
        title: "2. Edice a instalace Windows",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => {
          if (vm === "PC1-WIN") return "Nainstalujte Windows 11 Education N v jazyce English (United States). Edice N neobsahuje multimediální aplikace a podporuje doménový join i centrální správu přes GPO.";
          return "Nainstalujte Windows Server 2025 Datacenter s grafickým rozhraním (Desktop Experience) v jazyce English (United States). Zásadně neinstalovat Server Core.";
        },
        how: (vm) => {
          if (vm === "PC1-WIN") return "Instalace Windows 11 Education N (jazyk: English - United States).";
          return "Instalace Windows Server 2025 Datacenter (Desktop Experience). Neinstalovat Server Core.";
        },
        verify: (vm) => {
          if (vm === "PC1-WIN") return "Get-ComputerInfo | Select-Object WindowsProductName";
          return "Get-ComputerInfo | Select-Object WindowsProductName, OsServerLevel";
        },
        expected: (vm) => {
          if (vm === "PC1-WIN") return "WindowsProductName : Windows 11 Education N (případně Windows 11 Education)";
          return "WindowsProductName : Windows Server 2025 Datacenter\nOsServerLevel      : FullServer (potvrzuje Desktop Experience, nikoliv ServerCore)";
        }
      },
      {
        id: "hostname",
        title: "3. Jméno počítače (Hostname)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => `Přejmenujte stroj na přesný název "${vm}" a restartujte jej. Jednoznačné jméno je klíčové pro komunikaci v síti a budoucí řadič domény.`,
        how: (vm) => `Rename-Computer -NewName "${vm}" -Restart`,
        verify: () => "hostname",
        expected: (vm) => `Vrátí přesný název stroje:\n${vm}`
      },
      {
        id: "networking",
        title: "4. Nastavení TCP/IPv4",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => {
          if (vm === "SRV1-DC") return "Nastavte statickou IP adresu 192.168.200.10/24, výchozí bránu 192.168.200.1 a preferovaný DNS 192.168.200.10 (sám na sebe).";
          if (vm === "SRV2-FS") return "Nastavte statickou IP adresu 192.168.200.20/24, výchozí bránu 192.168.200.1 a preferovaný DNS 192.168.200.10 (směřující na SRV1-DC).";
          return "Ponechte síťové rozhraní ve výchozím stavu na DHCP (automatické přidělení adresy). Klient dostane IP v Modulu 2 po spuštění DHCP serveru.";
        },
        how: (vm) => {
          if (vm === "SRV1-DC") return `New-NetIPAddress -InterfaceAlias "Ethernet" -IPAddress "192.168.200.10" -PrefixLength 24 -DefaultGateway "192.168.200.1"\nSet-DnsClientServerAddress -InterfaceAlias "Ethernet" -ServerAddresses ("192.168.200.10")`;
          if (vm === "SRV2-FS") return `New-NetIPAddress -InterfaceAlias "Ethernet" -IPAddress "192.168.200.20" -PrefixLength 24 -DefaultGateway "192.168.200.1"\nSet-DnsClientServerAddress -InterfaceAlias "Ethernet" -ServerAddresses ("192.168.200.10")`;
          return "Ponechte výchozí stav: Obtain an IP address automatically (DHCP).";
        },
        verify: (vm) => {
          if (vm === "PC1-WIN") return "Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias Ethernet* | Select-Object IPAddress, PrefixOrigin";
          return `Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias Ethernet* | Select-Object IPAddress, PrefixLength, PrefixOrigin\nGet-NetIPConfiguration | Select-Object -ExpandProperty IPv4DefaultGateway\nGet-DnsClientServerAddress -AddressFamily IPv4`;
        },
        expected: (vm) => {
          if (vm === "SRV1-DC") return "IPAddress     : 192.168.200.10\nPrefixLength  : 24\nPrefixOrigin  : Manual (statická adresa, nikoliv DHCP)\nNextHop (GW)  : 192.168.200.1\nServerAddresses : {192.168.200.10}";
          if (vm === "SRV2-FS") return "IPAddress     : 192.168.200.20\nPrefixLength  : 24\nPrefixOrigin  : Manual (statická adresa, nikoliv DHCP)\nNextHop (GW)  : 192.168.200.1\nServerAddresses : {192.168.200.10}";
          return "PrefixOrigin : Dhcp (případně AutoConfiguration, pokud DHCP server v síti ještě neběží). Adresa nesmí být statická (Manual).";
        }
      },
      {
        id: "admin-account",
        title: "5. Účet administrátora a heslo",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: (vm) => {
          if (vm === "PC1-WIN") return "U Windows 11 je vestavěný účet Administrator vypnutý. Povolte jej, nastavte standardizované heslo Pa55w.rd, přihlaste se pod ním a odstraňte dočasný instalační účet.";
          return "Zajistěte funkční vestavěný účet Administrator s heslem Pa55w.rd. Žádný jiný/personalizovaný administrátorský účet se nevytváří.";
        },
        how: (vm) => {
          if (vm === "PC1-WIN") return `Enable-LocalUser -Name "Administrator"\nSet-LocalUser -Name "Administrator" -Password ("Pa55w.rd" | ConvertTo-SecureString -AsPlainText -Force)\n# Odhlásit se, přihlásit pod Administrator a odstranit dočasný účet.`;
          return "Při instalaci nastavit heslo účtu Administrator na: Pa55w.rd";
        },
        verify: () => "Get-LocalUser | Select-Object Name, Enabled",
        expected: (vm) => {
          if (vm === "PC1-WIN") return "Name          Enabled\n----          -------\nAdministrator True\n(Dočasný instalační účet Setup/User byl odstraněn, přihlášení s heslem Pa55w.rd funguje lokálně)";
          return "Name          Enabled\n----          -------\nAdministrator True\n(Přihlášení s heslem Pa55w.rd funguje lokálně)";
        }
      },
      {
        id: "locale",
        title: "6. Jazyk, region a formáty (cs-CZ)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Nastavte regionální konvence a polohu na Česko (cs-CZ, GeoId 0x3d), přičemž jazyk rozhraní systému zůstane v angličtině (English US) kvůli odborné terminologii.",
        how: () => `Set-Culture cs-CZ\nSet-WinSystemLocale cs-CZ\nSet-WinHomeLocation -GeoId 0x3d`,
        verify: () => `Get-Culture | Select-Object Name, DisplayName\nGet-WinSystemLocale\nGet-WinHomeLocation\nGet-WinUILanguageOverride`,
        expected: () => "Name : cs-CZ, DisplayName : Czech (Czechia)\nGet-WinSystemLocale: cs-CZ\nHomeLocation: 61 / Czech Republic\nGet-WinUILanguageOverride: prázdné nebo en-US (UI rozhraní zůstává anglicky)"
      },
      {
        id: "datetime-format",
        title: "7. Formáty data, času a měny",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Ověřte a nastavte správné české formátování: datum d.M.yyyy, 24hodinový čas H:mm:ss a symbol měny Kč.",
        how: () => `Settings -> Time & language -> Language & region -> Regional format: Czech (Czechia)`,
        verify: () => `Get-Date -Format "d.M.yyyy H:mm:ss"\n(12345.67).ToString("C")`,
        expected: () => "Get-Date : vypíše datum a čas ve tvaru např. 20.9.2026 13:45:02\nToString : vypíše 12 345,67 Kč (s mezerou jako oddělovačem tisíců a symbolem Kč)"
      },
      {
        id: "timezone",
        title: "8. Časové pásmo (Praha)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Nastavte časové pásmo na Praha / Bratislava (Central Europe Standard Time, UTC+1). Synchronizace času je nezbytná pro autentizaci Kerberos v Active Directory.",
        how: () => `Set-TimeZone -Id "Central Europe Standard Time"`,
        verify: () => "Get-TimeZone",
        expected: () => "Id                         : Central Europe Standard Time\nDisplayName                : (UTC+01:00) Belgrade, Bratislava, Budapest, Ljubljana, Prague\nBaseUtcOffset              : 01:00:00\nSupportsDaylightSavingTime : True"
      },
      {
        id: "keyboards",
        title: "9. Klávesnice US a Czech (QWERTZ)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Nakonfigurujte dvě klávesnice: US jako primární/výchozí (snadné psaní příkazů v PowerShellu) a Czech QWERTZ jako sekundární s přepínáním přes Win + mezerník.",
        how: () => `$List = New-WinUserLanguageList "en-US"\n$List.Add("cs-CZ")\nSet-WinUserLanguageList $List -Force`,
        verify: () => "Get-WinUserLanguageList | Select-Object LanguageTag, InputMethodTips",
        expected: () => "LanguageTag InputMethodTips\n----------- ---------------\nen-US       {0409:00000409}\ncs-CZ       {0405:00000405}\n(Na hlavním panelu u hodin je dostupný přepínač ENG / CES)"
      },
      {
        id: "privacy",
        title: "10. Telemetrie a diagnostika na minimum",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Omezte síťový provoz na pozadí: nastavte telemetrii na minimální úroveň (Required data), vypněte lokalizační služby (Location) a zakažte reklamní ID.",
        how: () => `reg add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection" /v AllowTelemetry /t REG_DWORD /d 1 /f\nreg add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\LocationAndSensors" /v DisableLocation /t REG_DWORD /d 1 /f\nreg add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\AdvertisingInfo" /v DisabledByGroupPolicy /t REG_DWORD /d 1 /f`,
        verify: () => `Get-ItemProperty -Path "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection" -Name AllowTelemetry\nGet-ItemProperty -Path "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\LocationAndSensors" -Name DisableLocation\nGet-ItemProperty -Path "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\AdvertisingInfo" -Name DisabledByGroupPolicy`,
        expected: () => "AllowTelemetry         : 1 (Required diagnostic data)\nDisableLocation        : 1 (poloha vypnuta)\nDisabledByGroupPolicy  : 1 (reklamní ID vypnuto)"
      },
      {
        id: "activation",
        title: "11. Aktivace Windows (LAB KEY)",
        forVMs: ["SRV1-DC", "SRV2-FS", "PC1-WIN"],
        what: () => "Aktivujte systém pomocí školního produktového klíče LAB KEY (placeholder XXXXX-XXXXX-XXXXX-XXXXX-XXXXX). Cílem je odstranit časové omezení zkušební verze a vodoznak.",
        how: () => `slmgr.vbs /ipk XXXXX-XXXXX-XXXXX-XXXXX-XXXXX\nslmgr.vbs /ato`,
        verify: () => "slmgr.vbs /xpr",
        expected: () => "Dialogové okno Windows Script Host oznámí:\n\"The machine is permanently activated\"\n(nebo datum příští kontroly licence u KMS multilicence).\nV Settings -> System -> Activation svítí \"Windows is activated\"."
      },
      {
        id: "local-user-only",
        title: "12. Pouze lokální účet (bez Microsoft Account)",
        forVMs: ["PC1-WIN"],
        what: () => "Zajistěte, že klientský počítač PC1-WIN nepoužívá cloudový Microsoft účet, ale je provozován výhradně pod lokálním účtem Administrator.",
        how: () => "V instalačním rozhraní OOBE nepoužívat Microsoft účet. Účet musí mít typ Local account.",
        verify: () => "Get-LocalUser | Select-Object Name, Enabled",
        expected: () => "Name          Enabled\n----          -------\nAdministrator True\n(V Settings -> Accounts -> Your info je uveden typ \"Local account\", nikoliv e-mailová adresa Microsoft účtu.)"
      }
    ];

    let currentVM = "SRV1-DC";
    let selectedTaskId = "vm-specs";

    function getStorageKey(vm, taskId) {
      return `vm_task_${vm}_${taskId}`;
    }

    function switchVM(vm) {
      currentVM = vm;
      document.querySelectorAll('.vm-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${vm}`).classList.add('active');
      
      const relevant = taskDefinitions.filter(t => t.forVMs.includes(currentVM));
      if (!relevant.find(t => t.id === selectedTaskId)) {
        selectedTaskId = relevant[0].id;
      }
      render();
    }

    function toggleTask(taskId, checked, ev) {
      if (ev) ev.stopPropagation();
      localStorage.setItem(getStorageKey(currentVM, taskId), checked ? "1" : "0");
      render();
    }

    function selectTask(taskId) {
      selectedTaskId = taskId;
      render();
    }

    function resetCurrentVM() {
      if (confirm(`Resetovat záznamy pro ${currentVM}?`)) {
        taskDefinitions.forEach(t => localStorage.removeItem(getStorageKey(currentVM, t.id)));
        render();
      }
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.innerText;
        btn.innerText = "Zkopírováno";
        setTimeout(() => btn.innerText = orig, 1200);
      });
    }

    function updateBadges() {
      ["SRV1-DC", "SRV2-FS", "PC1-WIN"].forEach(vm => {
        const tasks = taskDefinitions.filter(t => t.forVMs.includes(vm));
        const done = tasks.filter(t => localStorage.getItem(getStorageKey(vm, t.id)) === "1").length;
        document.getElementById(`badge-${vm}`).innerText = `${done}/${tasks.length}`;
      });
    }

    function render() {
      updateBadges();

      const relevantTasks = taskDefinitions.filter(t => t.forVMs.includes(currentVM));
      const listEl = document.getElementById("task-list");
      listEl.innerHTML = "";

      let doneCount = 0;

      relevantTasks.forEach(t => {
        const isDone = localStorage.getItem(getStorageKey(currentVM, t.id)) === "1";
        if (isDone) doneCount++;

        const li = document.createElement("li");
        li.className = `task-item ${t.id === selectedTaskId ? 'selected' : ''}`;
        li.onclick = () => selectTask(t.id);

        li.innerHTML = `
          <input type="checkbox" class="custom-checkbox" ${isDone ? "checked" : ""} onclick="toggleTask('${t.id}', this.checked, event)">
          <span class="task-label ${isDone ? 'done' : ''}">${t.title}</span>
        `;
        listEl.appendChild(li);
      });

      const pct = Math.round((doneCount / relevantTasks.length) * 100);
      document.getElementById("progress-bar").style.width = `${pct}%`;
      document.getElementById("progress-text").innerText = `${pct} %`;

      const currentTask = relevantTasks.find(t => t.id === selectedTaskId) || relevantTasks[0];
      const isDone = localStorage.getItem(getStorageKey(currentVM, currentTask.id)) === "1";
      const whatText = typeof currentTask.what === "function" ? currentTask.what(currentVM) : (currentTask.what || currentTask.why);
      const howText = typeof currentTask.how === "function" ? currentTask.how(currentVM) : currentTask.how;
      const verifyText = typeof currentTask.verify === "function" ? currentTask.verify(currentVM) : currentTask.verify;
      const expectedText = typeof currentTask.expected === "function" ? currentTask.expected(currentVM) : currentTask.expected;

      const currentIndex = relevantTasks.findIndex(t => t.id === currentTask.id);
      const prevTask = currentIndex > 0 ? relevantTasks[currentIndex - 1] : null;
      const nextTask = currentIndex < relevantTasks.length - 1 ? relevantTasks[currentIndex + 1] : null;

      const detailEl = document.getElementById("detail-pane");
      detailEl.innerHTML = `
        <div class="detail-title">
          <span>${currentTask.title}</span>
          <label class="status-toggle ${isDone ? 'is-done' : ''}">
            <input type="checkbox" class="custom-checkbox" ${isDone ? "checked" : ""} onchange="toggleTask('${currentTask.id}', this.checked)">
            <span>${isDone ? 'Hotovo ✓' : 'Označit jako hotové'}</span>
          </label>
        </div>

        <div class="box">
          <div class="box-header">Kontext (Co se má udělat)</div>
          <div class="box-content">${whatText}</div>
        </div>

        <div class="box">
          <div class="box-header">
            <span>Konfigurace</span>
            <button class="copy-btn" onclick="copyToClipboard(\`${howText.replace(/`/g, '\\`')}\`, this)">Kopírovat</button>
          </div>
          <div class="box-content"><pre>${howText}</pre></div>
        </div>

        <div class="box">
          <div class="box-header">
            <span>Ověření (PowerShell)</span>
            <button class="copy-btn" onclick="copyToClipboard(\`${verifyText.replace(/`/g, '\\`')}\`, this)">Kopírovat</button>
          </div>
          <div class="box-content">
            <pre>${verifyText}</pre>
            <div class="expected-output-box">
              <div class="expected-output-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Co by to mělo vyplivnout (očekávaný výsledek):
              </div>
              <div class="expected-output-content">${expectedText}</div>
            </div>
          </div>
        </div>

        <div class="detail-nav-footer">
          <button class="nav-step-btn" ${prevTask ? `onclick="selectTask('${prevTask.id}')"` : "disabled"}>
            ← Předchozí úkol
          </button>
          <button class="nav-step-btn" ${nextTask ? `onclick="selectTask('${nextTask.id}')"` : "disabled"}>
            Další úkol →
          </button>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
