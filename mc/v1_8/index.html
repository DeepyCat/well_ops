<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Play minecraft 1.8 in your browser" />
		<meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.8, 1.8.8" />
		<title>EaglercraftX 1.8</title>
		<meta property="og:locale" content="en-US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="EaglercraftX 1.8" />
		<meta property="og:description" content="Play minecraft 1.8 in your browser" />
		<meta property="og:image" content="favicon.png" />
		<link type="image/png" rel="shortcut icon" href="favicon.png" />
		<script type="text/javascript" src="../../js/ops-stats.js"></script>
		<script type="text/javascript" src="classes.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", async () => {
				if(document.location.href.startsWith("file:")) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {
					
					// %%%%%%%%% launch options %%%%%%%%%%%%
					var currentUser = (window.OPS_STATS && window.OPS_STATS.getUsername()) || "";
					var safeUser = (window.OPS_STATS && window.OPS_STATS.getSafeUsername(currentUser)) || "Player";
					var targetDB = "worlds_1_8_" + safeUser;
					
					const relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epk",
						localesURI: "lang/",
						worldsDB: targetDB,
						servers: [
                            { serverName: "Asspixel", serverAddress: "wss://web.asspixel.net/CAP/", hideAddress: false },
                            { serverName: "to request a server to add, email me", serverAddress: "vape.master.69@hotmail.com", hideAddress: false }
						],
						relays: [
                            { addr: "wss://eaglerrelay.glitch.me", comment: "Hellscaped LAN relay", primary: relayId == 0 }
						]
					};
					
					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
					
					var q = window.location.search;
					if(typeof q === "string" && q.startsWith("?")) {
						q = new URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}
					
					if (window.OPS_STATS) {
						try {
							await window.OPS_STATS.prepareMinecraftStorage(targetDB, currentUser);
						} catch (e) {
							console.warn("[OPS Minecraft 1.8] Příprava úložiště selhala:", e);
						}
					}
					
					main();
					
					if (window.OPS_STATS) {
						window.OPS_STATS.recordSession('mc');
						setInterval(function() {
							window.OPS_STATS.recordPlayTime('mc', 10);
						}, 10000);
						
						setInterval(function() {
							window.OPS_STATS.backupMinecraft(currentUser, "auto");
						}, 60000);
						
						window.addEventListener("beforeunload", function() {
							window.OPS_STATS.backupMinecraft(currentUser, "auto");
						});
						
						document.addEventListener("visibilitychange", function() {
							if (document.hidden) {
								window.OPS_STATS.backupMinecraft(currentUser, "auto");
							}
						});
					}
				}
			});
		</script>
		<style>
			.ops-nav-overlay {
				position: fixed;
				top: 12px;
				left: 12px;
				z-index: 999999;
				display: flex;
				gap: 10px;
				align-items: center;
				font-family: 'Segoe UI', Consolas, sans-serif;
			}
			.ops-nav-btn {
				text-decoration: none;
				background: rgba(15, 17, 23, 0.85);
				border: 1px solid #22c55e;
				color: #22c55e;
				padding: 7px 14px;
				border-radius: 6px;
				font-size: 13px;
				font-weight: 700;
				backdrop-filter: blur(6px);
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
				transition: all 0.2s ease;
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}
			.ops-nav-btn:hover {
				background: rgba(34, 197, 94, 0.25);
				color: #fff;
				border-color: #4ade80;
				box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
				transform: translateY(-1px);
			}
			.ops-version-btn {
				text-decoration: none;
				background: rgba(15, 17, 23, 0.85);
				border: 1px solid rgba(255, 255, 255, 0.25);
				color: #e5e7eb;
				padding: 7px 12px;
				border-radius: 6px;
				font-size: 12px;
				font-weight: 600;
				backdrop-filter: blur(6px);
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
				transition: all 0.2s ease;
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}
			.ops-version-btn:hover {
				background: rgba(255, 255, 255, 0.15);
				border-color: #fff;
				color: #fff;
				transform: translateY(-1px);
			}
			.ops-backup-btn {
				background: rgba(15, 23, 42, 0.88);
				border: 1px solid #38bdf8;
				color: #38bdf8;
				padding: 7px 13px;
				border-radius: 6px;
				font-size: 12px;
				font-weight: 700;
				backdrop-filter: blur(6px);
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
				cursor: pointer;
				transition: all 0.2s ease;
				display: inline-flex;
				align-items: center;
				font-family: inherit;
			}
			.ops-backup-btn:hover {
				background: rgba(56, 189, 248, 0.2);
				color: #fff;
				border-color: #7dd3fc;
				box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
				transform: translateY(-1px);
			}
		</style>
	</head>
	<body style="margin:0px;width:100vw;height:100vh;overflow:hidden;" id="game_frame">
		<div class="ops-nav-overlay">
			<a href="../../index.html" class="ops-nav-btn">
				<span>&larr;</span> Zpět na OPS Portál
			</a>
			<a href="../index.html" class="ops-version-btn" title="Přepnout na nejnovější verzi 1.12.2">
				Verze: 1.8.8 &bull; Přepnout na nejnovější 1.12.2
			</a>
			<button type="button" class="ops-backup-btn" id="opsMcBackupBtn" onclick="if(window.OPS_STATS)window.OPS_STATS.openMinecraftBackupModal();">
				[Záloha světů]
			</button>
		</div>
	</body>
</html>
