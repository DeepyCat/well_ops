<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="Minecraft 1.12.2 v prohlížeči | OPS Portál" />
		<meta name="keywords" content="eaglercraft, minecraft, 1.12, 1.12.2, ops" />
		<title>Minecraft 1.12.2 (Eaglercraft) | OPS</title>
		<link type="image/png" rel="shortcut icon" href="favicon.png" />
		<style>
			.ops-nav-overlay {
				position: fixed;
				top: 12px;
				left: 12px;
				z-index: 999999;
				display: flex;
				gap: 10px;
				align-items: center;
				font-family: 'Segoe UI', Consolas, sans-serif;
			}
			.ops-nav-btn {
				text-decoration: none;
				background: rgba(15, 17, 23, 0.85);
				border: 1px solid #22c55e;
				color: #22c55e;
				padding: 7px 14px;
				border-radius: 6px;
				font-size: 13px;
				font-weight: 700;
				backdrop-filter: blur(6px);
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
				transition: all 0.2s ease;
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}
			.ops-nav-btn:hover {
				background: rgba(34, 197, 94, 0.25);
				color: #fff;
				border-color: #4ade80;
				box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
				transform: translateY(-1px);
			}
			.ops-version-btn {
				text-decoration: none;
				background: rgba(15, 17, 23, 0.85);
				border: 1px solid rgba(255, 255, 255, 0.25);
				color: #e5e7eb;
				padding: 7px 12px;
				border-radius: 6px;
				font-size: 12px;
				font-weight: 600;
				backdrop-filter: blur(6px);
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
				transition: all 0.2s ease;
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}
			.ops-version-btn:hover {
				background: rgba(255, 255, 255, 0.15);
				border-color: #fff;
				color: #fff;
				transform: translateY(-1px);
			}
		</style>
		<script type="text/javascript" src="../js/ops-stats.js"></script>
		<script type="text/javascript" src="bootstrap.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP server nutný: Pro spuštění Minecraftu v prohlížeči je potřeba webový HTTP/HTTPS server (např. python -m http.server nebo live server).");
				}else {
					
					// %%%%%%%%% launch options %%%%%%%%%%%%
					
					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epw",
						worldsDB: "worlds",
						servers: [
							/* example: { addr: "ws://localhost:8081/", name: "Local test server" } */
						],
						relays: [
							{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId == 0 },
							{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId == 1 },
							{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId == 2 }
						]
					};
					
					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
					
					var q = window.location.search;
					if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
						q = new window.URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}
					
					main();
					if (window.OPS_STATS) {
						window.OPS_STATS.recordSession('mc');
						setInterval(function() {
							window.OPS_STATS.recordPlayTime('mc', 10);
						}, 10000);
					}
				}
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
		<div class="ops-nav-overlay">
			<a href="../index.html" class="ops-nav-btn">
				<span>⬅</span> Zpět na OPS Portál
			</a>
			<a href="v1_8/index.html" class="ops-version-btn" title="Přepnout na starší verzi 1.8.8">
				<span>🔄</span> Verze: 1.12.2 (Nejnovější) &bull; Zkusit 1.8.8
			</a>
		</div>
	</body>
</html>
