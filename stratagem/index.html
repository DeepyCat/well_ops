<!DOCTYPE HTML>

<head>
    <title> Juchelka Hero</title>
   <link rel="icon" type="image/x-icon" href="img/bird.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oxanium">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Verdana">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Geneva">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tahoma">
    <meta charset="UTF-8">
 
    <style>
        .game-config-popup-container {
    display: none;
    justify-content: center;
    align-items: center;
    top: 0;
    left: 0;
    width: 0;
    background-color: rgba(0,0,0,0.7);
        }

        .game-config-popup-container.active {
            display: flex;
            position: fixed;
            width: unset;
            bottom: 0;
            right: 0;
        }

        .game-config-popup {
            display: block;
            background-color: #d9d9d9;
            border-radius: 10px;
            border: 1px solid white;
            padding: 3rem;
        }

        .game-config-popup__title {
            text-align: center;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 0.9rem;
        }

        .game-config-popup__key-bindings {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            grid-template-areas: 
            '. keyup .'
            'keyleft keydown keyright';
        }


        .key-bind-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .key-bind-container input {
            width: 4rem;
            text-align: center;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
            font-size: 1.5em;
            font-weight: 700;
        }
        .key-bind-container--up   {
            grid-area: keyup;
        }
        .key-bind-container--left {
            grid-area: keyleft;
        }
        .key-bind-container--down {
            grid-area: keydown;
        }
        .key-bind-container--right{
            grid-area: keyright;
        }


        .game-config-popup__action-buttons {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 0.625rem;
            margin-top: 1.5rem;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
        }

        a {
            color: #ff0000;
        }

        button {
            border: 0;
            font-family: inherit;
        }

        #root {
            background-color: #000000;
            min-height: 100vh;
            padding: 8px;
            box-sizing: border-box;
        }

        .interactable-center-container {
            top: 50%;
            margin: auto;
            width: 100%;
        }

        .logo-container {
            margin: auto;
            width: 50%;
        }

        .logo {
            margin: auto;
            width: 100%;
        }

        .button {
            background-color: black;
            color: white;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
            font-size: 1.5em;
            font-weight: 700;
            padding: 0.5rem 1rem;
        }

        .title {
            color: #ff0000;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
            width: 50%;
            margin: auto;
            text-align: center;
        }

        .stratagem-name {
            color: white;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
            width: 50%;
            margin: auto;
            padding-top: 10px;
            text-align: center;
        }

        .stratagems-table {
            margin-left: 47.8%;
            align-items: center;
        }

        .stratagem-icon {
            display: block;
            margin: auto;
            width: 3.2em;
        }

        #stratagem-icon-0 {
            opacity: 100%;
        }

        #stratagem-icon-1 {
            opacity: 50%;
        }

        #stratagem-icon-2 {
            opacity: 25%;
        }

        #stratagem-icon-3 {
            opacity: 12.5%;
        }

        .arrows-table {
            margin: auto;
            align-items: center;
        }

        .arrow-image {
            margin: auto;
        }

        .arrow-complete-filter {
            filter: brightness(1) saturate(5);
        }

        .arrow-incomplete-filter {
            filter: grayscale(1) brightness(.8);
        }

        .time-remaining-container {
            width: 50%;
            background-color: black;
            margin: auto;
        }

        #time-remaining-bar {
            height: 20px;
            background-color: #ff0000;
            margin: auto;
        }

        #mobile-button-container {
            margin-top: 1%;
        }

        .mobile-button {
            background-color: #3b0000;
            color: #640000;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
            font-size: 5em;
            padding: 0px 20px;
            text-align: center;
            text-decoration: none;
            display: block;
            margin: auto;
        }
        .info {
            color: gray;
            text-align: center;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
            z-index: -1;
        }

        .larger-info {
            font-size: 2em;
        }

        .game-over-popup {
            background: linear-gradient(145deg, rgba(92, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 1) 61%, rgba(92, 0, 0, 1) 100%);
            z-index: 10;
            padding-block: 20px;
            padding-inline: 10px;
            max-width: 450px;
            margin-inline: auto;
            margin-top: 20px;
            border-radius: 40px 0 40px 0;
            box-shadow: 9px 9px 23px 4px rgba(0,0,0,0.75);
        }

        #completed-strategems-readout {
            color: #ff0000;
            font-family: Oxanium, Verdana, Geneva, Tahoma, sans-serif;
            text-align: left;
            width: max-content;
            max-width: 100%;
            margin-inline: auto;
        }

        #share-button,
        #share-button-spamless,
        #refresh-button {
            background-color: #ad0000;
            color: #ff0000;
            text-align: center;
            text-decoration: none;
            display: block;
            margin: auto;
        }

        #share-button {
            font-size: 2em;
            padding: 15px 32px;
        }

        #share-button-spamless {
            font-size: 1em;
            padding: 15px 32px;
        }

        #refresh-button {
            font-size: 1.7em;
            padding: 10px 20px;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

    </style>
</head>

<body>
    <div style="position: fixed; top: 14px; left: 14px; z-index: 9999;">
        <a href="../index.html" style="text-decoration: none; background: rgba(0, 0, 0, 0.7); border: 1px solid #ff0000; color: #ff0000; padding: 8px 14px; border-radius: 6px; font-family: Oxanium, sans-serif; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            ⬅ Zpět na OPS Portál
        </a>
    </div>
    <div id="root">
        <div class="logo-container">
            <img class="logo" src="./data/Images/juchelka.png">
        </div>

        <h1 class="title">
            STRATAGEM HERO ONLINE
        </h1>

        <div class="interactable-center-container" id="interactable-center-container">
            <h2 class="stratagem-name" id="stratagem-name">
               
            </h2>

            <table class="stratagems-table" id="stratagems-table">
                <tr>
                    <td><img class="stratagem-icon" id="stratagem-icon-0" src="data/Images/stratagem Icons/Strat Resupply mk1.png"></td>
                    <td><img class="stratagem-icon" id="stratagem-icon-1" src="data/Images/stratagem Icons/Strat Resupply mk1.png"></td>
                    <td><img class="stratagem-icon" id="stratagem-icon-2" src="data/Images/stratagem Icons/Strat Resupply mk1.png"></td>
                    <td><img class="stratagem-icon" id="stratagem-icon-3" src="data/Images/stratagem Icons/Strat Resupply mk1.png"></td>
                </tr>
            </table>

            <table class="arrows-table" id="arrows-container">
                <tr>
                    <td><img class="arrow-image" src="data/Images/Arrows/Arrow_4_U.png"></td>
                    <td><img class="arrow-image" src="data/Images/Arrows/Arrow_1_D.png"></td>
                    <td><img class="arrow-image" src="data/Images/Arrows/Arrow_2_L.png"></td>
                    <td><img class="arrow-image" src="data/Images/Arrows/Arrow_3_R.png"></td>
                </tr>
            </table>

            <div class="time-remaining-container">
                <div id="time-remaining-bar"></div>
            </div>

            <div id="mobile-button-container" hidden="hidden">
                <button onclick="keypress('ArrowUp')" class="mobile-button">🡅</button>
                <table class="arrows-table">
                    <tr>
                        <td><button onclick="keypress('ArrowLeft')" class="mobile-button">🡄</button></td>
                        <td><button onclick="keypress('ArrowDown')" class="mobile-button">🡇</button></td>
                        <td><button onclick="keypress('ArrowRight')" class="mobile-button">🡆</button></td>
                    </tr>
                </table>
            </div>  
        </div>

        <div class="game-over-popup" id="game-over-popup" hidden="hidden">
            <h1 class="title" id="score-readout">SCORE: ##</h1>
            <p id="completed-strategems-readout"></p>
            <div>
               
                <button onclick="copyShare()" id="share-button">
                    Share your score!
                </button>

                <br>
               
                <button onclick="copyShare(true)" id="share-button-spamless">
                    Spam Filter Compatible Share
                </button>

            </div>
            <br>
            <button onclick="window.location.reload()" id="refresh-button">
                Reinforce! (Play Again)
                <table class="arrows-table" id="refresh-arrows-container">
                    <tr>
                        <td><img class="arrow-image" src="data/Images/Arrows/Arrow_4_U.png"></td>
                        <td><img class="arrow-image" src="data/Images/Arrows/Arrow_1_D.png"></td>
                        <td><img class="arrow-image" src="data/Images/Arrows/Arrow_2_L.png"></td>
                        <td><img class="arrow-image" src="data/Images/Arrows/Arrow_3_R.png"></td>
                    </tr>
                </table>
            </button>
        </div>

        <div class="game-config-popup-container" id="game-config-popup">
            <div class="game-config-popup">
                <p class="game-config-popup__title">Change your keybinds</p>
                <div class="game-config-popup__key-bindings">
                    <div class="key-bind-container key-bind-container--up">
                        <p>
                            <img class="arrow-image" src="data/Images/Arrows/U - Copy.png">
                        </p>
                        <input name="up" type="text">
                    </div>
                    <div class="key-bind-container key-bind-container--left">
                        <p>
                            <img class="arrow-image" src="data/Images/Arrows/L - Copy.png">
                        </p>
                        <input name="left" type="text">
                    </div>
                    <div class="key-bind-container key-bind-container--down">
                        <p>
                            <img class="arrow-image" src="data/Images/Arrows/D - Copy.png">
                        </p>
                        <input name="down" type="text">
                    </div>
                    <div class="key-bind-container key-bind-container--right">
                        <p>
                            <img class="arrow-image" src="data/Images/Arrows/R - Copy.png">
                        </p>
                        <input name="right" type="text">
                    </div>
                </div>
                <div class="game-config-popup__action-buttons">
                    <button role="button" data-action-type="game-config--save" class="button save-button">save</button>
                    <button role="button" data-action-type="game-config--close" class="button close-button">close</button>
                </div>
            </div>
        </div>
        <div class="info">
            <div class="info__config-actions-container">
                <button role="button" data-action-type="game-config--open" class="button">change keybinds</button>
           
    </div>
</body>

<script type="text/javascript" src="./data/HD2-Sequences.json"></script>
<script type="text/javascript" src="./script.js"></script>
